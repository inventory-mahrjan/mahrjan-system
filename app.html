document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

prow{scrollbar-width:none;-ms-overflow-style:none}\n.chiprow::-webkit-scrollbar{display:none}\n@keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}\n.slip{display:none}\n.a4{display:none}\n@media print{\n  @page{size:110mm auto;margin:0}\n  html,body{background:#fff}\n  .noprint{display:none!important}\n  .slip{display:block!important;width:104mm;padding:3mm;font-family:'IBM Plex Mono',monospace;color:#000}\n  body.a4mode .slip{display:none!important}\n  body.a4mode .a4{display:block!important;color:#000}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"noprint\" style=\"max-width:460px;margin:0 auto;min-height:100vh;background:#f6f6f4;display:flex;flex-direction:column\">\n\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;background:#0d4a28;color:#fff;padding:26px 18px 20px\">\n      <div style=\"flex:none;padding-top:20px;display:flex;flex-direction:column;align-items:flex-start;gap:13px\">\n        <div style=\"background:#ffce12;border-radius:18px;padding:18px 24px;display:inline-block\">\n          <img src=\"29edb071-9331-4ff1-8b15-9d7c0fe6ce46\" alt=\"Mahrjan\" style=\"display:block;height:52px;width:auto\">\n        <\u002Fdiv>\n        <div style=\"font:600 11px/1 Archivo;letter-spacing:.16em;color:rgba(255,255,255,.5)\">VAN SALES<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:none;margin-top:30px\">\n        <div style=\"font:700 8.5px Archivo;letter-spacing:.07em;color:rgba(255,255,255,.5);margin-bottom:6px\">USERNAME<\u002Fdiv>\n        <input value=\"{{ loginName }}\" sc-camel-on-change=\"{{ onLoginName }}\" sc-camel-on-blur=\"{{ onLoginBlur }}\" sc-camel-on-key-down=\"{{ onLoginKey }}\" placeholder=\"Type your name\" sc-camel-auto-complete=\"username\" sc-camel-auto-capitalize=\"characters\" sc-camel-auto-correct=\"off\" sc-camel-spell-check=\"false\" style=\"width:100%;height:54px;border:0;border-radius:11px;padding:0 14px;background:rgba(255,255,255,.15);color:#fff;font:600 15px Archivo;letter-spacing:.02em;outline:none\">\n\n        <div style=\"font:700 8.5px Archivo;letter-spacing:.07em;color:rgba(255,255,255,.5);margin:14px 0 6px\">PASSWORD<\u002Fdiv>\n        <input value=\"{{ loginPass }}\" sc-camel-on-change=\"{{ onLoginPass }}\" sc-camel-on-key-down=\"{{ onLoginKey }}\" type=\"password\" sc-camel-auto-complete=\"current-password\" style=\"width:100%;height:54px;border:0;border-radius:11px;padding:0 14px;background:rgba(255,255,255,.15);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;letter-spacing:.2em;outline:none\">\n\n        <div style=\"display:flex;justify-content:space-between;gap:8px;margin:14px 0 6px;font:700 8.5px Archivo;letter-spacing:.07em;color:rgba(255,255,255,.5)\"><span>COMPANY<\u002Fspan><span style=\"letter-spacing:.02em;font-weight:600\">{{ unitHint }}<\u002Fspan><\u002Fdiv>\n        <div style=\"position:relative\">\n        <sc-raw-select value=\"{{ unitVal }}\" sc-camel-on-change=\"{{ onUnitPick }}\" disabled=\"{{ unitLocked }}\" style=\"width:100%;height:54px;border:0;border-radius:11px;padding:0 40px 0 14px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.15);color:#fff;font:700 15px Archivo;outline:none;cursor:pointer\">\n          <option value=\"AL QUOZ\" style=\"background:#0d4a28;color:#fff\">Al Quoz<\u002Foption>\n          <option value=\"AJMAN\" style=\"background:#0d4a28;color:#fff\">Ajman<\u002Foption>\n        <\u002Fsc-raw-select>\n        <span style=\"position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:#fff;font:700 14px Archivo;opacity:{{ unitCaretOp }}\">\u25be<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isPreviewHost }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ previewIn }}\" style=\"width:100%;height:44px;margin-top:12px;border:1px dashed rgba(255,255,255,.45);border-radius:10px;background:transparent;color:#fff;font:600 12.5px Archivo;cursor:pointer\">Open design preview as admin<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasLoginErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:11px;background:rgba(255,181,158,.16);border:1px solid rgba(255,181,158,.4);border-radius:9px;padding:10px 12px;font:500 12px/1.45 Archivo;color:#ffd6c9\">{{ loginErr }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <button sc-camel-on-click=\"{{ signIn }}\" style=\"width:100%;height:56px;margin-top:14px;border:0;border-radius:11px;background:#fff;color:#0d4a28;font:700 16px Archivo;cursor:pointer\">{{ signInLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"flex:1\"><\u002Fdiv>\n\n      <div style=\"flex:none;padding-top:16px\">\n        <div style=\"font:400 10.5px/1.4 Archivo;color:rgba(255,255,255,.5);margin-bottom:8px\">{{ loginSrc }}<\u002Fdiv>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background:#0d4a28;color:#fff;padding:14px 15px 16px\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:10px\">\n        <div style=\"min-width:0\">\n          <div style=\"font:700 9.5px/1 Archivo;letter-spacing:.14em;color:rgba(255,255,255,.5)\">MAHRJAN GENERAL TRADING<\u002Fdiv>\n          <div style=\"font:700 23px/1.15 Archivo;margin-top:7px\">Day board<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goSetupIfAdmin }}\" style=\"flex:none;text-align:right;background:transparent;border:0;cursor:pointer;padding:0\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:rgba(255,255,255,.9)\">{{ todayLabel }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:5px\">\n            <div style=\"width:6px;height:6px;border-radius:50%;background:{{ sheetDot }};animation:blip 1.8s infini cing:.07em;color:#7a847f\">REQUIRED FOR<\u002Fdiv>\n            <div style=\"font:600 11px Archivo;color:#0d4a28\">{{ reqDateLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:6px\">\n            <input value=\"{{ reqDate }}\" sc-camel-on-change=\"{{ onReqDate }}\" type=\"date\" style=\"flex:1;min-width:0;height:46px;border:1px solid rgba(20,24,26,.15);border-radius:9px;padding:0 12px;background:#fff;color:#14181a;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;outline:none\">\n            <button sc-camel-on-click=\"{{ refreshReq }}\" style=\"flex:none;height:46px;padding:0 14px;border:1px solid #0d4a28;border-radius:9px;background:#fff;color:#0d4a28;font:600 12.5px Archivo;cursor:pointer\">{{ reqRefreshLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;overflow:auto;padding:12px 12px 16px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 8px\">\n            <div style=\"font:600 10px/1 Archivo;letter-spacing:.09em;text-transform:uppercase;color:#7a847f\">Who has entered<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#5c655f\">{{ reqBoardSummary }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ reqBoard }}\" as=\"b\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:10px;background:#fff;border:1px solid rgba(20,24,26,.11);border-radius:10px;padding:11px 12px;margin-bottom:6px\">\n              <div style=\"flex:none;width:10px;height:10px;border-radius:50%;background:{{ b.dot }}\"><\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font:600 13px/1.3 Archivo\">{{ b.name }}<\u002Fdiv>\n                <div style=\"font:400 10.5px Archivo;color:#7a847f;margin-top:2px\">{{ b.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:none;font:700 10.5px Archivo;letter-spacing:.04em;padding:5px 9px;border-radius:999px;background:{{ b.tagBg }};color:{{ b.tagInk }}\">{{ b.tag }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ reqViewOnly }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;overflow:auto;padding:12px 12px 16px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 8px\">\n            <div style=\"font:600 10px/1 Archivo;letter-spacing:.09em;text-transform:uppercase;color:#7a847f\">Asked for {{ reqDateLabel }}<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#5c655f\">{{ reqSummary }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ reqAsked }}\" as=\"a\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:10px;background:#fff;border:1px solid rgba(20,24,26,.11);border-radius:10px;padding:11px 12px;margin-bottom:6px\">\n              <div style=\"flex:1;min-width:0;font:600 12.5px/1.3 Archivo\">{{ a.label }}<\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:#0d4a28;flex:none\">{{ a.qty }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ reqAskedEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:22px 10px;text-align:center;font:400 12.5px/1.5 Archivo;color:#8a938e\">Nothing requested for this date yet.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ canAsk }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#eef0ec;padding:11px 12px 12px;border-bottom:1px solid rgba(20,24,26,.09);position:sticky;top:{{ hdrH }}px;z-index:5\">\n        <div style=\"font:700 8.5px Archivo;letter-spacing:.07em;color:#7a847f;margin-bottom:5px\">SALESMAN<\u002Fdiv>\n        <div style=\"display:flex;gap:6px\">\n          <div style=\"flex:1;min-width:0;height:44px;border-radius:9px;background:#fff;display:flex;align-items:center;padding:0 12px;font:600 13px Archivo;overflow:hidden;white-space:nowrap;text-overflow:ellipsis\">{{ reqManLine }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ submitReq }}\" style=\"flex:none;width:96px;height:44px;border:0;border-radius:9px;background:{{ reqBtnBg }};color:#fff;font:600 14px Archivo;cursor:pointer\">Post<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:10px 0 5px\">\n          <div style=\"font:700 8.5px Archivo;letter-spacing:.07em;color:#7a847f\">REQUIRED FOR<\u002Fdiv>\n          <div style=\"font:600 11px Archivo;color:#0d4a28\">{{ reqDateLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <input value=\"{{ reqDate }}\" sc-camel-on-change=\"{{ onReqDate }}\" type=\"date\" style=\"width:100%;height:46px;border:1px solid rgba(20,24,26,.15);border-radius:9px;padding:0 12px;background:#fff;color:#14181a;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;outline:none\">\n      <\u002Fdiv>\n\n      <div style=\"flex:1;overflow:auto;padding:11px 12px 14px\">\n        <sc-for list=\"{{ reqRows }}\" as=\"r\" hint-placeholder-count=\"10\">\n          <div style=\"background:#fff;border:1px solid {{ r.border }};border-radius:11px;padding:10px 11px;margin-bottom:7px\">\n            <div style=\"font:600 12.5px/1.3 Archivo\">{{ r.label }}<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;margin-top:9px\">\n              <button sc-camel-on-click=\"{{ r.dec }}\" style=\"width:48px;height:46px;border:1px solid rgba(20,24,26,.14);border-radius:9px;background:#f6f6f4;font:600 22px Archivo;color:#14181a;cursor:pointer\">\u2212<\u002Fbutton>\n              <div style=\"flex:1;min-width:0;height:46px;border:1px solid rgba(20,24,26,.16);border-radius:9px;background:#fff;display:flex;align-items:center;gap:5px;padding:0 10px\">\n                <input value=\"{{ r.qty }}\" sc-camel-on-change=\"{{ r.set }}\" sc-camel-on-focus=\"{{ r.focus }}\" sc-camel-input-mode=\"numeric\" style=\"flex:1;min-width:0;width:100%;border:0;outline:none;background:transparent;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:{{ r.qtyInk }}\">\n                <span style=\"font:400 10px Archivo;color:#8a938e;flex:none\">pcs<\u002Fspan>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ r.inc }}\" style=\"width:48px;height:46px;border:1px solid rgba(20,24,26,.14);border-radius:9px;background:#f6f6f4;font:600 22px Archivo;color:#14181a;cursor:pointer\">+<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border-top:1px solid rgba(20,24,26,.1);padding:10px 13px 13px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between\">\n          <div style=\"font:400 12px Archivo;color:#6b7570\">{{ reqSummary }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ clearReq }}\" style=\"border:0;background:transparent;font:600 11.5px Archivo;color:#96331f;cursor:pointer\">Clear all<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ canPrintA4 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border-top:1px solid rgba(20,24,26,.1);padding:11px 13px 13px\">\n          <div style=\"font:400 11px/1.4 Archivo;color:#6b7570;margin-bottom:8px\">{{ a4Count }} \u2014 one A4 sheet, items down and salesmen across.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ printA4 }}\" style=\"width:100%;height:50px;border:0;border-radius:11px;background:#0d4a28;color:#fff;font:600 14px Archivo;cursor:pointer\">Print A4 picking sheet<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStoreIssue }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#eef0ec;padding:11px 12px 12px;border-bottom:1px solid rgba(20,24,26,.09);display:flex;gap:6px;position:sticky;top:{{ hdrH }}px;z-index:5\">\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font:700 8.5px Archivo;letter-spacing:.07em;color:#7a847f;margin-bottom:5px\">SALESMAN<\u002Fdiv>\n          <sc-raw-select value=\"{{ siSm }}\" sc-camel-on-change=\"{{ onSiSm }}\" style=\"width:100%;height:46px;border:1px solid rgba(20,24,26,.15);border-radius:9px;padding:0 10px;background:#fff;color:#14181a;font:600 13px Archivo;outline:none\">\n            <sc-for list=\"{{ siSmOpts }}\" as=\"o\" hint-placeholder-count=\"1\">\n              <option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div style=\"flex:none;width:150px\">\n          <div style=\"font:700 8.5px Archivo;letter-spacing:.07em;color:#7a847f;margin-bottom:5px\">DATE<\u002Fdiv>\n          <input type=\"date\" value=\"{{ siPick }}\" sc-camel-on-change=\"{{ onSiDate }}\" style=\"width:100%;height:46px;border:1px solid rgba(20,24,26,.15);border-radius:9px;padding:0 8px;background:#fff;color:#14181a;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;outline:none\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow:auto;padding:12px 12px 16px\">\n        <sc-for list=\"{{ siMen }}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div style=\"background:#fff;border:1px solid rgba(20,24,26,.11);border-radius:11px;margin-bottom:9px;overflow:hidden\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:9px 11px;background:#f3f6f4;border-bottom:1px solid rgba(20,24,26,.08)\">\n              <div style=\"font:700 13px Archivo;color:#0d4a28\">{{ m.name }}<\u002Fdiv>\n              <div style=\"font:600 10.5px Archivo;color:{{ m.ink }}\">{{ m.tag }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 44px 40px;gap:4px;padding:6px 11px;font:700 9px Archivo;letter-spacing:.05em;color:#7a847f\">\n              <span>ITEM<\u002Fspan><span style=\"text-align:right\">BRD<\u002Fspan><span style=\"text-align:right\">RTN<\u002Fspan><span style=\"text-align:right\">SALES<\u002Fspan><span style=\"text-align:right\">VAR<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ m.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 44px 40px;gap:4px;padding:5px 11px;border-top:1px solid rgba(20,24,26,.06);font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#14181a\">\n                <span style=\"font:600 11.5px Archivo;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.name }}<\u002Fspan><span style=\"text-align:right\">{{ r.brd }}<\u002Fspan><span style=\"text-align:right\">{{ r.rtn }}<\u002Fspan><span style=\"text-align:right\">{{ r.sales }}<\u002Fspan><span style=\"text-align:right;font-weight:700;color:{{ r.ink }}\">{{ r.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 44px 40px;gap:4px;padding:6px 11px;border-top:1px solid rgba(20,24,26,.2);font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700\">\n              <span style=\"font:700 11px Archivo\">TOTAL<\u002Fspan><span style=\"text-align:right\">{{ m.brd }}<\u002Fspan><span style=\"text-align:right\">{{ m.rtn }}<\u002Fspan><span style=\"text-align:right\">{{ m.sales }}<\u002Fspan><span style=\"text-align:right;color:{{ m.ink }}\">{{ m.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ siEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div st        <sc-if value=\"{{ expEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:22px 10px;text-align:center;font:400 12.5px/1.5 Archivo;color:#8a938e\">Nothing logged today. Fuel, parking, shelf rent, credit notes and punctures all go here.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border-top:1px solid rgba(20,24,26,.1);padding:11px 13px 13px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px\">\n          <div style=\"font:600 12px Archivo;color:#3a433d\">Total today<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;color:#0d4a28\">AED {{ expTotal }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ canAsk }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ submitExp }}\" style=\"width:100%;height:54px;border:0;border-radius:11px;background:{{ expBtnBg }};color:#fff;font:600 15px Archivo;cursor:pointer\">Post<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ ofcAskOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(10,20,14,.58);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:16px\">\n      <div style=\"width:100%;max-width:420px;background:#fff;border-radius:16px;padding:20px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.3)\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n          <div style=\"width:26px;height:26px;border-radius:50%;background:#fbf1e6;display:flex;align-items:center;justify-content:center;font:700 15px Archivo;color:#8a5a1f;flex:none\">!<\u002Fdiv>\n          <div style=\"font:700 15px Archivo;color:#14181a\">Change the date?<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f4f6f4;border-radius:11px;padding:13px 14px;margin-bottom:14px\">\n          <div style=\"font:400 12.5px/1.5 Archivo;color:#3a433d\">Petty cash entries will be recorded for<\u002Fdiv>\n          <div style=\"font:700 20px Archivo;color:#8a5a1f;margin-top:4px\">{{ ofcAskLabel }}<\u002Fdiv>\n          <div style=\"font:400 11.5px/1.45 Archivo;color:#6b7570;margin-top:6px\">This is not today. Only continue if you are entering an earlier day's cash.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <button sc-camel-on-click=\"{{ ofcAskYes }}\" style=\"width:100%;height:50px;border:0;border-radius:11px;background:#0d4a28;color:#fff;font:700 14.5px Archivo;cursor:pointer\">Yes, use this date<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ ofcAskNo }}\" style=\"width:100%;height:42px;border:0;border-radius:11px;background:transparent;color:#6b7570;font:600 13.5px Archivo;cursor:pointer\">Cancel \u2014 stay on current date<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ dupOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(10,20,14,.58);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px\">\n      <div style=\"width:100%;max-width:420px;background:#fff;border-radius:16px;padding:20px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.3)\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n          <div style=\"width:26px;height:26px;border-radius:50%;background:#fbf1e6;display:flex;align-items:center;justify-content:center;font:700 15px Archivo;color:#8a5a1f;flex:none\">!<\u002Fdiv>\n          <div style=\"font:700 15px Archivo;color:#14181a\">Scanned already<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f4f6f4;border-radius:11px;padding:13px 14px;margin-bottom:14px\">\n          <div style=\"font:600 13.5px Archivo;color:#14181a;line-height:1.35\">{{ dupName }}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8a938e;margin-top:4px\">{{ dupCode }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:7px;margin-top:10px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:#8a5a1f\">{{ dupQtyLabel }}<\u002Fspan>\n            <span style=\"font:500 11.5px Archivo;color:#6b7570\">{{ dupWhere }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <button sc-camel-on-click=\"{{ dupAdd }}\" style=\"width:100%;height:50px;border:0;border-radius:11px;background:#0d4a28;color:#fff;font:700 14.5px Archivo;cursor:pointer\">Add more to it<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ dupReplace }}\" style=\"width:100%;height:50px;border:1px solid rgba(20,24,26,.18);border-radius:11px;background:#fff;color:#14181a;font:600 14.5px Archivo;cursor:pointer\">Replace with a new count<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ dupCancel }}\" style=\"width:100%;height:42px;border:0;border-radius:11px;background:transparent;color:#6b7570;font:600 13.5px Archivo;cursor:pointer\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ offOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(10,20,14,.58);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:16px\">\n      <div style=\"width:100%;max-width:420px;background:#fff;border-radius:16px;padding:20px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.3)\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n          <div style=\"width:26px;height:26px;border-radius:50%;background:#f3eef7;display:flex;align-items:center;justify-content:center;font:700 14px Archivo;color:#5c4080;flex:none\">!<\u002Fdiv>\n e=\"font:700 15pt/1.15 Archivo;color:#0d4a28\">MAHRJAN GENERAL TRADING LLC<\u002Fdiv>\n      <div style=\"font:400 9pt Archivo;color:#3a433d;margin-top:1mm\">{{ placeLine }} \u2014 STORE REQUIREMENT<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:right\">\n      <div style=\"display:flex;align-items:baseline;justify-content:flex-end;gap:2.5mm;white-space:nowrap\"><span style=\"font:700 8pt Archivo;letter-spacing:.1em;color:#5c655f\">REQUIRED FOR<\u002Fspan><span style=\"font:700 13pt Archivo;color:#14181a\">{{ a4Date }}<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8pt;color:#5c655f;margin-top:1mm;white-space:nowrap\">RAISED {{ a4Raised }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-top:3mm;font-family:'IBM Plex Mono',monospace\">\n    <sc-raw-thead>\n      <sc-raw-tr>\n        <sc-raw-th style=\"text-align:left;font:700 7.5pt Archivo;letter-spacing:.06em;color:#3a433d;padding:2mm 2mm 2mm 0;border-bottom:1px solid #14181a;width:52mm\">ITEM<\u002Fsc-raw-th>\n        <sc-for list=\"{{ a4Men }}\" as=\"m\" hint-placeholder-count=\"5\">\n          <sc-raw-th style=\"text-align:center;font:700 7.5pt Archivo;color:#3a433d;padding:2mm 1mm;border-bottom:1px solid #14181a;border-left:1px solid #e0e4e0\">{{ m }}<\u002Fsc-raw-th>\n        <\u002Fsc-for>\n        <sc-raw-th style=\"text-align:center;font:700 7.5pt Archivo;letter-spacing:.06em;color:#0d4a28;padding:2mm 0 2mm 2mm;border-bottom:1px solid #14181a;border-left:2px solid #0d4a28;width:20mm\">PICK<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-for list=\"{{ a4Rows }}\" as=\"r\" hint-placeholder-count=\"10\">\n        <sc-raw-tr style=\"background:{{ r.zebra }}\">\n          <sc-raw-td style=\"font:600 8.5pt Archivo;color:#14181a;padding:0.9mm 2mm 0.9mm 0;border-bottom:1px solid #ecefec\">{{ r.name }}<\u002Fsc-raw-td>\n          <sc-for list=\"{{ r. ding-top:1mm;font-size:10px;font-weight:700\">RAW EGG<\u002Fdiv>\n      <sc-for list=\"{{ rawSlipRows }}\" as=\"s\" hint-placeholder-count=\"1\">\n        <div style=\"font-size:9px;line-height:1.5;padding:1mm 0;border-bottom:1px dotted #999\">\n          <div style=\"display:flex;justify-content:space-between;gap:2mm\">\n            <span>{{ s.code }}<\u002Fspan><span style=\"font-weight:600\">{{ s.qty }}<\u002Fspan>\n          <\u002Fdiv>\n          <div>{{ s.name }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"border-top:1px dashed #000;padding-top:1mm;font-size:10px;font-weight:600;display:flex;justify-content:space-between\">\n        <span>TOTAL RAW EGG<\u002Fspan><span>{{ rawSlipTotal }} PCS<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"font-size:9px;display:flex;justify-content:space-between;padding-top:.5mm\">\n      <span>LINES<\u002Fspan><span>{{ slipLines }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ slipIsReturn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"font-size:8px;font-weight:700;display:flex;padding:1.5mm 0 1mm;border-bottom:1px solid #000\">\n      <span style=\"flex:1;min-width:0\">ITEM<\u002Fspan>\n      <span style=\"flex:none;width:10mm;text-align:right\">BRD<\u002Fspan>\n      <span style=\"flex:none;width:10mm;text-align:right\">SOLD<\u002Fspan>\n      <span style=\"flex:none;width:10mm;text-align:right\">GOOD<\u002Fspan>\n      <span style=\"flex:none;width:9mm;text-align:right\">DMG<\u002Fspan>\n      <span style=\"flex:none;width:9mm;text-align:right\">EXP<\u002Fspan>\n      <span style=\"flex:none;width:9mm;text-align:right\">WST<\u002Fspan>\n      <span style=\"flex:none;width:9mm;text-align:right\">FOC<\u002Fspan>\n      <span style=\"flex:none;width:10mm;text-align:right\">VAR<\u002Fspan>\n    <\u002Fdiv>\n    <div>\n      <sc-for list=\"{{ retRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n        <div style=\"display:flex;align-items:cen n&quot;:&quot;Field conditions&quot;},&quot;touchSize&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;compact&quot;,&quot;standard&quot;,&quot;gloves&quot;],&quot;default&quot;:&quot;standard&quot;,&quot;tsType&quot;:&quot;'compact' | 'standard' | 'gloves'&quot;,&quot;section&quot;:&quot;Field conditions&quot;},&quot;feedback&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;quiet&quot;,&quot;vibrate&quot;,&quot;tone&quot;],&quot;default&quot;:&quot;vibrate&quot;,&quot;tsType&quot;:&quot;'quiet' | 'vibrate' | 'tone'&quot;,&quot;section&quot;:&quot;Feedback&quot;}}\">\nclass Component extends DCLogic {\n  // The \"Van Sales live\" deployment. Redeploying that same deployment with a\n  // new version keeps this URL, so this never needs changing.\n  ENDPOINT = 'https://sheet.mahrjan.local/AL%20QUOZ/exec';\n  // One sheet per company. Paste the Ajman sheet's \"Van Sales live\" web app URL here.\n  ENDPOINTS = { 'AL QUOZ': this.ENDPOINT, 'AJMAN': 'https://sheet.mahrjan.local/AJMAN/exec' };\n  UNIT_LABEL = { 'AL QUOZ': 'Al Quoz', 'AJMAN': 'Ajman' };\n  PLACE = { 'AL QUOZ': 'AL QUOZ, DUBAI', 'AJMAN': 'AJMAN' };\n  unit = 'AL QUOZ';\n  // Each company keeps its own copy on the phone, so Al Quoz and Ajman never mix.\n  lk(k) { return this.unit === 'AJMAN' && k !== 'vs2_unit' && k !== 'vs2_kbd' ? k.replace(/^vs2_/, 'vs2aj_') : k; }\n  urlFor(u) { let v = null; try { v = localStorage.getItem(u === 'AJMAN' ? 'vs2aj_endpoint' : 'vs2_endpoint'); } catch (e) {} return v || this.ENDPOINTS[u] || ''; }\n  // Looks up which company a username belongs to (same login list behind both sheets).\n  // Unknown names come back as Al Quoz, so this does not reveal who exists.\n  queueUnitLookup(ms) { clearTimeout(this._ut); this._ut = setTimeout(() => this.lookupUnit(), ms); }\n  async lookupUnit() {\n    const name = String(this.state.loginName || '').replace(/\\s+/g, ' ').trim().toUpperCase();\n    if (name.length < 2 || (this._ch && this._ch.name == 4'],\n    ['ASIN JOLLY', 'INTNL CITY', '79389'],\n  ];\n\n  // LOGIN table \u2014 USERNAME \u00b7 PASSWORD \u00b7 USER TYPE. Pulled from the sheet\n  // when the script is linked; this copy is the offline fallback.\n  LOGIN = []; // users now come from the portal login sheet\n\n  CATS = [\n    { key: 'good', label: 'GOOD', tone: '#147b3d', bg: '#eaf5ec' },\n    { key: 'dmg', label: 'DMG', tone: '#96331f', bg: '#fbeeea' },\n    { key: 'exp', label: 'EXP', tone: '#8a5a1f', bg: '#fbf1e6' },\n    { key: 'wst', label: 'WST', tone: '#5e5547', bg: '#f1eee8' },\n    { key: 'foc', label: 'FOC', tone: '#31557a', bg: '#e9f0f6' },\n  ];\n  ZERO = { good: 0, dmg: 0, exp: 0, wst: 0, foc: 0 };\n\n  // Cartons come back from the route and the company pays the salesman\n  // per piece, so these two are entered as a count, not an amount.\n  CARTON_RATE = { 'CARTON SMALL': 0.50, 'CARTON BIG': 0.25 };\n\n  EXPTYPES = [\n    { key: 'FUEL', label: 'Fuel' },\n    { key: 'PARKING', label: 'Parking' },\n    { key: 'CREDIT NOTE', label: 'Credit note' },\n    { key: 'SHELF RENT', label: 'Shelf rent' },\n    { key: 'OTHER', label: 'Other' },\n  ];\n\n  MODULES = [\n    { key: 'summary', label: 'Summary', tag: 'LIVE' },\n    { key: 'requirement', label: 'Requirement', tag: 'LIVE' },\n    { key: 'storeissue', label: 'Store Issue', tag: 'LIVE' },\n    { key: 'board', label: 'Board', tag: 'LIVE' },\n    { key: 'sales', label: 'Sales', tag: 'LIVE' },\n    { key: 'return', label: 'Return', tag: 'LIVE' },\n    { key: 'collection', label: 'Collection', tag: 'LIVE' },\n    { key: 'office', label: 'Petty cash', tag: 'LIVE' },\n    { key: 'reports', label: 'Reports', tag: 'LIVE' },\n    { key: 'delinv', label: 'Delete invoice', tag: 'LIVE' },\n    { key: 'expense', label: 'Expense', tag: 'LIVE' },\n  ];\n\n  state = {\n    user: null,\n    users: null,\n    loginName: '',\n    loginPass: '',\n    loginErr: null,\n    pickOpen: false,\n    pickQ: '',\n    pwOld: '',\n    pwNew: '',\n    pwConf: '',\n    pwMsg: null,\n    pwOk: true,\n    screen: 'home',\n    mod: 'board',\n    salesman: '',\n    picked: '',\n    items: null,\n    route: null,\n    boards: {},\n    rets: {},\n    sales: {},\n    reqs: {},\n    reqDate: '',\n    exps: {},\n    expType: 'FUEL',\n    expAmt: '',\n    expQty: '',\n    expRate: '',\n    expNote: '',\n    expQ: '', expCust: '', expHead: '', expPicked: false,\n    expErr: null,\n    scanCode: '',\n    scanItem: null,\n    scanQty: '',\n    retQ: { good: '', dmg: '', exp: '', wst: '', foc: '' },\n    dupCode: null,\n    dupQty: 0,\n    dupMode: 'add',\n    offCode: null,\n    sent: { boards: {}, rets: {} },\n    cols: {},\n    office: {},\n    ofcDir: 'IN',\n    ofcRef: '',\n    ofcParty: '',\n    ofcAmt: '',\n    ofcNote: '',\n    ofcErr: null,\n    ofcDay: null,\n    cashInfo: null,\n    temps: {},\n    vans: {},\n    vanErr: null,\n    tempIn: {},\n    tempErr: null,\n    cashLoading: false,\n    delDate: '',\n    delInv: '',\n    delUser: '',\n    delList: null,\n    delBusy: false,\n    delErr: null,\n    delLoadErr: null,\n    rptName: 'LOADING SHEET',\n    rptDate: '',\n    rptData: null,\n    rptLoading: false,\n    rptErr: null,\n    ofcFor: '',\n    ofcSus: 'GIVE',\n    ofcDayAsk: null,\n    colTran: '',\n    colInv: '',\n    colHead: '',\n    colCust: '',\n    colAmt: '',\n    colMode: 'CASH',\n    colErr: null,\n    colForce: false,\n    scanMsg: null,\n    scanOk: true,\n    cat: 'good',\n    endpoint: '',\n    endpointDraft: '',\n    testMsg: null,\n    toast: null,\n    pulling: false,\n    pulledAt: null,\n  };\n\n  componentDidMount() {\n    setTimeout(() => this.applyLook(), 0);\n    // Installable app: the service worker is registered from inside the app,\n    // because the page is rebuilt when it unpacks.\n    try { if ('serviceWorker' in navigator && /github\\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}\n    // Every phone is linked on install. Admin can still point one elsewhere\n    // from Sheet settings, and that choice wins over this default.\n    try { this._init = JSON.parse(JSON.stringify(this.state)); } catch (e) { this._init = Object.assign({}, this.state); }\n    this.unit = this.ls('vs2_unit') === 'AJMAN' ? 'AJMAN' : 'AL QUOZ';\n    const url = this.urlFor(this.unit);\n    this.restore();\n    let user = null;\n    try { const raw = this.ls('vs2_user'); if (raw) user = JSON.parse(raw); } catch (e) {}\n    if (user && !user.token) { user = null; this.lsSet('vs2_user', ''); } // old login: sign in once with the portal password\n    // Branch lock: a one-unit login that finds the phone on the other unit signs in again (the login picks the right unit).\n    if (user && (user.unit === 'AL QUOZ' || user.unit === 'AJMAN') && user.unit !== this.unit) { user = null; this.lsSet('vs2_user', ''); }\n    const own = user && user.role === 'SALESMAN' ? (user.salesman || user.name) : '';\n    // Launch uses the safe refresh \u2014 a supervisor who closed the app\n    // mid-count must find his scanned lines still there.\n    this.setState({ endpoint: url, endpointDraft: url, user, salesman: own, picked: own }, () => { if (url) this.pullDay(true); });\n    this._onKey = e => {\n      if (this.state.screen !== 'module') return;\n      if (this.state.mod !== 'board' && this.state.mod !== 'return') return;\n      const tag = e.target && e.target.tagName;\n      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'SELECT') return;\n      if (e.key && (e.key.length === 1 || e.key === 'Enter') && !this.state.dupCode && !this.state.offCode) this.focusCode(true);\n    };\n    window.addEventListener('keydown', this._onKey, true);\n    this._onWake = () => { if (document.visibilityState !== 'hidden') this.dayChanged(); };\n    document.addEventListener('visibilitychange', this._onWake);\n    window.addEventListener('focus', this._onWake);\n    this._dayTimer = setInterval(() => this.dayChanged(), 60000);\n    // Ke
