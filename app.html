<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d4a28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Mahrjan Van Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--dk:#0d4a28;--dk2:#145c33;--acc:#117537;--yel:#ffce12;--bg:#f1f1ec;--card:#fff;--ink:#1b1f1e;--mut:#7b827e;--line:#e3e4de;--neg:#a5321f;--amb:#a8650f;
    font-family:Archivo,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;min-height:100vh}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
  html{background:#dfe3dc}
  button,input,select{font:inherit} button{cursor:pointer}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  .cap{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
  /* login */
  .login{min-height:100vh;background:var(--dk);color:#fff;padding:46px 18px 24px;display:flex;flex-direction:column}
  .logo{background:var(--yel);border-radius:16px;width:176px;height:88px;display:grid;place-items:center;overflow:hidden}
  .logo img{height:64px}
  .login .unit{font-size:12px;letter-spacing:.14em;color:#9fc2ad;margin:14px 0 26px;font-weight:600}
  .login label{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;color:#9fc2ad;margin:14px 0 8px}
  .login input{width:100%;height:54px;border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;padding:0 14px;font-size:16px;outline:none}
  .login input::placeholder{color:rgba(255,255,255,.45)}
  .login .go{margin-top:22px;height:56px;border:0;border-radius:12px;background:#fff;color:var(--dk);font-weight:700;font-size:17px;width:100%}
  .login small{margin-top:auto;color:#9fc2ad;font-size:12px}
  /* header */
  .hd{background:var(--dk);color:#fff;padding:16px 15px 12px}
  .hd .r1{display:flex;justify-content:space-between;align-items:flex-start}
  .hd h1{margin:4px 0 0;font-size:24px;font-weight:700}
  .hd .dt{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;text-align:right}
  .hd .ok{font-size:11.5px;color:#cfe3d5;text-align:right;margin-top:3px}.hd .ok:before{content:'● ';color:#66c08a}
  .pick{position:relative;margin-top:14px}
  .pickbtn{width:100%;height:50px;border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:16px;text-align:left;padding:0 14px;display:flex;justify-content:space-between;align-items:center}
  .plist{position:absolute;left:0;right:0;top:56px;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;color:var(--ink);max-height:60vh;overflow:auto}
  .plist input{margin:8px;width:calc(100% - 16px);height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px}
  .plist button{display:flex;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--line);background:#fff;padding:13px 14px;font-weight:700;font-size:15px;text-align:left}
  .plist button span{font-family:'IBM Plex Mono',monospace;font-weight:400;color:var(--mut);font-size:12px}
  .hd .r3{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:#cfe3d5}
  .pill{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:12px}
  /* board home */
  .wrap{padding:12px}
  .bal{background:#7fa38b;color:#fff;border-radius:16px;padding:16px 15px;margin-bottom:14px}
  .bal.on{background:var(--acc)}
  .bal .big{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;margin-top:6px}
  .bal .three{display:flex;gap:28px;border-top:1px solid rgba(255,255,255,.25);margin-top:12px;padding-top:10px}
  .bal .three div{font-family:'IBM Plex Mono',monospace;font-size:16px}.bal .cap{color:#e0eee5}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 12px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:6px}
  .tile b{font-size:14px}.tile .n{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--acc)}.tile small{color:var(--mut);font-size:11px}
  .tile.amb .n{color:#b08a5a}
  .tile:disabled{opacity:.55}
  .row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;width:100%;text-align:left}
  .row b{display:block;font-size:14px}.row small{color:var(--mut);font-size:11.5px}.row .end{margin-left:auto;color:var(--mut);font-size:12.5px}
  .row.dash{border-style:dashed;background:transparent}
  table.sm{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  table.sm th{background:#e8f3ee;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#4c5550;padding:9px 10px;text-align:center;font-weight:600}
  table.sm th:first-child,table.sm td:first-child{text-align:left}
  table.sm td{border-top:1px solid var(--line);padding:11px 10px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px}
  table.sm td b{font-family:Archivo,Helvetica,Arial,sans-serif;font-size:15px;display:block}table.sm td small{color:var(--mut);font-size:11px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .btn{height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:15px}
  .btn.p{background:var(--dk);border-color:var(--dk);color:#fff}.btn.p:disabled{background:#8fa898;border-color:#8fa898}
  .btn.d{color:var(--neg)}
  /* module screens */
  .mh{background:var(--dk);color:#fff;padding:12px 14px 10px;position:sticky;top:0;z-index:10}
  .mh .r1{display:flex;align-items:center;gap:12px}
  .back{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px}
  .mh h2{margin:0;font-size:19px}.mh .sub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#cfe3d5;margin-top:2px}
  .mh .open{margin-left:auto;text-align:center}.mh .open b{display:block;font-family:'IBM Plex Mono',monospace;font-size:20px;color:#8be0a8}.mh .open span{font-size:9.5px;letter-spacing:.12em;color:#cfe3d5}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;border:0;border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:13.5px}
  .tabs button.on{background:#fff;color:var(--dk)}
  .scan{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .addb{border:0;background:#d4d8d2;color:#fff;border-radius:8px;padding:7px 14px;font-weight:700;font-size:12px;letter-spacing:.08em}.addb.on{background:var(--acc)}
  .bc{width:100%;height:56px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:18px;padding:0 14px;outline:none}
  .bc:focus{border-color:var(--acc)}
  .disp{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:60px;padding:8px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .disp .nm{font-weight:600;font-size:14px}.disp .nm small{display:block;color:var(--mut);font-weight:400;font-size:11.5px}
  .disp .q{font-family:'IBM Plex Mono',monospace;font-size:30px;color:#c8ccc7;text-align:right;line-height:1}.disp .q.on{color:var(--ink)}.disp .q small{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--mut)}
  .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
  .chips button{height:56px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .chips button span{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--mut)}.chips button b{font-family:'IBM Plex Mono',monospace;font-size:16px}
  .chips button.on{border:2px solid var(--acc);background:#eef7f1}.chips button.on span{color:var(--acc)}
  .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .kp button{height:54px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600}
  .kp button.c{background:#eceee9;color:var(--neg)}.kp button.x{background:#eceee9;font-size:16px}.kp button.nx{background:#eceee9;color:var(--acc);font-size:17px}
  .okb{width:100%;height:54px;margin-top:8px;border:0;border-radius:12px;background:var(--dk);color:#fff;font-weight:700;font-size:16px}.okb:disabled{background:#c5cbc5}
  .lines{border-top:1px solid var(--line);margin:14px -12px 0;padding:12px}
  .lines .hdr{display:flex;justify-content:space-between}
  .ln{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
  .ln b{font-size:13.5px}.ln small{display:block;color:var(--mut);font-size:11px}.ln .q{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:15px;text-align:right}
  .ln .del{border:0;background:none;color:var(--neg);font-size:18px;padding:4px 6px}
  .ln.bad{border-color:#f0c6bd}.ln.ok{border-color:#c6e3cf}
  .empty{color:var(--mut);text-align:center;padding:20px 0;font-size:13.5px}
  .foot{background:#fff;border-top:1px solid var(--line);padding:12px;position:sticky;bottom:0}
  .foot .f4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
  .foot label{display:flex;flex-direction:column;gap:5px;font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--mut);text-align:center;text-transform:uppercase}
  .foot input,.foot select{height:46px;border:1px solid var(--line);border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:center;width:100%;min-width:0;background:#fff}
  .post{width:100%;height:56px;border:0;border-radius:12px;background:var(--dk);color:#fff;font-weight:700;font-size:17px}.post:disabled{background:#8fa898}
  .card2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border:0}.kv b{font-family:'IBM Plex Mono',monospace}
  .fld{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.fld span{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
  .fld input,.fld select{height:48px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px;background:#fff;width:100%}
  .st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eef0ec}
  .brsw{display:flex;gap:4px;margin-top:6px;justify-content:flex-end}
  .brsw button{border:1px solid rgba(255,255,255,.45);background:none;color:#fff;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600}
  .brsw button.on{background:#fff;color:var(--dk);border-color:#fff}
  .chipset{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
  .chipset button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:600;font-size:13px}
  .chipset button.on{background:var(--dk);color:#fff;border-color:var(--dk)}
  .big2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .big2 button{height:84px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 14px;gap:4px}
  .big2 button small{font-weight:400;color:var(--mut);font-size:11.5px}
  .big2 button.on{background:var(--dk);color:#fff;border-color:var(--dk)}.big2 button.on small{color:#cfe3d5}
  .grid-in{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:6px;align-items:center;margin-top:6px}
  .grid-in input{height:42px;border:1px solid var(--line);border-radius:10px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px;width:100%;min-width:0}
  .grid-in .lbl{font-size:12.5px;font-weight:600}.grid-in .lbl small{display:block;color:var(--mut);font-weight:400;font-size:11px}
  .gh{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--mut);text-align:center;text-transform:uppercase}
  .msg{position:fixed;bottom:18px;left:12px;right:12px;padding:13px 16px;border-radius:12px;color:#fff;z-index:50;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .msg.ok{background:var(--dk)}.msg.er{background:var(--neg)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://xhndwjkqfqmmpfcglqzu.supabase.co', 'sb_publishable_emOqI1PWaSA7B5s56v-ERg_RrxZ9weu');
const EMAIL_DOMAIN = '@mahrjan.app';
const LOGO = 'mahrjan-logo.jpeg';

const S = { me:null, items:[], staff:[], vans:[], branches:[], date:today(), sm:null, mod:null, stats:{}, br:null };
const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isNaN(n) ? 0 : n; };
const money = v => num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function today(off=0){ return new Date(Date.now()+off*864e5).toLocaleDateString('en-CA',{timeZone:'Asia/Dubai'}); }
const dLabel = d => new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,'-').toUpperCase();
const nowHM = () => new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Dubai',hour:'2-digit',minute:'2-digit'});
function toast(t, ok=true){ const m=document.createElement('div'); m.className='msg '+(ok?'ok':'er'); m.textContent=t; document.body.appendChild(m); setTimeout(()=>m.remove(), ok?2200:5500); }
async function q(p){ const { data, error } = await p; if (error) { toast(error.message, false); throw error; } return data; }
const rpc = (fn, a) => q(sb.rpc(fn, a));
window.addEventListener('unhandledrejection', e => { if (e.reason && (e.reason.message || e.reason.code)) e.preventDefault(); });
const has = (...r) => r.includes(S.me?.role);
// ---------- role access (Admin → Role access). Falls back to the built-in defaults until the table exists ----------
const ACC_DEF = { V:{ ACCOUNTANT:'ov dd load ret days settle close wh ite sc itstock imp req ds pc se wo qs sa lr vl co ex dc', RECEIVER:'load ret days wh ite sc req', SALESMAN:'days req', VIEWER:'ov dd days wh ite sc ds pc se wo qs sa lr vl co ex dc', PACKER:'' },
                  E:{ ACCOUNTANT:'load ret days settle close wh sc itstock imp req pc', RECEIVER:'load ret wh sc req', SALESMAN:'days req', VIEWER:'', PACKER:'' } };
async function loadAccess(){ const { data, error } = await sb.from('role_access').select('module,can_view,can_edit').eq('role', S.me.role);
  S.acc = error || !data?.length ? null : Object.fromEntries(data.map(a => [a.module, a])); }
const canE = m => S.me?.role === 'ADMIN' || (S.acc ? !!S.acc[m]?.can_edit : (ACC_DEF.E[S.me?.role] || '').split(' ').includes(m));
const canV = m => S.me?.role === 'ADMIN' || canE(m) || (S.acc ? !!S.acc[m]?.can_view : (ACC_DEF.V[S.me?.role] || '').split(' ').includes(m));

const itemById = id => S.items.find(i => i.id === id) || {};
const itemByCode = c => S.items.find(i => i.active && i.item_type !== 'MATERIAL' && (i.barcode === c || i.itrade_code === c));
const iname = it => it.short_name || it.name || '';
const inBr = b => b == null || b === S.br;
const salesmen = () => S.staff.filter(s => s.role === 'SALESMAN' && s.active && s.branch_id === S.br);
const brVans = () => S.vans.filter(v => v.branch_id === S.br);
const smName = id => S.staff.find(s => s.id === id)?.name || '';

sb.auth.onAuthStateChange(e => { if (e === 'SIGNED_OUT') renderLogin(); });
const { data:{ session } } = await sb.auth.getSession();
session ? boot() : renderLogin();

// ---------------- LOGIN ----------------
function renderLogin(){
  $('#app').innerHTML = `<div class="login">
    <div class="logo"><img src="${LOGO}" alt="Mahrjan"></div><div class="unit">VAN SALES</div>
    <label>USERNAME</label><input id="u" placeholder="Type your name" autocomplete="off" autocapitalize="none" spellcheck="false">
    <label>PASSWORD</label><input id="pw" type="password" autocomplete="new-password">
    <button class="go" id="go">Sign in</button>
    <small>Use the same username and password as the Mahrjan Sales Portal.</small></div>`;
  const go = async () => {
    const u = $('#u').value.trim().toLowerCase(); if (!u) return;
    const { error } = await sb.auth.signInWithPassword({ email: u.includes('@') ? u : u + EMAIL_DOMAIN, password: $('#pw').value.trim() });
    if (error) return toast('Sign in failed: ' + error.message, false);
    boot();
  };
  $('#go').onclick = go; $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function boot(){
  S.me = await rpc('me');
  if (!S.me || !S.me.role) { toast('This login is not linked to an active staff member', false); await sb.auth.signOut(); return; }
  const [items, staff, vans, branches] = await Promise.all([
    q(sb.from('items').select('*')), q(sb.from('staff').select('id,name,role,branch_id,active').order('name')),
    q(sb.from('vans').select('*').eq('active', true).order('van_no')), q(sb.from('branches').select('*'))]);
  Object.assign(S, { items, staff, vans, branches });
  await loadAccess();
  S.br = S.me.branch_id || (+localStorage.getItem('mj_branch') || null) || branches.find(b => b.code === 'MGAZ')?.id;
  if (S.me.role === 'SALESMAN') S.sm = S.me.id;
  home();
}

// ---------------- DAY BOARD ----------------
async function loadStats(){
  const days = await q(sb.from('van_day').select('*').eq('business_date', S.date).eq('branch_id', S.br));
  const rec = days.length ? await q(sb.from('v_van_day_items').select('*').in('van_day_id', days.map(d=>d.id))) : [];
  const cash = days.length ? await q(sb.from('v_van_day_cash').select('*').in('van_day_id', days.map(d=>d.id))) : [];
  S.stats = {};
  for (const d of days) {
    const r = rec.filter(x => x.van_day_id === d.id), c = cash.find(x => x.van_day_id === d.id) || {};
    const sum = k => r.reduce((a,x)=>a+num(x[k]),0);
    const board = sum('load'), sale = sum('sale') - sum('grv'), ret = sum('total_return');
    S.stats[d.salesman_id] = { day:d, board, sale, ret, open: board - sale - ret, cash:c };
  }
}
async function home(){
  S.mod = null; await loadStats();
  const st = S.sm ? S.stats[S.sm] : null, d = st?.day;
  const route = id => { const r = salesmen().find(s=>s.id===id); return r ? '' : ''; };
  const vanOf = id => S.vans.find(v => v.id === S.stats[id]?.day?.van_id)?.van_no || '';
  const brName = S.branches.find(b => b.id === S.br)?.name || '';
  const brSwitch = S.me.branch_id ? `<div class="ok">${esc(brName)} · Linked</div>`
    : `<div class="brsw">${S.branches.map(b => `<button data-br="${b.id}" class="${b.id===S.br?'on':''}">${esc(b.name)}</button>`).join('')}</div>`;
  $('#app').innerHTML = `
  <div class="hd"><div class="r1"><div><div class="cap" style="color:#cfe3d5">Mahrjan General Trading</div><h1>Day board</h1></div>
    <div><div class="dt">${dLabel(S.date)}</div>${brSwitch}</div></div>
    ${S.me.role === 'SALESMAN' ? '' : `<div class="pick"><button class="pickbtn" id="pk"><span>${S.sm ? esc(smName(S.sm)) : 'Select a salesman'}</span><span>⌄</span></button><div id="pl"></div></div>`}
    <div class="r3"><span>${S.sm ? 'Choose a module' : 'Pick a salesman, then choose a module'}</span>
      <button class="pill" id="out">${esc(S.me.name)} · Sign out</button></div></div>
  <div class="wrap">

// ---------------- RawBT printing (same method as the current app: ESC/POS via Android intent) ----------------
const PW = 64;
const padR = (s,n) => { s = String(s); return s.length >= n ? s.slice(0,n) : s + ' '.repeat(n - s.length); };
const lr = (a,b) => { a = String(a); b = String(b); return a.length + b.length + 1 > PW ? padR(a,PW) + '\n' + ' '.repeat(Math.max(PW - b.length,0)) + b : a + ' '.repeat(PW - a.length - b.length) + b; };
const ctr = s => { s = String(s); return ' '.repeat(Math.max(0, Math.floor((PW - s.length)/2))) + s; };
const rule = ch => (ch || '-').repeat(PW);
const ascii = s => String(s).replace(/[^\x0A\x20-\x7E]/g, '');
function printSlip(text, code){
  const body = ascii(text);
  const bc = code ? '\x1ba\x01\x1dh\x50\x1dw\x02\x1dH\x02\x1dk\x49' + String.fromCharCode(String(code).length + 2) + '{B' + code + '\n\x1ba\x00' : '';
  const parts = body.split('[[BARCODE]]'), raw = '\x1b@' + '\x1dL\x20\x00' + parts[0] + (parts.length > 1 ? bc + parts[1] : '') + '\n\n\n';
  if (/Android/i.test(navigator.userAgent)) {
    try { location.href = 'intent:base64,' + btoa(raw) + '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'; toast('Sending to RawBT…'); return; } catch (e) {}
  }
  const plain = parts.join(code ? '[' + code + ']' : '');
  if (navigator.share) { navigator.share({ title:'Mahrjan slip', text:plain }).catch(()=>{}); return; }
  if (navigator.clipboard) { navigator.clipboard.writeText(plain).then(() => toast('Slip copied — paste into RawBT'), () => toast('Printing not supported here', false)); return; }
  toast('Printing not supported here', false);
}
const slipTop = title => [ctr('MAHRJAN GENERAL TRADING'), ctr((S.branches.find(b=>b.id===S.br)?.name || '').toUpperCase()), ctr(title), rule('=')];
const nowStamp = () => new Date().toLocaleString('en-GB',{timeZone:'Asia/Dubai',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function boardSlip(kind, lines, extra){
  const d = S.stats[S.sm]?.day, van = S.vans.find(v => v.id === d?.van_id)?.van_no || '';
  const L = slipTop(kind === 'board' ? 'BOARD / LOADING SLIP' : 'RETURN SLIP');
  L.push(lr('Salesman: ' + smName(S.sm), 'Van: ' + van), lr('Date: ' + dLabel(S.date), 'Printed: ' + nowStamp()), rule());
  if (kind === 'board') { L.push(lr('ITEM', 'QTY')); lines.forEach(l => L.push(lr(iname(itemById(l.id)), l.qty))); L.push(rule(), lr('TOTAL', lines.reduce((a,l)=>a+num(l.qty),0))); }
  else { L.push(lr('ITEM', 'GOOD DMG EXP WST FOC')); lines.forEach(([id,v]) => L.push(lr(iname(itemById(+id)), [v.good,v.damage,v.expiry,v.waste,v.foc].map(x=>String(num(x)).padStart(3)).join(' ')))); }
  if (extra) L.push(rule(), ...extra);
  L.push('', '', lr('Salesman sign: ____________', 'Receiver sign: ____________'));
  printSlip(L.join('\n'));
}

      <div class="grid-in" style="grid-template-columns:1.4fr repeat(4,1fr)"><span></span><span class="gh">Good</span><span class="gh">Near exp</span><span class="gh">Broken</span><span class="gh">Waste</span></div>
      ${Object.entries(given).map(([r,g]) => `<div class="grid-in" data-m="${r}" data-g="${Math.round(g)}" style="grid-template-columns:1.4fr repeat(4,1fr)"><span class="lbl">${esc(iname(itemById(+r)))}<small>given ${Math.round(g)} · diff <b class="df">0</b></small></span>
        <input data-k="good" type="number" inputmode="numeric"><input data-k="near" type="number" inputmode="numeric"><input data-k="broken" type="number" inputmode="numeric"><input data-k="waste" type="number" inputmode="numeric"></div>
        <input data-r="${r}" placeholder="Reason for difference" style="display:none;width:100%;height:40px;border:1px solid #f0c6bd;border-radius:10px;padding:0 10px;margin-top:4px">`).join('')}
      <div class="cap" style="margin-top:14px">Packing material reusable (pcs) · the rest is waste</div>
      ${Object.entries(unw).map(([m,u]) => `<div class="grid-in"><span class="lbl">${esc(iname(itemById(+m)))}<small>unwrapped ${Math.round(u)}</small></span><input data-reuse="${m}" type="number" inputmode="numeric" style="grid-column:span 3"></div>`).join('')}`;
    var recalc = () => document.querySelectorAll('[data-g]').forEach(row => { const tot = ['good','near','broken','waste'].reduce((a,k)=>a+num(row.querySelector(`[data-k="${k}"]`).value),0);
      const df = tot ? tot - num(row.dataset.g) : 0; row.querySelector('.df').textContent = df; row.querySelector('.df').style.color = df ? 'var(--neg)' : '';
      document.querySelector(`[data-r="${row.dataset.m}"]`).style.display = df ? 'block' : 'none'; });
  }
  whShell(`${prod?'Production':'Cleaning'} return`, `<div class="card2"><b>${esc(b.batch_no)}</b> <span class="st">${b.status}</span>
      <div class="muted" style="font-size:12px;margin-top:4px">${b.work_date} ${b.shift} · issued eggs ${num(b.issued_egg_pcs)}</div></div>${body}
    <div class="foot" style="margin:12px -12px -12px"><button class="post" id="sv">Save return · close batch</button>
      <button class="btn d" id="cx" style="width:100%;margin-top:8px">Cancel this batch</button></div>`, whHome);
  document.querySelectorAll('#mb input').forEach(i => i.addEventListener('input', recalc));
  $('#sv').onclick = async () => {
    const obj = sel => Object.fromEntries([...document.querySelectorAll(sel)].filter(i => i.value !== '').map(i => [i.dataset.fg || i.dataset.reuse, num(i.value)]));
    const reason = Object.fromEntries([...document.querySelectorAll('[data-r]')].filter(i => i.value.trim()).map(i => [i.dataset.r, i.value.trim()]));
    const per = k => Object.fromEntries([...document.querySelectorAll('[data-m]')].map(r => [r.dataset.m, r.querySelector(`[data-k="${k}"]`)?.value]).filter(([,v]) => v !== undefined && v !== '').map(([a,v]) => [a, num(v)]));
    const data = prod ? { fg:obj('[data-fg]'), broken:per('broken'), waste:per('waste'), mwaste:per('mwaste'), counted:per('counted'), reason }
                      : { good:per('good'), near:per('near'), broken:per('broken'), waste:per('waste'), reuse:obj('[data-reuse]'), reason };
    $('#sv').disabled = true;
    try { const r = await rpc('wh_return', { p_batch:b.id, p_duty:S.duty, p_data:data }); toast('Closed · ' + r.batch_no + (num(r.egg_diff) ? ' · egg diff ' + r.egg_diff : '')); const [nb] = await q(sb.from('wh_batches').select('*').eq('id', b.id)); whView(nb, true); }
    catch(e) { $('#sv').disabled = false; }
  };
  $('#cx').onclick = () => {
    $('#cx').outerHTML = `<input id="cr" placeholder="Reason to cancel" style="width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-top:8px"><button class="btn d" id="cx2" style="width:100%;margin-top:6px">Confirm cancel</button>`;
    $('#cx2').onclick = async () => { if (!$('#cr').value.trim()) return toast('Enter the reason', false);
      await rpc('wh_cancel', { p_batch:b.id, p_reason:$('#cr').value.trim() }); toast('Batch cancelled'); whHome(); };
  };
}
async function whView(b, autoPrint){
  const L = await q(sb.from('wh_lines').select('*').eq('batch_id', b.id).order('id'));
  const nm = id => S.staff.find(s => s.id === id)?.name || '';
  const slip = which => { const ls = L.filter(l => l.slip === which); if (!ls.length) return toast('Nothing to print', false);
    const T = slipTop((b.process === 'PRODUCTION' ? 'PRODUCTION ' : 'CLEANING ') + (which === 'I1' ? 'ISSUE' : 'RETURN'));
    T.push(lr('Batch: ' + b.batch_no, 'Slip: ' + b.batch_no + '-' + which), lr('Work date / shift: ' + b.work_date + ' ' + b.shift, nowStamp()),
           'Staff: ' + b.staff_ids.map(nm).join(', '), lr(which === 'I1' ? 'Issued by: ' + nm(b.issued_by) : 'Received by: ' + nm(b.received_by), ''), rule());
    ls.forEach(l => { T.push(lr(l.line_type + ' ' + iname(itemById(l.item_id)), num(l.qty))); if (l.difference != null && num(l.difference)) T.push(lr('  calc ' + num(l.calculated) + ' diff ' + num(l.difference), l.reason || '')); if (l.exp_date || l.origin) T.push('  ' + (l.exp_date ? 'EXP ' + l.exp_date + ' ' : '') + (l.origin ? 'ORIGIN ' + l.origin : '')); });
    T.push(rule(), lr('TOTAL EGGS', num(b.issued_egg_pcs) + ' pcs'), '[[BARCODE]]', '', lr('RECEIVER ____________', 'PACKING STAFF ____________'));
    printSlip(T.join('\n'), b.batch_no); };
  whShell(b.batch_no, `<div class="card2"><div class="kv"><span>Status</span><span class="st">${b.status}</span></div>
      <div class="kv"><span>Work date / shift</span><b>${b.work_date} ${b.shift}</b></div><div class="kv"><span>Issued eggs</span><b>${num(b.issued_egg_pcs)}</b></div>
      ${b.process==='PRODUCTION'?`<div class="kv"><span>FG packs</span><b>${num(b.fg_packs)}</b></div>`:`<div class="kv"><span>Good / near exp</span><b>${num(b.good_egg_pcs)} / ${num(b.near_pcs)}</b></div>`}
      <div class="kv"><span>Broken / waste</span><b>${num(b.broken_pcs)} / ${num(b.waste_pcs)}</b></div>
      <div class="kv"><span>Egg difference</span><b style="color:${num(b.egg_diff)?'var(--neg)':'inherit'}">${num(b.egg_diff)}</b></div>
      <div class="kv"><span>Hours · output / staff-hour</span><b>${num(b.hours)} · ${num(b.output_per_staff_hour)}</b></div>
      ${b.cancel_reason?`<div class="kv"><span>Cancelled</span><b>${esc(b.cancel_reason)}</b></div>`:''}</div>
    <div class="btns" style="margin-bottom:12px"><button class="btn p" id="pi">Print issue slip</button><button class="btn p" id="pr" ${b.status==='CLOSED'?'':'disabled'}>Print return slip</button></div>
    ${L.map(l => `<div class="ln"><div><b>${esc(l.line_type)}</b><small>${esc(iname(itemById(l.item_id)))}${l.reason?' · '+esc(l.reason):''}</small></div>
      <span class="q">${num(l.qty)}${l.difference!=null&&num(l.difference)?`<small style="display:block;color:var(--neg);font-size:11px">${num(l.difference)}</small>`:''}</span></div>`).join('')}`, whHome);
  $('#pi').onclick = () => slip('I1'); $('#pr').onclick = () => slip('R1');
  if (autoPrint) slip(b.status === 'CLOSED' ? 'R1' : 'I1');
}

// ---------------- ITEM PICKER (ADD) ----------------
function itemPicker(cb, fgOnly){
  const its = S.items.filter(i => i.active && (fgOnly ? i.item_type === 'FG' : i.item_type !== 'MATERIAL')).sort((a,b)=>(a.display_order||0)-(b.display_order||0));
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end';
  ov.innerHTML = `<div style="background:#fff;width:100%;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:10px">
    <input id="pi" placeholder="Type item name or barcode" style="width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px">
    <div id="po"></div></div>`;
  document.body.appendChild(ov);
  const draw = f => ov.querySelector('#po').innerHTML = its.filter(i => !f || (iname(i)+' '+i.name+' '+i.barcode).toLowerCase().includes(f.toLowerCase()))
    .map(i => `<button data-id="${i.id}" style="display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:13px 6px;font-weight:600">${esc(iname(i))}<small style="display:block;color:var(--mut);font-weight:400;font-family:'IBM Plex Mono'">${esc(i.barcode)}</small></button>`).join('');
  draw(''); ov.querySelector('#pi').oninput = e => draw(e.target.value); ov.querySelector('#pi').focus();
  ov.onclick = e => { if (e.target === ov) ov.remove(); const b = e.target.closest('button[data-id]'); if (b) { ov.remove(); cb(itemById(+b.dataset.id)); } };
}
