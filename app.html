<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d4a28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Mahrjan Van Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--dk:#0d4a28;--dk2:#145c33;--acc:#117537;--yel:#ffce12;--bg:#f1f1ec;--card:#fff;--ink:#1b1f1e;--mut:#7b827e;--line:#e3e4de;--neg:#a5321f;--amb:#a8650f;
    font-family:Archivo,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;min-height:100vh}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
  html{background:#dfe3dc}
  button,input,select{font:inherit} button{cursor:pointer}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  .cap{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
  /* login */
  .login{min-height:100vh;background:var(--dk);color:#fff;padding:46px 18px 24px;display:flex;flex-direction:column}
  .logo{background:var(--yel);border-radius:16px;width:176px;height:88px;display:grid;place-items:center;overflow:hidden}
  .logo img{height:64px}
  .login .unit{font-size:12px;letter-spacing:.14em;color:#9fc2ad;margin:14px 0 26px;font-weight:600}
  .login label{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;color:#9fc2ad;margin:14px 0 8px}
  .login input{width:100%;height:54px;border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;padding:0 14px;font-size:16px;outline:none}
  .login input::placeholder{color:rgba(255,255,255,.45)}
  .login .go{margin-top:22px;height:56px;border:0;border-radius:12px;background:#fff;color:var(--dk);font-weight:700;font-size:17px;width:100%}
  .login small{margin-top:auto;color:#9fc2ad;font-size:12px}
  /* header */
  .hd{background:var(--dk);color:#fff;padding:16px 15px 12px}
  .hd .r1{display:flex;justify-content:space-between;align-items:flex-start}
  .hd h1{margin:4px 0 0;font-size:24px;font-weight:700}
  .hd .dt{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;text-align:right}
  .hd .ok{font-size:11.5px;color:#cfe3d5;text-align:right;margin-top:3px}.hd .ok:before{content:'● ';color:#66c08a}
  .pick{position:relative;margin-top:14px}
  .pickbtn{width:100%;height:50px;border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:16px;text-align:left;padding:0 14px;display:flex;justify-content:space-between;align-items:center}
  .plist{position:absolute;left:0;right:0;top:56px;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;color:var(--ink);max-height:60vh;overflow:auto}
  .plist input{margin:8px;width:calc(100% - 16px);height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px}
  .plist button{display:flex;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--line);background:#fff;padding:13px 14px;font-weight:700;font-size:15px;text-align:left}
  .plist button span{font-family:'IBM Plex Mono',monospace;font-weight:400;color:var(--mut);font-size:12px}
  .hd .r3{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:#cfe3d5}
  .pill{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:12px}
  /* board home */
  .wrap{padding:12px}
  .bal{background:#7fa38b;color:#fff;border-radius:16px;padding:16px 15px;margin-bottom:14px}
  .bal.on{background:var(--acc)}
  .bal .big{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;margin-top:6px}
  .bal .three{display:flex;gap:28px;border-top:1px solid rgba(255,255,255,.25);margin-top:12px;padding-top:10px}
  .bal .three div{font-family:'IBM Plex Mono',monospace;font-size:16px}.bal .cap{color:#e0eee5}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 12px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:6px}
  .tile b{font-size:14px}.tile .n{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--acc)}.tile small{color:var(--mut);font-size:11px}
  .tile.amb .n{color:#b08a5a}
  .tile:disabled{opacity:.55}
  .row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;width:100%;text-align:left}
  .row b{display:block;font-size:14px}.row small{color:var(--mut);font-size:11.5px}.row .end{margin-left:auto;color:var(--mut);font-size:12.5px}
  .row.dash{border-style:dashed;background:transparent}
  table.sm{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  table.sm th{background:#e8f3ee;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#4c5550;padding:9px 10px;text-align:center;font-weight:600}
  table.sm th:first-child,table.sm td:first-child{text-align:left}
  table.sm td{border-top:1px solid var(--line);padding:11px 10px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px}
  table.sm td b{font-family:Archivo,Helvetica,Arial,sans-serif;font-size:15px;display:block}table.sm td small{color:var(--mut);font-size:11px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .btn{height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:15px}
  .btn.p{background:var(--dk);border-color:var(--dk);color:#fff}.btn.p:disabled{background:#8fa898;border-color:#8fa898}
  .btn.d{color:var(--neg)}
  /* module screens */
  .mh{background:var(--dk);color:#fff;padding:12px 14px 10px;position:sticky;top:0;z-index:10}
  .mh .r1{display:flex;align-items:center;gap:12px}
  .back{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px}
  .mh h2{margin:0;font-size:19px}.mh .sub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#cfe3d5;margin-top:2px}
  .mh .open{margin-left:auto;text-align:center}.mh .open b{display:block;font-family:'IBM Plex Mono',monospace;font-size:20px;color:#8be0a8}.mh .open span{font-size:9.5px;letter-spacing:.12em;color:#cfe3d5}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px}
  .tabs button{flex:none;border:0;border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:13.5px}
  .tabs button.on{background:#fff;color:var(--dk)}
  .scan{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .addb{border:0;background:#d4d8d2;color:#fff;border-radius:8px;padding:7px 14px;font-weight:700;font-size:12px;letter-spacing:.08em}.addb.on{background:var(--acc)}
  .bc{width:100%;height:56px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:18px;padding:0 14px;outline:none}
  .bc:focus{border-color:var(--acc)}
  .disp{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:60px;padding:8px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .disp .nm{font-weight:600;font-size:14px}.disp .nm small{display:block;color:var(--mut);font-weight:400;font-size:11.5px}
  .disp .q{font-family:'IBM Plex Mono',monospace;font-size:30px;color:#c8ccc7;text-align:right;line-height:1}.disp .q.on{color:var(--ink)}.disp .q small{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--mut)}
  .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
  .chips button{height:56px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .chips button span{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--mut)}.chips button b{font-family:'IBM Plex Mono',monospace;font-size:16px}
  .chips button.on{border:2px solid var(--acc);background:#eef7f1}.chips button.on span{color:var(--acc)}
  .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .kp button{height:54px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600}
  .kp button.c{background:#eceee9;color:var(--neg)}.kp button.x{background:#eceee9;font-size:16px}.kp button.nx{background:#eceee9;color:var(--acc);font-size:17px}
  .okb{width:100%;height:54px;margin-top:8px;border:0;border-radius:12px;background:var(--dk);color:#fff;font-weight:700;font-size:16px}.okb:disabled{background:#c5cbc5}
  .lines{border-top:1px solid var(--line);margin:14px -12px 0;padding:12px}
  .lines .hdr{display:flex;justify-content:space-between}
  .ln{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
  .ln b{font-size:13.5px}.ln small{display:block;color:var(--mut);font-size:11px}.ln .q{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:15px;text-align:right}
  .ln .del{border:0;background:none;color:var(--neg);font-size:18px;padding:4px 6px}
  .ln.bad{border-color:#f0c6bd}.ln.ok{border-color:#c6e3cf}
  .empty{color:var(--mut);text-align:center;padding:20px 0;font-size:13.5px}
  .foot{background:#fff;border-top:1px solid var(--line);padding:12px;position:sticky;bottom:0}
  .foot .f4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
  .foot label{display:flex;flex-direction:column;gap:5px;font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--mut);text-align:center;text-transform:uppercase}
  .foot input,.foot select{height:46px;border:1px solid var(--line);border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:center;width:100%;min-width:0;background:#fff}
  .post{width:100%;height:56px;border:0;border-radius:12px;background:var(--dk);color:#fff;font-weight:700;font-size:17px}.post:disabled{background:#8fa898}
  .card2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border:0}.kv b{font-family:'IBM Plex Mono',monospace}
  .fld{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.fld span{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
  .fld input,.fld select{height:48px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px;background:#fff;width:100%}
  .st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eef0ec}
  .msg{position:fixed;bottom:18px;left:12px;right:12px;padding:13px 16px;border-radius:12px;color:#fff;z-index:50;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .msg.ok{background:var(--dk)}.msg.er{background:var(--neg)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://xhndwjkqfqmmpfcglqzu.supabase.co', 'sb_publishable_emOqI1PWaSA7B5s56v-ERg_RrxZ9weu');
const EMAIL_DOMAIN = '@mahrjan.app';
const LOGO = 'mahrjan-logo.jpeg';

const S = { me:null, items:[], staff:[], vans:[], branches:[], date:today(), sm:null, mod:null, stats:{} };
const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isNaN(n) ? 0 : n; };
const money = v => num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function today(off=0){ return new Date(Date.now()+off*864e5).toLocaleDateString('en-CA',{timeZone:'Asia/Dubai'}); }
const dLabel = d => new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,'-').toUpperCase();
const nowHM = () => new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Dubai',hour:'2-digit',minute:'2-digit'});
function toast(t, ok=true){ const m=document.createElement('div'); m.className='msg '+(ok?'ok':'er'); m.textContent=t; document.body.appendChild(m); setTimeout(()=>m.remove(), ok?2200:5500); }
async function q(p){ const { data, error } = await p; if (error) { toast(error.message, false); throw error; } return data; }
const rpc = (fn, a) => q(sb.rpc(fn, a));
window.addEventListener('unhandledrejection', e => { if (e.reason && (e.reason.message || e.reason.code)) e.preventDefault(); });
const has = (...r) => r.includes(S.me?.role);
const itemById = id => S.items.find(i => i.id === id) || {};
const itemByCode = c => S.items.find(i => i.active && i.item_type !== 'MATERIAL' && (i.barcode === c || i.itrade_code === c));
const iname = it => it.short_name || it.name || '';
const salesmen = () => S.staff.filter(s => s.role === 'SALESMAN' && s.active);
const smName = id => S.staff.find(s => s.id === id)?.name || '';

sb.auth.onAuthStateChange(e => { if (e === 'SIGNED_OUT') renderLogin(); });
const { data:{ session } } = await sb.auth.getSession();
session ? boot() : renderLogin();

// ---------------- LOGIN ----------------
function renderLogin(){
  $('#app').innerHTML = `<div class="login">
    <div class="logo"><img src="${LOGO}" alt="Mahrjan"></div><div class="unit">VAN SALES</div>
    <label>USERNAME</label><input id="u" placeholder="Type your name" autocomplete="off" autocapitalize="none" spellcheck="false">
    <label>PASSWORD</label><input id="pw" type="password" autocomplete="new-password">
    <button class="go" id="go">Sign in</button>
    <small>Use the same username and password as the Mahrjan Sales Portal.</small></div>`;
  const go = async () => {
    const u = $('#u').value.trim().toLowerCase(); if (!u) return;
    const { error } = await sb.auth.signInWithPassword({ email: u.includes('@') ? u : u + EMAIL_DOMAIN, password: $('#pw').value.trim() });
    if (error) return toast('Sign in failed: ' + error.message, false);
    boot();
  };
  $('#go').onclick = go; $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function boot(){
  S.me = await rpc('me');
  if (!S.me || !S.me.role) { toast('This login is not linked to an active staff member', false); await sb.auth.signOut(); return; }
  const [items, staff, vans, branches] = await Promise.all([
    q(sb.from('items').select('*')), q(sb.from('staff').select('id,name,role,branch_id,active').order('name')),
    q(sb.from('vans').select('*').eq('active', true).order('van_no')), q(sb.from('branches').select('*'))]);
  Object.assign(S, { items, staff, vans, branches });
  if (S.me.role === 'SALESMAN') S.sm = S.me.id;
  home();
}

// ---------------- DAY BOARD ----------------
async function loadStats(){
  const days = await q(sb.from('van_day').select('*').eq('business_date', S.date));
  const rec = days.length ? await q(sb.from('v_van_day_items').select('*').in('van_day_id', days.map(d=>d.id))) : [];
  const cash = days.length ? await q(sb.from('v_van_day_cash').select('*').in('van_day_id', days.map(d=>d.id))) : [];
  S.stats = {};
  for (const d of days) {
    const r = rec.filter(x => x.van_day_id === d.id), c = cash.find(x => x.van_day_id === d.id) || {};
    const sum = k => r.reduce((a,x)=>a+num(x[k]),0);
    const board = sum('load'), sale = sum('sale') - sum('grv'), ret = sum('total_return');
    S.stats[d.salesman_id] = { day:d, board, sale, ret, open: board - sale - ret, cash:c };
  }
}
async function home(){
  S.mod = null; await loadStats();
  const st = S.sm ? S.stats[S.sm] : null, d = st?.day;
  const route = id => { const r = salesmen().find(s=>s.id===id); return r ? '' : ''; };
  const vanOf = id => S.vans.find(v => v.id === S.stats[id]?.day?.van_id)?.van_no || '';
  const canStock = has('RECEIVER','ACCOUNTANT','ADMIN');
  const br = S.branches.find(b => b.id === S.me.branch_id)?.name || 'Both branches';
  $('#app').innerHTML = `
  <div class="hd"><div class="r1"><div><div class="cap" style="color:#cfe3d5">Mahrjan General Trading</div><h1>Day board</h1></div>
    <div><div class="dt">${dLabel(S.date)}</div><div class="ok">${esc(br)} · Linked</div></div></div>
    ${S.me.role === 'SALESMAN' ? '' : `<div class="pick"><button class="pickbtn" id="pk"><span>${S.sm ? esc(smName(S.sm)) : 'Select a salesman'}</span><span>⌄</span></button><div id="pl"></div></div>`}
    <div class="r3"><span>${S.sm ? 'Choose a module' : 'Pick a salesman, then choose a module'}</span>
      <button class="pill" id="out">${esc(S.me.name)} · Sign out</button></div></div>
  <div class="wrap">
    <div class="bal ${st?'on':''}"><div style="display:flex;justify-content:space-between"><span class="cap" style="color:#e0eee5">Day balance</span><span style="font-size:13px">${d?`<span class="st">${d.status}</span>`:''}</span></div>
      <div class="big">${st ? st.open : 0} <span style="font-family:Archivo,Helvetica,Arial,sans-serif;font-size:14px;font-weight:400">${S.sm ? (st ? 'open on the van' : 'not loaded yet') : 'Pick a salesman'}</span></div>
      <div class="three"><span><span class="cap">Boarded</span><div>${st?.board||0}</div></span><span><span class="cap">Sold</span><div>${st?.sale||0}</div></span><span><span class="cap">Returned</span><div>${st?.ret||0}</div></span></div></div>
    <div class="cap">Stock</div>
    <div class="grid3">
      <button class="tile" data-m="board" ${S.sm&&canStock?'':'disabled'}><b>Board</b><span class="n">${st?.board||0}</span><small>on the van</small></button>
      <button class="tile" data-m="sum" ${st?'':'disabled'}><b>Sales</b><span class="n">${st?.sale||0}</span><small>from office</small></button>
      <button class="tile" data-m="ret" ${st&&canStock?'':'disabled'}><b>Return</b><span class="n">${st?.ret||0}</span><small>counted back</small></button></div>
    <div class="cap">Money · AED</div>
    <div class="grid2">
      <button class="tile" data-m="col" ${st?'':'disabled'}><b>Collection</b><span class="n">${money(st?.cash?.collections)}</span><small>${num(st?.cash?.collections)?'collected':'nothing yet'}</small></button>
      <button class="tile amb" data-m="exp" ${st?'':'disabled'}><b>Expense</b><span class="n">${money(st?.cash?.expenses)}</span><small>${num(st?.cash?.expenses)?'spent':'nothing yet'}</small></button></div>
    <button class="row ${S.sm?'':'dash'}" data-m="sum" ${st?'':'disabled'}><div><b>Summary</b><small>Item check · cash to hand over</small></div><span class="end">Open →</span></button>
    <button class="row dash" data-m="req" ${S.sm?'':'disabled'}><div><b>Requirement</b><small>for ${dLabel(today(1))}</small></div><span class="end">Open →</span></button>
    ${S.me.role === 'SALESMAN' ? '' : `
    <div class="cap" style="display:flex;justify-content:space-between;margin:14px 0 8px"><span>${Object.values(S.stats).filter(x=>x.day.status==='CLOSED').length} of ${salesmen().length} closed</span><span>PCS</span></div>
    <table class="sm"><tr><th>Salesman</th><th>Board</th><th>Sales</th><th>Open</th></tr>
      ${salesmen().map(s => { const x = S.stats[s.id]; return `<tr data-s="${s.id}"><td><b>${esc(s.name)}</b><small>${esc(vanOf(s.id)||'—')} ${x?'· '+x.day.status:''}</small></td>
        <td>${x?x.board:'—'}</td><td>${x?x.sale:'—'}</td><td>${x?x.open:'—'}</td></tr>`; }).join('')}</table>`}
    <div class="btns"><button class="btn" id="rf">Refresh</button><button class="btn" id="dtb">Change date</button></div>
    <input type="date" id="dti" value="${S.date}" style="position:absolute;opacity:0;pointer-events:none">
  </div>`;
  $('#out').onclick = () => sb.auth.signOut();
  $('#rf').onclick = home;
  $('#dtb').onclick = () => { const i=$('#dti'); i.showPicker ? i.showPicker() : i.click(); };
  $('#dti').onchange = e => { S.date = e.target.value; home(); };
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => openMod(b.dataset.m));
  document.querySelectorAll('tr[data-s]').forEach(tr => tr.onclick = () => { S.sm = +tr.dataset.s; home(); });
  const pk = $('#pk'); if (pk) pk.onclick = () => {
    const pl = $('#pl'); if (pl.innerHTML) { pl.innerHTML = ''; return; }
    pl.innerHTML = `<div class="plist"><input id="ps" placeholder="Type a name or van"><div id="po"></div></div>`;
    const draw = f => $('#po').innerHTML = salesmen().filter(s => !f || (s.name+' '+vanOf(s.id)).toLowerCase().includes(f.toLowerCase()))
      .map(s => `<button data-s="${s.id}">${esc(s.name)}<span>${esc(vanOf(s.id))}</span></button>`).join('');
    draw(''); $('#ps').oninput = e => draw(e.target.value); $('#ps').focus();
    $('#po').onclick = e => { const b = e.target.closest('button'); if (b) { S.sm = +b.dataset.s; home(); } };
  };
}

// ---------------- MODULE SHELL ----------------
const MODS = [['board','Board'],['ret','Return'],['sum','Summary'],['req','Requirement'],['col','Collection'],['exp','Expense']];
function shell(mod, body){
  S.mod = mod; const st = S.stats[S.sm], d = st?.day;
  const van = S.vans.find(v => v.id === d?.van_id)?.van_no;
  const allowed = MODS.filter(([k]) => (k === 'board' || k === 'ret') ? has('RECEIVER','ACCOUNTANT','ADMIN') : true);
  $('#app').innerHTML = `<div class="mh"><div class="r1"><button class="back" id="bk">←</button>
      <div><h2>${MODS.find(m=>m[0]===mod)[1]}</h2><div class="sub">${esc(smName(S.sm))}${van?' · '+esc(van):''} · ${dLabel(S.date)}</div></div>
      <div class="open"><b>${st?st.open:0}</b><span>OPEN</span></div></div>
    <div class="tabs">${allowed.map(([k,l]) => `<button data-t="${k}" class="${k===mod?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="wrap" id="mb">${body}</div>`;
  $('#bk').onclick = home;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => openMod(b.dataset.t));
}
async function openMod(m){ await loadStats(); ({ board:mBoard, ret:mReturn, sum:mSummary, req:mReq, col:mCol, exp:mExp })[m](); }
history.pushState(null,''); window.addEventListener('popstate', () => { history.pushState(null,''); if (S.mod) home(); });

// keypad helper
function keypad(nextLabel){ return `<div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
  ${nextLabel ? `<button class="nx" data-k="N">${nextLabel}</button>` : `<button class="c" data-k="C">C</button>`}<button data-k="0">0</button><button class="x" data-k="B">⌫</button></div>`; }

// ---------------- BOARD ----------------
async function mBoard(){
  const d = S.stats[S.sm]?.day;
  const lines = d ? await q(sb.from('loading_lines').select('item_id,qty').eq('van_day_id', d.id)) : [];
  let L = lines.length ? lines.map(l => ({ id:l.item_id, qty:+l.qty })) :
    (await q(sb.from('requirement_lines').select('item_id,qty_cartons').eq('salesman_id', S.sm).eq('required_date', S.date)))
      .map(r => { const it = itemById(r.item_id); return { id:r.item_id, qty: r.qty_cartons * (it.item_type==='RAW_EGG' ? (it.pcs_per_carton||1) : (it.packs_per_carton||1)) }; });
  const locked = d && !['OPEN','LOADED'].includes(d.status);
  let cur = null, val = '';
  shell('board', `
    <div class="scan"><span class="cap">Barcode</span><button class="addb" id="add">ADD</button></div>
    <input class="bc" id="bc" inputmode="none" autocomplete="off" placeholder="" ${locked?'disabled':''}>
    <div class="disp"><div class="nm" id="nm"></div><div class="q" id="qv">0<small>PCS</small></div></div>
    ${keypad()}
    <button class="okb" id="ok" disabled>OK — add to board</button>
    <div class="lines"><div class="hdr"><span class="cap">Boarded lines</span><span class="mono" id="tot"></span></div><div id="ls"></div></div>
    <div class="foot" style="margin:12px -12px -12px">
      <div class="f4"><label>Vehicle<select id="van"><option value="">—</option>${S.vans.map(v=>`<option value="${v.id}" ${v.id===d?.van_id?'selected':''}>${esc(v.van_no)}</option>`).join('')}</select></label>
        <label>Load KM<input id="km" type="number" inputmode="numeric" placeholder="KM" value="${d?.start_km??''}"></label>
        <label>Load temp °C<input id="tp" type="number" inputmode="decimal" placeholder="Temp °C" value="${d?.load_temp??''}"></label>
        <label>Load time<input value="${d?.load_time?.slice(0,5) || nowHM()}" disabled></label></div>
      <button class="post" id="post" ${locked?'disabled':''}>${locked?'Locked — van returned':'Post'}</button></div>`);
  const draw = () => {
    $('#ls').innerHTML = L.length ? L.map((l,i) => { const it = itemById(l.id);
      return `<div class="ln"><div><b>${esc(iname(it))}</b><small>${esc(it.barcode||'')}</small></div><span class="q">${l.qty}</span>${locked?'':`<button class="del" data-i="${i}">✕</button>`}</div>`; }).join('')
      : '<div class="empty">Scan the first item going on the van.</div>';
    $('#tot').textContent = L.reduce((a,l)=>a+l.qty,0) + ' pcs';
    document.querySelectorAll('.del').forEach(b => b.onclick = () => { L.splice(+b.dataset.i,1); draw(); });
  };
  const showCur = () => { $('#nm').innerHTML = cur ? `${esc(iname(cur))}<small>${esc(cur.barcode)}</small>` : '';
    $('#qv').innerHTML = (val||'0')+'<small>PCS</small>'; $('#qv').className = 'q'+(val?' on':''); $('#ok').disabled = !(cur && num(val) > 0); };
  const pickCode = c => { const it = itemByCode(c.trim()); if (!it) return toast('Barcode not found: '+c, false); cur = it; val = ''; $('#bc').value = it.barcode; showCur(); };
  $('#bc').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); pickCode($('#bc').value); } });
  $('#add').onclick = () => itemPicker(it => { cur = it; val=''; $('#bc').value = it.barcode; showCur(); });
  document.querySelectorAll('.kp button').forEach(b => b.onclick = () => { const k=b.dataset.k;
    if (k==='C') val=''; else if (k==='B') val=val.slice(0,-1); else if (val.length<6) val+=k; showCur(); });
  $('#ok').onclick = () => { const ex = L.find(l=>l.id===cur.id); ex ? ex.qty += num(val) : L.push({ id:cur.id, qty:num(val) });
    cur=null; val=''; $('#bc').value=''; showCur(); draw(); $('#bc').focus(); };
  $('#post').onclick = async () => {
    if (!L.length) return toast('Nothing on the board', false);
    $('#post').disabled = true;
    try { await rpc('post_loading', { p_salesman:S.sm, p_date:S.date, p_van:+$('#van').value||null, p_start_km:+$('#km').value||null,
            p_load_temp:$('#tp').value===''?null:+$('#tp').value, p_lines:L.map(l=>({item_id:l.id, qty:l.qty})) });
          toast('Board posted'); openMod('board'); } catch(e) { $('#post').disabled = false; }
  };
  draw(); showCur(); if (!locked) $('#bc').focus();
}

// ---------------- RETURN ----------------
async function mReturn(){
  const d = S.stats[S.sm]?.day; if (!d) return home();
  const [rec, ret] = await Promise.all([q(sb.from('v_van_day_items').select('*').eq('van_day_id', d.id)), q(sb.from('return_lines').select('*').eq('van_day_id', d.id))]);
  const F = [['good','GOOD'],['damage','DMG'],['expiry','EXP'],['waste','WST'],['foc','FOC']];
  const R = {}; ret.forEach(r => R[r.item_id] = Object.fromEntries(F.map(([k])=>[k, num(r[k])])));
  const locked = !['LOADED','RETURNED'].includes(d.status);
  let cur = null, fi = 0, vals = {};
  shell('ret', `
    <div class="scan"><span class="cap">Barcode</span><button class="addb" id="add">ADD</button></div>
    <input class="bc" id="bc" inputmode="none" autocomplete="off" ${locked?'disabled':''}>
    <div class="disp"><div class="nm" id="nm"></div><div class="q" id="ex"></div></div>
    <span class="cap">Quantity</span>
    <div class="chips">${F.map(([k,l],i)=>`<button data-f="${i}"><span>${l}</span><b id="c_${k}"></b></button>`).join('')}</div>
    ${keypad('NEXT →')}
    <button class="okb" id="ok" disabled>OK — add this item</button>
    <div class="lines"><div class="hdr"><span class="cap">Open items · variance</span><span class="mono" id="cnt"></span></div><div id="ls"></div></div>
    <div class="foot" style="margin:12px -12px -12px">
      <div class="f4"><label>Unload KM<input id="km" type="number" inputmode="numeric" placeholder="KM" value="${d.end_km??''}"></label>
        <label>Unload temp °C<input id="tp" type="number" inputmode="decimal" placeholder="Temp °C" value="${d.unload_temp??''}"></label>
        <label>Ctn small<input id="cs" type="number" inputmode="numeric" placeholder="Small" value="${d.carton_small||''}"></label>
        <label>Ctn big<input id="cb" type="number" inputmode="numeric" placeholder="Big" value="${d.carton_big||''}"></label></div>
      <button class="post" id="post" ${locked?'disabled':''}>${locked?'Locked — '+d.status:'Post'}</button></div>`);
  const exp = id => num(rec.find(r=>r.item_id===id)?.expected_return);
  const tot = id => F.reduce((a,[k])=>a+num(R[id]?.[k]),0);
  const draw = () => {
    const ids = [...new Set([...rec.map(r=>r.item_id), ...Object.keys(R).map(Number)])];
    $('#ls').innerHTML = ids.length ? ids.map(id => { const it=itemById(id), t=tot(id), e=exp(id), df=t-e, entered = !!R[id];
      return `<div class="ln ${entered ? (df ? 'bad' : 'ok') : ''}" data-id="${id}"><div><b>${esc(iname(it))}</b><small>expected ${e}${entered ? ' · '+F.filter(([k])=>num(R[id][k])).map(([k,l])=>l+' '+R[id][k]).join(' · ') : ''}</small></div>
        <span class="q">${entered ? t : '—'}${entered && df ? `<small class="${df?'bad':''}" style="display:block;font-size:11px;color:var(--neg)">${df>0?'+':''}${df}</small>`:''}</span></div>`; }).join('')
      : '<div class="empty">Nothing open on this van.</div>';
    $('#cnt').textContent = Object.keys(R).length + ' of ' + ids.length + ' entered';
    document.querySelectorAll('.ln[data-id]').forEach(el => el.onclick = () => { if (!locked) setCur(itemById(+el.dataset.id)); });
  };
  const showCur = () => {
    $('#nm').innerHTML = cur ? `${esc(iname(cur))}<small>${esc(cur.barcode)}</small>` : '';
    $('#ex').innerHTML = cur ? `${exp(cur.id)}<small>EXPECTED</small>` : ''; $('#ex').className = 'q'+(cur?' on':'');
    F.forEach(([k],i) => { $('#c_'+k).textContent = vals[k] || ''; $(`.chips button[data-f="${i}"]`).className = i===fi ? 'on' : ''; });
    $('#ok').disabled = !cur;
  };
  const setCur = it => { cur = it; fi = 0; vals = Object.fromEntries(F.map(([k])=>[k, R[it.id]?.[k] ? String(R[it.id][k]) : ''])); $('#bc').value = it.barcode; showCur(); };
  $('#bc').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const it = itemByCode($('#bc').value.trim()); it ? setCur(it) : toast('Barcode not found', false); } });
  $('#add').onclick = () => itemPicker(setCur);
  document.querySelectorAll('.chips button').forEach(b => b.onclick = () => { fi = +b.dataset.f; showCur(); });
  document.querySelectorAll('.kp button').forEach(b => b.onclick = () => { if (!cur) return; const k=b.dataset.k, f=F[fi][0];
    if (k==='N') fi = (fi+1) % F.length; else if (k==='B') vals[f]=(vals[f]||'').slice(0,-1); else if ((vals[f]||'').length<6) vals[f]=(vals[f]||'')+k; showCur(); });
  $('#ok').onclick = () => { R[cur.id] = Object.fromEntries(F.map(([k])=>[k, num(vals[k])])); cur=null; vals={}; $('#bc').value=''; showCur(); draw(); $('#bc').focus(); };
  $('#post').onclick = async () => {
    $('#post').disabled = true;
    try { await rpc('post_return', { p_van_day:d.id, p_end_km:+$('#km').value||null, p_unload_temp:$('#tp').value===''?null:+$('#tp').value,
            p_carton_small:+$('#cs').value||0, p_carton_big:+$('#cb').value||0,
            p_lines:Object.entries(R).map(([id,v]) => ({ item_id:+id, ...v })) });
          toast('Return posted'); openMod('ret'); } catch(e) { $('#post').disabled = false; }
  };
  draw(); showCur(); if (!locked) $('#bc').focus();
}

// ---------------- SUMMARY ----------------
async function mSummary(){
  const d = S.stats[S.sm]?.day; if (!d) return home();
  const closed = d.status === 'CLOSED';
  const rec = closed ? await q(sb.from('day_close_items').select('*').eq('van_day_id', d.id)) : await q(sb.from('v_van_day_items').select('*').eq('van_day_id', d.id));
  const c = S.stats[S.sm].cash || {}, exp = d.cash_expected ?? c.cash_to_hand_over;
  shell('sum', `
    <div class="card2"><div class="kv"><span>Status</span><span class="st">${d.status}</span></div>
      <div class="kv"><span>Cash sales</span><b>${money(c.cash_sales)}</b></div><div class="kv"><span>Cash returns</span><b>${money(c.cash_returns)}</b></div>
      <div class="kv"><span>Collections</span><b>${money(c.collections)}</b></div><div class="kv"><span>Expenses</span><b>${money(c.expenses)}</b></div>
      <div class="kv"><span><b style="font-family:Archivo,Helvetica,Arial,sans-serif">Cash to hand over</b></span><b>${money(exp)}</b></div>
      ${d.cash_counted!=null ? `<div class="kv"><span>Counted</span><b>${money(d.cash_counted)}</b></div>` : ''}
      <div class="kv"><span>Credit sales</span><b>${money(c.credit_sales)}</b></div></div>
    <table class="sm"><tr><th>Item</th><th>Load</th><th>Sale</th><th>Ret</th><th>+/−</th></tr>
      ${rec.sort((a,b)=>(itemById(a.item_id).display_order||0)-(itemById(b.item_id).display_order||0)).map(r => { const df = num(r.excess) - num(r.short);
        return `<tr><td><b style="font-size:13px">${esc(iname(itemById(r.item_id)))}</b>${r.flag?'<small style="color:var(--amb)">sale without load</small>':''}</td>
        <td>${num(r.load)}</td><td>${num(r.sale)-num(r.grv)}</td><td>${num(r.total_return)}</td><td style="color:${df?'var(--neg)':'inherit'}">${df?(df>0?'+':'')+df:''}</td></tr>`; }).join('')}</table>
    <p class="cap" style="margin-top:12px">Settle and close are done in the office portal.</p>`);
}

// ---------------- REQUIREMENT ----------------
async function mReq(){
  const rd = today(1);
  const req = await q(sb.from('requirement_lines').select('item_id,qty_cartons').eq('salesman_id', S.sm).eq('required_date', rd));
  const its = S.items.filter(i => i.active && i.item_type !== 'MATERIAL').sort((a,b)=>(a.display_order||0)-(b.display_order||0));
  shell('req', `<div class="cap" style="margin-bottom:8px">Cartons for ${dLabel(rd)}</div>
    ${its.map(it => `<div class="ln"><div><b>${esc(iname(it))}</b></div><input class="q" data-id="${it.id}" type="number" inputmode="decimal" min="0" step="0.5"
      value="${req.find(r=>r.item_id===it.id)?.qty_cartons ?? ''}" style="width:90px;height:42px;border:1px solid var(--line);border-radius:10px;text-align:center"></div>`).join('')}
    <div class="foot" style="margin:12px -12px -12px"><button class="post" id="sv">Save requirement</button></div>`);
  $('#sv').onclick = async () => {
    const ln = [...document.querySelectorAll('input[data-id]')].map(i => ({ item_id:+i.dataset.id, qty_cartons:num(i.value) })).filter(x=>x.qty_cartons>0);
    await rpc('save_requirement', { p_salesman:S.sm, p_date:rd, p_lines:ln }); toast('Requirement saved');
  };
}

// ---------------- COLLECTION / EXPENSE ----------------
let CUST = null;
async function customers(){ if (!CUST) CUST = await q(sb.from('customers').select('id,itrade_code,name').eq('active', true).order('name')); return CUST; }
const custLabel = c => (c.itrade_code||'') + ' | ' + c.name;
async function mCol(){
  const d = S.stats[S.sm]?.day; if (!d) return home();
  const [rows, cs] = await Promise.all([q(sb.from('collections').select('*').eq('van_day_id', d.id).order('id')), customers()]);
  const open = ['OPEN','LOADED','RETURNED'].includes(d.status);
  shell('col', `${rows.map(r => `<div class="ln"><div><b>${esc(cs.find(c=>c.id===r.customer_id)?.name||'')}</b><small>Receipt ${esc(r.receipt_no)} · ${esc(r.mode)}${r.invoice_no?' · '+esc(r.invoice_no):''}</small></div><span class="q">${money(r.amount)}</span></div>`).join('') || '<div class="empty">No collections yet.</div>'}
    ${open ? `<div class="card2" style="margin-top:12px"><datalist id="cl">${cs.map(c=>`<option value="${esc(custLabel(c))}">`).join('')}</datalist>
      <label class="fld"><span>Customer</span><input id="cu" list="cl" placeholder="Code or name"></label>
      <label class="fld"><span>Receipt no</span><input id="rn" inputmode="numeric"></label>
      <label class="fld"><span>Invoice no</span><input id="in"></label>
      <label class="fld"><span>Mode</span><select id="md"><option>CASH</option><option>CHEQUE</option><option>TRANSFER</option></select></label>
      <label class="fld"><span>Amount AED</span><input id="am" type="number" inputmode="decimal" step="0.01"></label>
      <button class="post" id="sv">Add collection</button></div>` : ''}`);
  if (!open) return;
  $('#sv').onclick = async () => {
    const cu = cs.find(c => custLabel(c) === $('#cu').value);
    if (!cu || !$('#rn').value || !num($('#am').value)) return toast('Customer, receipt no and amount are needed', false);
    const all = rows.map(r => ({ receipt_no:r.receipt_no, invoice_no:r.invoice_no, customer_id:r.customer_id, mode:r.mode, amount:r.amount }))
      .concat([{ receipt_no:$('#rn').value, invoice_no:$('#in').value, customer_id:cu.id, mode:$('#md').value, amount:num($('#am').value) }]);
    await rpc('save_collections', { p_van_day:d.id, p_lines:all }); toast('Collection saved'); openMod('col');
  };
}
async function mExp(){
  const d = S.stats[S.sm]?.day; if (!d) return home();
  const [rows, cs] = await Promise.all([q(sb.from('expenses').select('*').eq('van_day_id', d.id).order('id')), customers()]);
  const open = ['OPEN','LOADED','RETURNED'].includes(d.status);
  const ET = ['FUEL','PARKING','CARTON BIG','CARTON SMALL','SHELF RENT','CREDIT NOTE','OTHER'];
  shell('exp', `${rows.map(r => `<div class="ln"><div><b>${esc(r.expense_type)}</b><small>${esc(cs.find(c=>c.id===r.customer_id)?.name||'')} ${esc(r.note||'')}</small></div><span class="q">${money(r.amount)}</span></div>`).join('') || '<div class="empty">No expenses yet.</div>'}
    ${open ? `<div class="card2" style="margin-top:12px"><datalist id="cl">${cs.map(c=>`<option value="${esc(custLabel(c))}">`).join('')}</datalist>
      <label class="fld"><span>Type</span><select id="ty">${ET.map(t=>`<option>${t}</option>`).join('')}</select></label>
      <label class="fld"><span>Amount AED</span><input id="am" type="number" inputmode="decimal" step="0.01"></label>
      <label class="fld"><span>Customer (shelf rent / credit note)</span><input id="cu" list="cl" placeholder="Code or name"></label>
      <label class="fld"><span>Note</span><input id="nt"></label>
      <button class="post" id="sv">Add expense</button></div>` : ''}`);
  if (!open) return;
  $('#sv').onclick = async () => {
    const cu = cs.find(c => custLabel(c) === $('#cu').value);
    if (!num($('#am').value)) return toast('Enter the amount', false);
    const all = rows.map(r => ({ expense_type:r.expense_type, amount:r.amount, customer_id:r.customer_id, note:r.note }))
      .concat([{ expense_type:$('#ty').value, amount:num($('#am').value), customer_id:cu?.id||null, note:$('#nt').value }]);
    await rpc('save_expenses', { p_van_day:d.id, p_lines:all }); toast('Expense saved'); openMod('exp');
  };
}

// ---------------- ITEM PICKER (ADD) ----------------
function itemPicker(cb){
  const its = S.items.filter(i => i.active && i.item_type !== 'MATERIAL').sort((a,b)=>(a.display_order||0)-(b.display_order||0));
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end';
  ov.innerHTML = `<div style="background:#fff;width:100%;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:10px">
    <input id="pi" placeholder="Type item name or barcode" style="width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px">
    <div id="po"></div></div>`;
  document.body.appendChild(ov);
  const draw = f => ov.querySelector('#po').innerHTML = its.filter(i => !f || (iname(i)+' '+i.name+' '+i.barcode).toLowerCase().includes(f.toLowerCase()))
    .map(i => `<button data-id="${i.id}" style="display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:13px 6px;font-weight:600">${esc(iname(i))}<small style="display:block;color:var(--mut);font-weight:400;font-family:'IBM Plex Mono'">${esc(i.barcode)}</small></button>`).join('');
  draw(''); ov.querySelector('#pi').oninput = e => draw(e.target.value); ov.querySelector('#pi').focus();
  ov.onclick = e => { if (e.target === ov) ov.remove(); const b = e.target.closest('button[data-id]'); if (b) { ov.remove(); cb(itemById(+b.dataset.id)); } };
}
</script>
