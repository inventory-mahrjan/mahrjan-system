plugins { id 'com.android.application' }
android {
    namespace 'com.mahrjan.vansales'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mahrjan.vansales'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('APP_VERSION_CODE') ?: '1') as int
        versionName '1.' + (System.getenv('APP_VERSION_CODE') ?: '1')
    }
    signingConfigs {
        release {
            storeFile file('../release.jks')
            storePassword System.getenv('KS_PASS') ?: 'android'
            keyAlias 'mahrjan'
            keyPassword System.getenv('KS_PASS') ?: 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
