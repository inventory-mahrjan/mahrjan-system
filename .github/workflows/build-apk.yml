name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Signing key
        run: keytool -genkeypair -keystore android/release.jks -alias mahrjan -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Mahrjan General Trading, O=Mahrjan, C=AE"
        env: { KS_PASS: ${{ github.run_id }}x }
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease
        env: { KS_PASS: ${{ github.run_id }}x, APP_VERSION_CODE: ${{ github.run_number }} }
      - run: cp android/app/build/outputs/apk/release/app-release.apk Mahrjan-Van-Sales.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Mahrjan Van Sales app v1.${{ github.run_number }}
          body: Android app for the Mahrjan van sales system. Download Mahrjan-Van-Sales.apk and install it on the phone or PDT.
          files: Mahrjan-Van-Sales.apk
          make_latest: true
