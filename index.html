<style>
  :root{--bg:#f6f6f4;--surface:#fff;--ink:#1b1f1e;--muted:#6b7370;--line:#e7e8e4;--line2:#d8dad5;--accent:#1B4332;--accent-ink:#0c363b;--soft:#eef3f1;--neg:#b0432e;--amb:#a8650f;
    font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box} body{margin:0}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em} h1{font-size:26px} h3{font-size:15px;margin:0 0 12px}
  button,input,select{font:inherit;font-size:13.5px}
  button{cursor:pointer;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 13px;font-weight:500;line-height:1.2;white-space:nowrap}
  button:hover{background:#f2f3f0} button:disabled{opacity:.45;cursor:default}
  button.p{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff} button.p:hover{background:#14382A}
  button.d{color:var(--neg);border-color:var(--neg)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input,select{min-width:0;height:36px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--ink)}
  input[type=number]{width:84px;text-align:center;font-family:'IBM Plex Mono',monospace}
  input[type=file]{height:auto;padding:7px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
  .row label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
  /* shell */
  .sidebar{width:232px;position:fixed;inset:0 auto 0 0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 18px;overflow:auto}
  .brand{display:flex;flex-direction:column;gap:8px;padding:0 8px 10px;font-weight:600;font-size:15px}
  .brandlogo{height:46px;width:auto;max-width:100%;border-radius:7px;display:block;align-self:flex-start;object-fit:contain}
  .brand small{display:block;font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:.02em;margin-top:2px}
  nav{display:flex;flex-direction:column;gap:1px}
  .navlabel{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:16px 10px 6px}
  nav button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;color:#3c4442;font-weight:400;width:100%}
  nav button:hover{background:#f3f4f1} nav button.on{background:var(--soft);color:var(--accent-ink);font-weight:600}
  .sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:flex;flex-direction:column;gap:10px}
  .who{display:flex;flex-direction:column;gap:2px;font-size:13px} .who span{color:var(--muted);font-size:12px}
  main{margin-left:232px;padding:32px 40px 40px;max-width:1500px;display:flex;flex-direction:column;gap:20px}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .top label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
  #v{display:flex;flex-direction:column;gap:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
  /* tables: light green heading row, thin lines, numbers centred */
  .tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{position:sticky;top:0;background:#e8f3ee;font-weight:500;color:var(--accent-ink);font-size:12px;border-bottom:1px solid var(--line2);padding:9px 12px;white-space:nowrap;text-align:center}
  td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums}
  /* report pages (Daily sheets, FOC, Short & excess…) use the full width next to the sidebar, like the other pages */
  @media screen{#v #oldv{margin:0;padding:0 0 24px;max-width:none}}
  /* FOC & write-offs: wide tables fit smaller screens without side scrolling */
  #v #oldv #writeOffView th{white-space:normal;padding:7px 6px;line-height:1.25} #v #oldv #writeOffView td{padding:7px 6px} @media (max-width:1600px){#v #oldv #writeOffView table{font-size:12px} #v #oldv #writeOffView td{white-space:normal}}
  th+th,td+td{border-left:1px solid var(--line)}
  /* smaller laptop screens (or Windows display zoom 125%/150%): tables get tighter so they fit without side scrolling */
  @media screen and (max-width:1600px){#v table,#v #oldv table{font-size:12.5px} #v th,#v #oldv th{padding:7px 7px;white-space:normal;line-height:1.25} #v td,#v #oldv td{padding:6px 7px}}
  @media screen and (max-width:1400px){#v table,#v #oldv table{font-size:12px} #v th,#v #oldv th{padding:6px 5px} #v td,#v #oldv td{padding:5px 5px} .sidebar{width:200px} main{margin-left:200px;padding:24px 24px 32px} }
  td.l,th.l{text-align:left}
  tbody tr:hover td,tr:hover td{background:#fafbf9}
  .st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:#eef0ec;color:#3c4442}
  .st.LOADED{background:#e6eef8;color:#1f4f86}.st.RETURNED{background:#fbf0de;color:var(--amb)}.st.SETTLED{background:#efe8f6;color:#5b3c86}.st.CLOSED{background:var(--soft);color:var(--accent-ink)}
  .bad{color:var(--neg);font-weight:600} tr.tot td{font-weight:700;background:#f4f7f2}.warn{color:var(--amb);font-size:12px}
  .muted{color:var(--muted);font-size:12.5px}
  .msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:8px;color:#fff;z-index:9;max-width:90%;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .msg.ok{background:var(--accent-ink)}.msg.er{background:var(--neg)}
  /* login */
  .login-wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
  .login-side{background:var(--accent-ink);color:#fff;padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
  .login-side .brandlogo{height:72px;border-radius:10px}
  .login-side .brand small{color:#9fbdb9}
  .login-side h2{font-size:30px;font-weight:500;line-height:1.25;max-width:440px}
  .login-side p{color:#c3d6d3;font-size:14px;max-width:400px;line-height:1.6;margin-top:14px}
  .login-side>small{color:#9fbdb9;font-size:12px}
  .login-main{display:grid;place-items:center;padding:40px}
  .login-card{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
  .login-card h1{font-size:24px} .login-card .lead{color:var(--muted);font-size:14px;margin:-8px 0 12px}
  .login-card label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
  .login-card input,.login-card button{height:40px;width:100%}
  @media (max-width:900px){
    .sidebar{position:static;width:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}
    nav{flex-direction:row;flex-wrap:wrap}.navlabel{display:none}nav button{width:auto}
    .sidebar-bottom{flex-direction:row;flex-wrap:wrap;align-items:center}
    main{margin:0;padding:16px}.login-wrap{grid-template-columns:1fr}.login-side{display:none}
  }
  main>header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .eyebrow{font-size:11.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  #subtitle{color:var(--muted);margin-top:6px;font-size:14px}
  .header-actions{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:flex-end}
  .header-actions label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
  .card>h3,.card .row>h3{font-size:15px;margin:0 0 16px}
  .card>.muted:first-of-type{margin-top:-10px}
  footer{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);padding-top:8px}
  .notice{font-size:13px;color:#5f5233;background:#faf6ea;border:1px solid #efe5c8;border-radius:8px;padding:10px 14px;line-height:1.5}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px} @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .dbars{display:flex;align-items:flex-end;gap:4px;height:210px;padding-top:18px} .dbars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0} .dbars i{display:block;width:70%;background:#1B4332;border-radius:3px 3px 0 0} .dbars i.z{background:#d8dad5} .dbars em{font-style:normal;font-size:9px;color:#6b7370;white-space:nowrap} .dbars b{font-size:10px;color:#6b7370;font-weight:500;margin-top:4px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
  .kpi span{font-size:11.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.kpi b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}.kpi small{color:var(--muted);font-size:12px}
  .sheet-head{display:flex;justify-content:space-between;border-bottom:2px solid var(--accent-ink);padding-bottom:6px;margin-bottom:8px;font-size:14px}
  .signs{display:flex;justify-content:space-between;gap:20px;margin-top:46px}.signs span{flex:1;border-top:1px solid var(--ink);padding-top:6px;text-align:center;font-size:12px;color:var(--muted)}
  .cobox{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted)} .cosel{position:relative} .cosel summary{list-style:none;cursor:pointer;border:1px solid var(--line2);border-radius:6px;padding:8px 30px 8px 12px;background:#fff;min-width:120px;font-size:14px;position:relative}
  .cosel summary::-webkit-details-marker{display:none} .cosel summary::after{content:'▾';position:absolute;right:10px;color:var(--muted)}
  .cosel>div{position:absolute;z-index:20;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid var(--line2);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.08);padding:6px;min-width:150px}
  .cosel>div label{display:flex;gap:8px;align-items:center;padding:6px 8px;font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0;cursor:pointer;flex-direction:row}
  table.ctr th:not(.l),table.ctr td:not(.l){text-align:center} .udlg{border:1px solid var(--line2);border-radius:10px;padding:22px;width:min(440px,92vw)} .udlg form{display:flex;flex-direction:column;gap:10px} .udlg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)} .udlg::backdrop{background:rgba(0,0,0,.3)}
  tr.warn td{background:#fff4e5}
  .os{border-collapse:collapse;font-size:12.5px;width:100%} .os td{border:1px solid #d9dcd6;padding:4px 7px;white-space:nowrap} .os td.n{text-align:right;font-family:'IBM Plex Mono',monospace}
  .os tr.h td{background:var(--accent-ink);color:#fff;font-weight:600} .os tr.b td{font-weight:600} .os tr.t td{background:var(--soft);font-weight:600;color:var(--accent-ink)} .os tr.g td{border:0;height:10px} .os tr.s td{border:0;padding-top:34px}
  .rtabs{display:flex;gap:6px;flex-wrap:wrap} .rtabs button.on{background:var(--accent-ink);color:#fff;border-color:var(--accent-ink)}
#osh button.primary{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
#osh button.primary:hover{background:#14382A}
#osh .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
#osh .filter-primary{display:grid;grid-template-columns:1fr 1fr auto auto;gap:12px;align-items:end}
#osh .section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
#osh .section-head h2{font-size:15px}
#osh .section-head p{font-size:12.5px;color:var(--muted);margin-top:4px}
#osh .report>.section-head{padding:0 20px}
#osh .report-type-tabs{display:inline-flex;gap:2px;background:#eceeea;padding:3px;border-radius:8px;margin-bottom:16px}
#osh .report-type-tabs button{border:0;background:none;padding:7px 14px;border-radius:6px;color:#3c4442}
#osh .report-type-tabs button.primary{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
#osh .report-filters{display:grid;grid-template-columns:minmax(0,260px) minmax(0,200px) auto;gap:12px;align-items:end;margin-bottom:16px;justify-content:start}
#osh .saved-actions{display:flex;gap:8px}
#osh .mobile-report-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
#osh .mobile-report{border-collapse:collapse;min-width:100%;font-family:'IBM Plex Mono',monospace;font-size:12px}
#osh .mobile-report td{padding:6px 10px;border-bottom:1px solid #f0f1ee;white-space:nowrap}
#osh #workbookReports h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px;font-weight:500}
#osh .cash-position{max-width:460px;border:1px solid var(--line);border-radius:8px}
#osh .cash-position div{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
#osh .cash-position div:last-child{border:0;font-weight:600}
#osh .cash-position strong{font-family:'IBM Plex Mono',monospace;font-weight:500}
#osh .login-card input,#osh .login-card select,#osh .login-card button.primary{height:40px}
#osh .add-user-dialog .section-head{margin-bottom:2px}
#osh .report-filters button,#osh .report-type-tabs button{white-space:nowrap}
#osh .section-head button{white-space:nowrap;flex:none}
#osh .skel{display:block;background:linear-gradient(90deg,#eceeea 25%,#f6f7f4 37%,#eceeea 63%);background-size:400% 100%;animation:skel 1.3s ease infinite;border-radius:7px}
  @media print{ @page{size:A4;margin:10mm} body{background:#fff} .sidebar,.header-actions,.noprint,footer,.msg,#xl,#pr{display:none!important}
    main{margin:0;padding:0;max-width:none;gap:10px} .card{border:0;padding:0} .sheet{break-after:page} .tw{overflow:visible;border:0;max-height:none!important}
    table{font-size:10.5px} th,td{padding:4px 6px} th{position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact} input,select{border:0;padding:0}
    .printonly{display:block!important} main:has(.screp) > header{display:none!important} }
  .printonly{display:none}
  #v #oldv .mobile-report{font-size:11.5px} #v #oldv .mobile-report td{padding:5px 7px}   /* daily sheets preview fits the screen (vehicle and item names visible) */
  .link-btn{border:0;background:none;color:var(--muted);padding:0;text-decoration:underline;text-underline-offset:2px;font-size:13px}
  /* ---- motion & polish (CSS only; no effect on data or speed) ---- */
  @keyframes mjUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes mjFade{from{opacity:0}to{opacity:1}}
  @keyframes mjPop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes mjToast{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes mjSpin{to{transform:rotate(360deg)}}
  @keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}
  #v.an>*{animation:mjUp .28s cubic-bezier(.2,.7,.2,1) both} #v.an>*:nth-child(2){animation-delay:.04s} #v.an>*:nth-child(3){animation-delay:.08s} #v.an>*:nth-child(n+4){animation-delay:.12s}
  #v.an .kpis>.kpi{animation:mjUp .3s cubic-bezier(.2,.7,.2,1) both} #v.an .kpis>.kpi:nth-child(2){animation-delay:.04s} #v.an .kpis>.kpi:nth-child(3){animation-delay:.08s} #v.an .kpis>.kpi:nth-child(n+4){animation-delay:.12s}
  main>header h1{animation:mjFade .25s ease both}

      <button class="p" id="go">Sign in</button></div></div></div>`;
  const go = async () => {
    const u = $('#u').value.trim().toLowerCase(); if (!u) return;

}

async function boot(){
  const dv = await rpc('device_register', { p_label: ((navigator.userAgent.match(/\(([^)]+)\)/) || [])[1] || 'Browser').slice(0, 120) }).catch(() => null);
  if (dv && !dv.ok) { toast(dv.error, false); await sb.auth.signOut(); return renderLogin(); }
  S.me = await rpc('me');
  if (!S.me || !S.me.role) { toast('This login is not linked to an active staff member', false); await sb.auth.signOut(); return; }
  const [items, staff, vans, branches] = await Promise.all([
    q(sb.from('items').select('*')), q(sb.from('staff').select('id,name,role,branch_id,active').order('name')),
    q(sb.from('vans').select('*').eq('active', true).order('van_no')), q(sb.from('branches').select('*'))]);
  Object.assign(S, { items, staff, vans, branches });
  await loadAccess();
  if (S.me.branch_id) S.brs = [S.me.branch_id];
  else { let k = []; try { k = JSON.parse(localStorage.getItem('mj_brs') || '[]'); } catch (e) {} S.brs = branches.filter(b => k.includes(b.id)).map(b => b.id); if (!S.brs.length) S.brs = [branches.find(b => b.code === 'MGAZ')?.id || branches[0].id]; }
  S.br = S.brs[0];
  S.from = S.date.slice(0,8) + '01';
  const tabs = tabsFor(); S.tab = tabs[0][0];
  render();
}

function tabsFor(){
  // Loading, Return and Requirement are inside Office entry: shown separately only to users without Office entry
  // Office entry: everyone who works with loading / return / requirement sees it; only admin and accountant can edit
  const inOE = ['load','ret','req'], hasOE = S.me?.role !== 'SALESMAN' && (canV('oe') || inOE.some(k => canV(k)));
  const t = [], G = (g, ...x) => x.forEach(([k,l]) => { if (k === 'oe' ? hasOE : (canV(k) && !(hasOE && inOE.includes(k)))) t.push([k,l,g]); });
  G('Summary', ['ov','Overview'], ['dd','Daily dashboard']);
  G('Daily flow', ['load','Loading'], ['ret','Return'], ['days','Van days'], ['oe','Office entry'], ['wh','Warehouse'], ['ite','I Trade entry'], ['sc','Stock count'], ['imp','Sales import'], ['sri','Stock report'], ['req','Requirement']);
  G('Reports', ['ds','Daily sheets'], ['pc','Petty cash'], ['se','Short & excess'], ['wo','FOC & write-offs'], ['qs','Qty by salesman']);
  if (canV('wh')) t.push(['whr','Warehouse report','Reports']);
  G('Analysis', ['sa','Sales analysis'], ['lr','Loading & return'], ['vl','Van log'], ['co','Collections'], ['ex','Expenses']);
  if (has('ADMIN')) t.push(['itm','Items & BOM','Admin'], ['stf','Users','Admin'], ['em','Email reports','Admin'], ['set','Settings','Admin'], ['acc','Role access','Admin']);
  G('Admin', ['dc','Data check']);
  if (!t.length) t.push(['none','No access','']);
  return t;
}

// ---------- quantity grid (one Qty per item, no carton conversion) ----------
function qtyGrid(rows){   // rows: [{it, qty, hint}]
  return `<div class="tw"><table><tr><th class="l">Item</th><th>Qty</th><th class="muted">Ref</th></tr>
    ${rows.map(({it,qty,hint}) => `<tr data-id="${it.id}">
      <td class="l">${esc(it.short_name || it.name)}</td>
      <td><input type="number" min="0" step="1" class="c" value="${num(qty)||''}"></td>
      <td class="muted">${esc(hint||'')}</td></tr>`).join('')}</table></div>`;
}
function bindGrid(root){}
const gridValue = tr => num($('.c',tr).value);

// ---------- LOADING ----------
async function vLoading(){
  const v = $('#v');
  v.innerHTML = `<div class="card"><h3>Loading (board) — ${S.date}</h3>
    <div class="row"><label>Salesman<select id="sm"><option value="">Select</option>${smOptions(S.lsm)}</select></label>
      <label>Van (plate no.)<select id="van"><option value="">Select van</option>${S.vans.filter(x => S.brs.includes(x.branch_id)).map(x=>`<option value="${x.id}">${esc(x.van_no)}</option>`).join('')}</select></label>
      <label>Start KM<input type="number" id="km" style="width:110px"></label>
      <label>Load temp<input type="number" id="tp" step="0.1"></label></div><div id="g"></div></div>`;
  $('#sm').onchange = async e => { S.lsm = +e.target.value || null; await fill(); };
  async function fill(){
    if (!S.lsm) { $('#g').innerHTML = ''; return; }
    const day = (await q(sb.from('van_day').select('*').eq('salesman_id', S.lsm).eq('business_date', S.date)))[0];
    const lines = day ? await q(sb.from('loading_lines').select('item_id,qty').eq('van_day_id', day.id)) : [];
    const req = await q(sb.from('requirement_lines').select('item_id,qty_cartons').eq('salesman_id', S.lsm).eq('required_date', S.date));
    if (day) { $('#van').value = day.van_id || ''; $('#km').value = day.start_km ?? ''; $('#tp').value = day.load_temp ?? ''; }
    else { const [prev] = await q(sb.from('van_day').select('van_id,end_km').eq('salesman_id', S.lsm).lt('business_date', S.date).not('van_id', 'is', null).order('business_date', { ascending:false }).limit(1));
      $('#van').value = prev?.van_id || ''; $('#km').value = prev?.end_km ?? ''; }   // his last van and its last KM
    const locked = day && !['OPEN','LOADED'].includes(day.status);
    const rows = sellItems().map(it => {
      const l = lines.find(x => x.item_id === it.id), r = req.find(x => x.item_id === it.id);
      return { it, qty: l ? l.qty : 0, hint: r ? 'Req ' + (+r.qty_cartons) : '' };
    });
    $('#g').innerHTML = (day ? `<p class="muted">Status <span class="st ${day.status}">${day.status}</span>${locked ? ' — loading is locked after return' : ''}</p>` : '')
      + qtyGrid(rows) + `<div class="row" style="margin-top:8px"><button class="p" id="post" ${locked?'disabled':''}>Post loading</button></div>`;
    bindGrid($('#g'));
    $('#post') && ($('#post').onclick = async () => {
      const ln = [...$('#g').querySelectorAll('tr[data-id]')].map(tr => ({ item_id:+tr.dataset.id, qty:gridValue(tr) })).filter(x => x.qty > 0);
      if (!ln.length) return toast('Enter at least one item', false);
      $('#post').disabled = true;
      try { await rpc('post_loading', { p_salesman:S.lsm, p_date:S.date, p_van:+$('#van').value||null, p_start_km:+$('#km').value||null, p_load_temp:$('#tp').value===''?null:+$('#tp').value, p_lines:ln });
            toast('Loading posted'); await fill(); } finally { $('#post') && ($('#post').disabled = false); }
    });
  }
  if (S.lsm) await fill();
}

// ---------- RETURN ----------
async function vReturn(){
  const days = await q(sb.from('van_day').select('id,salesman_id,status').eq('business_date', S.date).in('branch_id', S.brs).in('status',['LOADED','RETURNED']));
  const v = $('#v');
  v.innerHTML = `<div class="card"><h3>Return — ${S.date}</h3>
    <div class="row"><label>Salesman<select id="d"><option value="">Select</option>${days.map(d=>`<option value="${d.id}">${esc(S.staff.find(s=>s.id===d.salesman_id)?.name)} (${d.status})</option>`).join('')}</select></label></div>
    <div id="g"></div></div>`;
  $('#d').onchange = e => fill(+e.target.value);
  async function fill(id){
    if (!id) { $('#g').innerHTML=''; return; }
    const day = (await q(sb.from('van_day').select('*').eq('id', id)))[0];
    const [rec, ret] = await Promise.all([q(sb.from('v_van_day_items').select('*').eq('van_day_id', id)), q(sb.from('return_lines').select('*').eq('van_day_id', id))]);
    const ids = [...new Set([...rec.map(r=>r.item_id), ...ret.map(r=>r.item_id)])];
    const its = sellItems().filter(i => ids.includes(i.id));
    const F = ['good','damage','expiry','waste','foc'];
    $('#g').innerHTML = `<div class="row"><label>End KM<input type="number" id="km" style="width:110px" value="${day.end_km??''}"></label>
      <label>Unload temp<input type="number" id="tp" step="0.1" value="${day.unload_temp??''}"></label>
      <label>Carton small<input type="number" id="cs" value="${day.carton_small||''}"></label>
      <label>Carton big<input type="number" id="cb" value="${day.carton_big||''}"></label></div>
      <p class="muted">Quantities in packs (raw egg in pieces). Expected = load − sale + GRV (sales imported so far).</p>
      <div class="tw"><table><tr><th class="l">Item</th><th>Load</th><th>Expected</th>${F.map(f=>`<th>${f}</th>`).join('')}<th>Total</th><th>Diff</th></tr>
      ${its.map(it => { const r = rec.find(x=>x.item_id===it.id)||{}, t = ret.find(x=>x.item_id===it.id)||{};
        return `<tr data-id="${it.id}" data-exp="${num(r.expected_return)}"><td class="l">${esc(it.short_name||it.name)}</td><td>${num(r.load)}</td><td>${num(r.expected_return)}</td>
        ${F.map(f=>`<td><input type="number" min="0" class="${f}" value="${num(t[f])||''}"></td>`).join('')}<td class="tot"></td><td class="df"></td></tr>`; }).join('')}
      </table></div><div class="row" style="margin-top:8px"><button class="p" id="post">Post return</button></div>`;
    const calc = tr => { const tot = F.reduce((a,f)=>a+num($('.'+f,tr).value),0), df = tot - num(tr.dataset.exp);
      tr.querySelector('.tot').textContent = tot; const c = tr.querySelector('.df'); c.textContent = df ? (df>0?'+':'')+df : ''; c.className = 'df ' + (df ? 'bad' : ''); };
    $('#g').querySelectorAll('tr[data-id]').forEach(tr => { calc(tr); tr.oninput = () => calc(tr); });
    $('#post').onclick = async () => {
      const ln = [...$('#g').querySelectorAll('tr[data-id]')].map(tr => Object.fromEntries([['item_id',+tr.dataset.id], ...F.map(f=>[f, num($('.'+f,tr).value)])]));
      $('#post').disabled = true;
      try { await rpc('post_return', { p_van_day:id, p_end_km:+$('#km').value||null, p_unload_temp:$('#tp').value===''?null:+$('#tp').value,
              p_carton_small:+$('#cs').value||0, p_carton_big:+$('#cb').value||0, p_lines:ln }); toast('Return posted'); await fill(id); }
      finally { $('#post') && ($('#post').disabled = false); }
    };
  }
}

      <span class="st ${day.status}">${day.status}</span></h3></div>

      ${rec.sort((a,b)=>(item(a.item_id).display_order||0)-(item(b.item_id).display_order||0)).map(r => { const need = num(r.excess)||num(r.short)||r.flag;

async function vImport(){ const __t = S.nav;
  if (__t !== S.nav) return; $('#v').innerHTML = `<div class="card"><h3>Sales import (iTrade Periodical Sales Detailed Report)</h3>
    <p class="muted">Export the report from iTrade for the dates you want (Excel or CSV) and choose the file. The company of each invoice comes from its Company Name (or the MGAZ / MGT invoice prefix). Company and Warehouse are saved with every line.
    Invoices already imported are skipped; an invoice changed in iTrade since the last import is replaced with the new lines. Invoices missing from the file for its dates are marked cancelled.</p>
    <div class="row"><input type="file" id="f" accept=".xlsx,.xls,.csv"><button class="p" id="go" disabled>Import</button></div><div id="out"></div></div>`;
  let rows = [];
  $('#f').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    const XLSX = await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]], grid = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:true });
    const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    const iso = v => { if (v instanceof Date) return new Date(v.getTime() - v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
      const s = String(v).trim(); let m;
      if ((m = s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[-\/ ](\d{4})/))) return `${m[3]}-${String(MON[m[2].toLowerCase()]).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
      if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
      if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0]; return null; };
    const T = v => String(v ?? '').replace(/\s+/g, ' ').trim();
    const hi = grid.findIndex(r => r.some(v => T(v) === 'Invoice No') && r.some(v => T(v) === 'Tran Date'));
    const nested = hi > -1 && !grid[hi].some(v => T(v) === 'Item Code');
    if (nested) {
      // iTrade "Periodical Sales Detailed Report": one invoice header row, then an "Sl No" row and its item rows.
      const H = {}; grid[hi].forEach((v, i) => { const k = T(v); if (k && !(k in H)) H[k] = i; });
      const si = grid.findIndex((r, i) => i > hi && T(r[1] ?? '') === 'Sl No' || (i > hi && r.some(v => T(v) === 'Sl No') && r.some(v => T(v) === 'Item Code')));
      const I = {}; (grid[si] || []).forEach((v, i) => { const k = T(v); if (k && !(k in I)) I[k] = i; });
      const g = (r, k) => r[H[k]] ?? '', gi = (r, k) => r[I[k]] ?? '';
      let inv = null; rows = [];
      for (let i = hi + 1; i < grid.length; i++) { const r = grid[i];
        if (T(g(r, 'Invoice No')) && (T(g(r, 'Company Name')) || g(r, 'Tran Date') !== '')) { inv = r; continue; }
        if (!inv || T(gi(r, 'Sl No')) === 'Sl No' || !T(gi(r, 'Item Code'))) continue;
        rows.push({ 'Company Name': T(g(inv, 'Company Name')), 'Warehouse': T(g(inv, 'Warehouse')), 'Tran Date': iso(g(inv, 'Tran Date')), 'Tran No': T(g(inv, 'Tran No')),
          'Invoice No': T(g(inv, 'Invoice No')), 'User': T(g(inv, 'User')), 'Sales Executive': T(g(inv, 'Sales Executive')) === 'None' ? '' : T(g(inv, 'Sales Executive')),
          'Tran Type': T(g(inv, 'TranType') || g(inv, 'Tran Type')), 'Tender Type': T(g(inv, 'Tender Type')), 'Head No': T(g(inv, 'Head No')), 'Account Name': T(g(inv, 'Account Name')), 'Location': T(g(inv, 'Locations')),
          'Item Code': T(gi(r, 'Item Code')), 'Item Name': T(gi(r, 'Item Name')), 'Unit': T(gi(r, 'Unit')) || 'PCS',
          ...Object.fromEntries(['Qty','Rate','Gross','Disc','Net','VAT','Net Incl VAT','Profit','CF'].map(k => [k, num(gi(r, k))])) }); }
    } else {
      const raw = XLSX.utils.sheet_to_json(ws, { defval:'', raw:true });
      rows = raw.map(r => Object.fromEntries(Object.entries(r).map(([k,v]) => [k.trim(), v])))
        .filter(r => r['Invoice No'] && r['Item Code'])
        .map(r => ({ ...r, 'Tran Date': iso(r['Tran Date']), 'Item Code': String(r['Item Code']).trim(), 'Head No': String(r['Head No']||'').trim(),
                     'Company Name': T(r['Company Name']), 'Warehouse': T(r['Warehouse']),
                     ...Object.fromEntries(['Qty','Rate','Gross','Disc','Net','VAT','Net Incl VAT','Profit','CF'].map(k => [k, num(r[k])])) }));
    }
    const bad = rows.filter(r => !r['Tran Date']).length;
    const by = branchSplit(rows);
    $('#out').innerHTML = `<p>${rows.length} lines read${bad?` — <span class="bad">${bad} with unreadable date</span>`:''}. ${Object.entries(by).map(([b,r])=>`${b}: ${r.length}`).join(' · ')}</p>`;
    $('#go').disabled = !rows.length || bad > 0;
  };
  const branchSplit = rs => rs.reduce((a,r) => { const c = String(r['Company Name'] || '').toUpperCase(); const b = /AJMAN/.test(c) ? 'MGT' : /QUOZ|QOUZ/.test(c) ? 'MGAZ' : String(r['Invoice No']).split('-')[0].toUpperCase(); (a[b] ||= []).push(r); return a; }, {});
  $('#go').onclick = async () => {
    $('#go').disabled = true; const out = []; const tot = rows.length; let sent = 0, imp = 0;
    const prog = (lab) => { const pc = tot ? Math.round(sent / tot * 100) : 0;
      $('#out').innerHTML = `<p><b>Importing ${pc}%</b> · ${sent.toLocaleString()} of ${tot.toLocaleString()} lines processed · ${imp.toLocaleString()} new lines imported${lab ? ' · ' + lab : ''}</p>
        <div style="height:10px;background:#E8EFEA;border-radius:6px;overflow:hidden;margin:6px 0 10px"><div style="height:100%;width:${pc}%;background:linear-gradient(90deg,#1B4332,#F2994A);transition:width .3s"></div></div>` + out.join(''); };
    try {
      for (const [code, rs] of Object.entries(branchSplit(rows))) {
        const br = S.branches.find(b => b.code === code);
        if (!br) { out.push(`<p class="bad">${esc(code)}: unknown branch prefix, skipped</p>`); continue; }
        // sent in parts of whole days (about 400 lines each) so a long period does not time out
        const days = [...new Set(rs.map(x => x['Tran Date']))].sort(), parts = []; let cur = [];
        days.forEach(d => { const dl = rs.filter(x => x['Tran Date'] === d); if (cur.length && cur.length + dl.length > 400) { parts.push(cur); cur = []; } cur = cur.concat(dl); }); if (cur.length) parts.push(cur);
        const r = { rows:0, new:0, already_there:0, replaced_invoices:0, cancelled:0, new_customers:0, customers_moved:0, from:days[0], to:days[days.length-1], unknown_items:'', not_salesman_sales_executives:'' };
        for (const [k, part] of parts.entries()) { prog(`${esc(br.name)} part ${k+1} of ${parts.length}`);
          const x = await rpc('import_sales', { p_branch:br.id, p_rows:part, p_full_export:true }); sent += part.length; imp += num(x.new); prog(`${esc(br.name)} part ${k+1} of ${parts.length}`);
          ['rows','new','already_there','replaced_invoices','cancelled','new_customers','customers_moved'].forEach(f => r[f] += num(x[f]));
          ['unknown_items','not_salesman_sales_executives'].forEach(f => { if (x[f]) r[f] = [...new Set((r[f] ? r[f] + ', ' : '').concat(x[f]).split(', ').filter(Boolean))].join(', '); }); }
        out.push(`<div class="card"><b>${esc(br.name)}</b> ${r.from} to ${r.to}<br>Lines ${r.rows} · new ${r.new} · already there ${r.already_there} · invoices changed in iTrade and replaced ${r.replaced_invoices} · cancelled ${r.cancelled}
          · new customers ${r.new_customers} · customers moved ${r.customers_moved}
          ${r.unknown_items?`<br><span class="bad">Unknown items: ${esc(r.unknown_items)}</span>`:''}
          ${r.not_salesman_sales_executives?`<br><span class="muted">Not a salesman (store/office sales): ${esc(r.not_salesman_sales_executives)}</span>`:''}</div>`);
      }
      sent = tot; toast('Import finished');
    } catch (e) { out.push(`<p class="bad">Import stopped: ${esc(e.message || e)}</p>`); } finally { prog(sent >= tot ? 'done' : 'stopped'); }
  };
}

// ---------- I TRADE ENTRY (what to post in iTrade for the day: production, unwrap, broken, wastage) ----------
// ---------- iTrade Store Issue files (same as the old portal): one .txt per salesman, all in one zip ----------
// Line: SITE,BARCODE,,QTY (CRLF).  LOADING = issue to van: boarded qty less what the store billed for him that day;
// raw egg = only what he billed himself.  RETURN = issue from van: good + damage + expiry + waste + FOC; raw egg = his own sales return.
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(files){   // [{name, text}] -> Blob (stored, no compression)
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const le = (n, b) => { const a = new Uint8Array(b); for (let i = 0; i < b; i++) a[i] = (n >>> (8*i)) & 255; return a; };
  files.forEach(f => { const nm = enc.encode(f.name), data = enc.encode(f.text), c = crc32(data);
    const head = [le(0x04034b50,4), le(20,2), le(0,2), le(0,2), le(0,2), le(0x21,2), le(c,4), le(data.length,4), le(data.length,4), le(nm.length,2), le(0,2), nm];
    const len = head.reduce((a,x) => a + x.length, 0) + data.length; parts.push(...head, data);
    cen.push(le(0x02014b50,4), le(20,2), le(20,2), le(0,2), le(0,2), le(0,2), le(0x21,2), le(c,4), le(data.length,4), le(data.length,4), le(nm.length,2), le(0,2), le(0,2), le(0,2), le(0,2), le(0,4), le(off,4), nm);
    off += len; });
  const cl = cen.reduce((a,x) => a + x.length, 0);
  return new Blob([...parts, ...cen, le(0x06054b50,4), le(0,2), le(0,2), le(files.length,2), le(files.length,2), le(cl,4), le(off,4), le(0,2)], { type:'application/zip' });
}
async function itradeZip(kind){
  const br = S.branches.find(b => b.id === S.br) || {}, site = br.code || 'MGAZ', tag = site === 'MGT' ? 'AJMAN' : 'ALQUOZ';
  const M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'], p = S.date.split('-'), day = p[2] + ' ' + M[+p[1]-1] + ' ' + p[0];
  const [days, st, sl] = await Promise.all([q(sb.from('van_day').select('id,salesman_id').eq('branch_id', S.br).eq('business_date', S.date)),
    q(sb.from('staff').select('id,name,itrade_name').eq('branch_id', S.br)),
    fetchAll(() => sb.from('sales_lines').select('salesman_id,itrade_user,item_id,tran_type,qty').eq('branch_id', S.br).eq('tran_date', S.date).eq('cancelled', false))]);
  const lines = days.length ? await byIds(kind === 'LOADING' ? 'loading_lines' : 'return_lines', '*', 'van_day_id', days.map(d => d.id)) : [];
  const own = (r, s) => !r.itrade_user || !s.itrade_name || r.itrade_user.trim().toUpperCase() === s.itrade_name.trim().toUpperCase();
  const code = it => it.barcode || it.itrade_code, files = [];
  st.forEach(s => {
    const dm = days.filter(d => d.salesman_id === s.id).map(d => d.id), q1 = {};
    lines.filter(l => dm.includes(l.van_day_id)).forEach(l => { const it = item(l.item_id); if (it.item_type === 'RAW_EGG') return;
      q1[l.item_id] = (q1[l.item_id] || 0) + (kind === 'LOADING' ? num(l.qty) : num(l.good) + num(l.damage) + num(l.expiry) + num(l.waste) + num(l.foc)); });
    sl.filter(r => r.salesman_id === s.id && r.item_id).forEach(r => { const it = item(r.item_id), mine = own(r, s);
      if (it.item_type === 'RAW_EGG') { if (mine && (kind === 'LOADING' ? r.tran_type === 'CR' : r.tran_type !== 'CR')) q1[r.item_id] = (q1[r.item_id] || 0) + Math.abs(num(r.qty)); }
      else if (kind === 'LOADING' && !mine && r.tran_type === 'CR') q1[r.item_id] = (q1[r.item_id] || 0) - num(r.qty); });   // billed by the store: already moved
    const L = Object.entries(q1).map(([id, v]) => [item(+id), Math.round(v * 1000) / 1000]).filter(([it, v]) => v > 0 && code(it))
      .sort((a,b) => (a[0].display_order||0) - (b[0].display_order||0)).map(([it, v]) => `${site},${code(it)},,${v}`);
    if (L.length) files.push({ name:`${s.name.replace(/[\\\/:*?"<>|]+/g,' ').trim().toUpperCase()}_${kind}_${day}.txt`, text:L.join('\r\n') + '\r\n' });
  });
  if (!files.length) return toast(`No ${kind.toLowerCase()} found for ${day}.`, false);
  const a = document.createElement('a'); a.href = URL.createObjectURL(makeZip(files)); a.download = `${tag} ${kind} ${day}.zip`; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast(`Downloaded ${a.download} · ${files.length} salesman file${files.length === 1 ? '' : 's'}`);
}

// generic table: cols = [{k, l, left, f(row)->value, sum:true, money:true, cls(row)}]
function table(cols, rows, opt = {}){

  const show = (c, v) => v === '' || v == null ? '' : c.money ? money(v) : typeof v === 'number' ? r2(v) : esc(v);
  const tot = cols.some(c => c.sum) && rows.length ? `<tr class="tot">${cols.map((c,i) => `<td class="${c.left?'l':''}">${i === 0 ? 'Total' : c.sum ? show(c, rows.reduce((a,r) => a + num(val(c,r)), 0)) : ''}</td>`).join('')}</tr>` : '';
  return rows.length ? `<div class="tw"${opt.max ? ` style="max-height:${opt.max}px"` : ''}><table><tr>${cols.map(c => `<th class="${c.left?'l':''}">${esc(c.l)}</th>`).join('')}</tr>
    ${rows.map((r,ri) => `<tr${opt.click ? ` data-row="${ri}" style="cursor:pointer"` : ''}>${cols.map(c => { const v = val(c, r); return `<td class="${c.left?'l':''} ${c.cls ? c.cls(r) : ''}">${c.html ? c.html(r) : show(c, v)}</td>`; }).join('')}</tr>`).join('')}${tot}</table></div>`
    : `<p class="muted">${opt.empty || 'No data for this period.'}</p>`;

    .sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.sm.localeCompare(b.sm));
  const types = [...new Set(rows.map(r => r.expense_type))].sort();
  const piv = aggregate(rows, r => r.sm, r => ({ sm:r.sm, t:{} }), (o,r) => o.t[r.expense_type] = (o.t[r.expense_type] || 0) + num(r.amount)).sort((a,b) => a.sm.localeCompare(b.sm));
  const c1 = [{k:'sm',l:'Salesman',left:1}, ...types.map(t => ({ l:t.charAt(0)+t.slice(1).toLowerCase(), money:1, sum:1, f:r => num(r.t[t]) })), { l:'Total', money:1, sum:1, f:r => Object.values(r.t).reduce((a,v) => a + v, 0) }];
  const c2 = [{k:'date',l:'Date'},{k:'sm',l:'Salesman',left:1},{k:'expense_type',l:'Type'},{k:'cust',l:'Customer',left:1},{k:'note',l:'Note',left:1},{k:'amount',l:'Amount AED',money:1,sum:1}];

// ---------- PETTY CASH ----------
const PT = [['RECEIPT','Receipt',1],['PAYMENT','Payment',-1],['FOOD ALLOWANCE','Food allowance',-1],['TRAVEL ALLOWANCE','Travel allowance',-1],['DEPOSIT','Bank deposit',-1],['SUSPENSE','Suspense given',-1],['SUSPENSE CLEARED','Suspense cleared',1]];
const pdir = t => (PT.find(x => x[0] === t) || [0,0,-1])[2];
async function vPetty(){ const __t = S.nav;
  loading();
  const { error:pe } = await sb.from('petty_cash').select('id').limit(1);
  if (pe) { if (__t !== S.nav) return; $('#v').innerHTML = `<div class="card"><div class="notice">Petty cash is not installed in the database yet. Run <b>docs/sql/PETTY CASH - CREATE.sql</b> in the Supabase SQL editor once, then reload this page.</div></div>`; return; }
  const [L, cs, sus] = await Promise.all([
    q(sb.from('petty_cash').select('*').eq('branch_id', S.br).eq('entry_date', S.date).order('line_no')),
    // opening and the vans' cash come from the daily cash sheet (same figures as Daily sheets → Cash sheet)
    window.MJ_REPORTS.report(S.branches.find(b => b.id === S.br)?.code === 'MGT' ? 'AJMAN' : 'AL QUOZ', 'CASH SHEET', S.date, '').catch(() => null),
    fetchAll(() => sb.from('petty_cash').select('entry_date,line_type,party,ref,amount').eq('branch_id', S.br).in('line_type', ['SUSPENSE','SUSPENSE CLEARED']).lte('entry_date', S.date).order('entry_date'))]);
  const E = canE('pc');
  // effect of office lines on the cash sheet closing: receipts in; payments, allowances and this day's bank deposits out (suspense only changes cash in hand)
  const eff = l => { const t = l.line_type, a = num(l.amount); if (t === 'RECEIPT') return a; if (['PAYMENT','FOOD ALLOWANCE','TRAVEL ALLOWANCE'].includes(t)) return -a; if (t === 'DEPOSIT' && (!l.for_date || l.for_date === S.date)) return -a; return 0; };
  const P = k => num(((cs && cs.position) || []).find(x => x[0] === k)?.[2]);
  const vans = P('+ CASH SALES') - P('− CASH SALES RETURN') + P('+ CASH RECEIPTS') - P('− PAYMENTS') - P('− EXPENSES') - P('− BANK DEPOSITS') - L.reduce((a, l) => a + eff(l), 0);
  let lines = L.map(l => ({ line_type:l.line_type, ref:l.ref || '', party:l.party, note:l.note || '', for_date:l.for_date || '', amount:num(l.amount) }));
  const openSus = aggregate(sus, r => r.party.trim().toUpperCase(), r => ({ party:r.party, given:'', amount:0 }), (o,r) => { if (r.line_type === 'SUSPENSE') { o.amount += num(r.amount); o.given = o.given || r.entry_date; } else o.amount -= num(r.amount); })
    .filter(o => r2(o.amount) > 0);
  const draw = () => {
    const tin = lines.filter(l => pdir(l.line_type) > 0).reduce((a,l) => a + num(l.amount), 0), tout = lines.filter(l => pdir(l.line_type) < 0).reduce((a,l) => a + num(l.amount), 0);
    const oin = lines.reduce((a, l) => a + Math.max(0, eff(l)), 0), oout = -lines.reduce((a, l) => a + Math.min(0, eff(l)), 0), net = vans + oin - oout, susT = openSus.reduce((a, o) => a + o.amount, 0);
    if (__t !== S.nav) return; $('#v').innerHTML = `<div class="kpis">${kpi('From vans (net)', 'AED ' + money(vans), 'cash sales − returns − van payments')}${kpi('Office in', 'AED ' + money(oin), 'receipts')}${kpi('Office out', 'AED ' + money(oout), 'payments and bank deposits')}${kpi('Net cash for the day', 'AED ' + money(net), 'opening is entered by the accountant in the cash sheet' + (susT ? ' · suspense open ' + money(susT) : ''))}</div>
      <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Cash book — ${S.date}</h3>${tools(E ? '<button id="add">Add line</button><button class="p" id="sv">Save day</button>' : '')}</div>
      <div class="tw"><table><tr><th>#</th><th class="l">Type</th><th class="l">Ref</th><th class="l">Particulars</th><th class="l">Narration</th><th>For date</th><th>In</th><th>Out</th>${E ? '<th class="noprint"></th>' : ''}</tr>
        ${lines.map((l,i) => E ? `<tr data-i="${i}"><td>${i+1}</td><td class="l"><select data-k="line_type">${PT.map(([k,lb]) => `<option value="${k}" ${k===l.line_type?'selected':''}>${lb}</option>`).join('')}</select></td>
          <td class="l"><input data-k="ref" value="${esc(l.ref)}" style="width:90px"></td><td class="l"><input data-k="party" value="${esc(l.party)}" list="sus" style="width:180px"></td><td class="l"><input data-k="note" value="${esc(l.note)}" list="nts" style="width:180px"></td>
          <td><input type="date" data-k="for_date" value="${esc(l.for_date)}" ${l.line_type==='DEPOSIT'?'':'disabled'}></td><td colspan="2"><input data-k="amount" value="${l.amount||''}" inputmode="decimal" style="width:110px;text-align:right;font-family:'IBM Plex Mono',monospace;color:${pdir(l.line_type)>0?'#2f7a4f':'#b0432e'}"></td>
          <td class="noprint"><button class="d" data-x="${i}">✕</button></td></tr>`
          : `<tr><td>${i+1}</td><td class="l">${esc(PT.find(x=>x[0]===l.line_type)?.[1]||l.line_type)}</td><td class="l">${esc(l.ref)}</td><td class="l">${esc(l.party)}</td><td class="l">${esc(l.note)}</td><td>${esc(l.for_date)}</td><td>${pdir(l.line_type)>0?money(l.amount):''}</td><td>${pdir(l.line_type)<0?money(l.amount):''}</td></tr>`).join('')}
        <tr class="tot"><td></td><td class="l" colspan="5">Total</td><td>${money(tin)}</td><td>${money(tout)}</td>${E ? '<td class="noprint"></td>' : ''}</tr></table></div>
        <datalist id="sus">${openSus.map(o => `<option value="${esc(o.party)}">`).join('')}</datalist><datalist id="nts"><option value="Food allowance"><option value="Travel allowance"></datalist></div>
      <div class="card"><h3>Open suspense up to ${S.date}</h3>${table([{k:'party',l:'Given to',left:1},{k:'given',l:'First given'},{k:'amount',l:'Open AED',money:1,sum:1}], openSus, { empty:'No open suspense.' })}</div>`;
    if (!E) return bindTools('Petty cash', [['Petty cash', [{k:'line_type',l:'Type'},{k:'ref',l:'Ref'},{k:'party',l:'Particulars'},{k:'note',l:'Narration'},{k:'for_date',l:'For date'},{l:'In',f:l=>pdir(l.line_type)>0?num(l.amount):'',sum:1},{l:'Out',f:l=>pdir(l.line_type)<0?num(l.amount):'',sum:1}], lines]]);
    $('#v').querySelectorAll('tr[data-i]').forEach(tr => tr.onchange = e => { const k = e.target.dataset.k; if (!k) return; lines[+tr.dataset.i][k] = k === 'amount' ? num(e.target.value) : e.target.value; if (k === 'line_type' || k === 'amount') draw(); });
    $('#v').querySelectorAll('[data-x]').forEach(b => b.onclick = () => { lines.splice(+b.dataset.x, 1); draw(); });
    $('#add').onclick = () => { lines.push({ line_type:'PAYMENT', ref:'', party:'', note:'', for_date:'', amount:0 }); draw(); };
    $('#sv').onclick = async () => { const bad = lines.findIndex(l => !l.party.trim() || num(l.amount) <= 0); if (bad > -1) return toast(`Line ${bad+1}: particulars and amount are needed`, false);
      await rpc('save_petty_cash', { p_branch:S.br, p_date:S.date, p_lines:lines.map(l => ({ ...l, for_date:l.line_type === 'DEPOSIT' ? l.for_date : '' })) }); toast('Petty cash saved'); vPetty(); };
    bindTools('Petty cash', [['Petty cash', [{k:'line_type',l:'Type'},{k:'ref',l:'Ref'},{k:'party',l:'Particulars'},{k:'note',l:'Narration'},{k:'for_date',l:'For date'},{l:'In',f:l=>pdir(l.line_type)>0?num(l.amount):'',sum:1},{l:'Out',f:l=>pdir(l.line_type)<0?num(l.amount):'',sum:1}], lines]]);
  };
  draw();
}

async function vStockReport(){ const __t = S.nav;

  const rep = R[0], L = rep ? await q(sb.from('stock_report_lines').select('*').eq('report_id', rep.id).order('id')) : [];
  if (__t !== S.nav) return;
  const brName = S.branches.find(b => b.id === S.br)?.code === 'MGT' ? 'Ajman' : 'Al Quoz', miss = L.filter(l => !l.item_id);
  $('#v').innerHTML = `${canE('sri') ? `<div class="card"><h3>Import stock report — ${brName}</h3>
    <p class="muted">iTrade → Stock Report (Excel). The new report replaces the previous one for ${brName}, and the Cost of every matched item becomes its cost (used for stock count values).</p>
    <div class="row"><input type="file" id="f" accept=".xlsx,.xls"><button class="p" id="go" disabled>Import</button></div><div id="out"></div></div>` : ''}
    <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${rep ? `Stock as on ${esc(rep.as_on)} · ${esc(rep.warehouse)}` : 'No stock report imported yet'}</h3>${tools()}</div>
    ${rep ? `<p class="muted">${L.length} items · qty ${num(rep.total_qty).toLocaleString('en-US')} · value AED ${num(rep.total_value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})} · imported ${esc(new Date(rep.imported_at).toLocaleString('en-GB',{timeZone:'Asia/Dubai'}))} by ${esc(rep.imported_by||'')}${miss.length ? ` · <span class="bad">${miss.length} not in item master</span>` : ''}</p>
    ${table([{l:'Item',left:1,f:r=>r.item_id?iNm(r.item_id):r.item_name,html:r=>r.item_id?esc(iNm(r.item_id)):`<span class="bad">${esc(r.item_name)} (not in item master)</span>`},{k:'item_code',l:'Item code'},{k:'item_no',l:'Item no'},{k:'qty',l:'Qty',sum:1},{l:'Cost',f:r=>r.cost,html:r=>r.cost==null?'':String(+r.cost)},{k:'selling',l:'Selling',money:1},{k:'stock_value',l:'Stock value',money:1,sum:1}], L)}` : ''}</div>`;
  bindTools('Stock report ' + brName + (rep ? ' ' + rep.as_on : ''), [['Stock', [{k:'item_code',l:'Item code'},{k:'item_no',l:'Item no'},{l:'Item',f:r=>r.item_id?iNm(r.item_id):r.item_name},{k:'qty',l:'Qty'},{k:'cost',l:'Cost'},{k:'selling',l:'Selling'},{k:'stock_value',l:'Stock value'}], L]]);
  if (!canE('sri')) return;
  let P = null;
  $('#f').onchange = async e => {
    const file = e.target.files[0]; P = null; $('#go').disabled = true; if (!file) return;
    try {
      const XLSX = await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
      const grid = XLSX.utils.sheet_to_json((wb => wb.Sheets[wb.SheetNames[0]])(XLSX.read(await file.arrayBuffer())), { header:1, defval:'', raw:true });
      const T = v => String(v ?? '').replace(/\s+/g, ' ').trim(), all = grid.flat().map(T);
      const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
      const dm = all.map(v => v.match(/Stock Report as on (\d{1,2})-([A-Za-z]{3})-(\d{4})/i)).find(Boolean);
      const asOn = dm ? `${dm[3]}-${String(MON[dm[2].toLowerCase()]).padStart(2,'0')}-${dm[1].padStart(2,'0')}` : null;
      const wm = all.map(v => v.match(/Current Stock \(([^)]+)\)/i)).find(Boolean), wh = wm ? wm[1].trim() : '';
      const tm = all.map(v => v.match(/^Total:\s*([\d,.\-]+)/)).find(Boolean), fileTotal = tm ? num(tm[1].replace(/,/g,'')) : null;
      const hi = grid.findIndex(r => r.some(v => T(v) === 'Itemcode') && r.some(v => T(v) === 'Cost'));
      if (hi < 0 || !asOn) throw new Error('This is not the iTrade Stock Report (no "Stock Report as on" date or no Itemcode / Cost header).');
      const H = {}; grid[hi].forEach((v, i) => { const k = T(v); if (k && !(k in H)) H[k] = i; });
      const g = (r, k) => H[k] == null ? '' : r[H[k]];
      const nm = v => T(v).toUpperCase(), byCode = {}, byName = {};
      S.items.forEach(i => { [i.barcode, i.itrade_code].forEach(c => { if (c) byCode[T(c)] = i.id; }); byName[nm(i.name)] = i.id; });
      const lines = [];
      for (let i = hi + 1; i < grid.length; i++) { const r = grid[i], code = T(g(r, 'Itemcode'));
        if (!code || /^total/i.test(code) || !T(g(r, 'Item Name'))) continue;
        lines.push({ item_id: byCode[code] || byName[nm(g(r, 'Item Name'))] || null, item_code: code, item_no: T(g(r, 'Item No')), item_name: T(g(r, 'Item Name')),
          qty: num(g(r, 'QTY')), cost: num(g(r, 'Cost')), selling: num(String(g(r, 'Selling')).replace(/,/g,'')), stock_value: num(g(r, 'StockValue')) }); }
      const tot = lines.reduce((a, l) => a + l.stock_value, 0), um = lines.filter(l => !l.item_id);
      const fileBr = /ajman/i.test(wh) ? 'MGT' : /quoz/i.test(wh) ? 'MGAZ' : null, selBr = S.branches.find(b => b.id === S.br)?.code;
      const wrongBr = fileBr && fileBr !== selBr;
      $('#out').innerHTML = `<p>Stock as on <b>${asOn}</b> · ${esc(wh)} · ${lines.length} items · value AED ${tot.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}${fileTotal != null && Math.abs(fileTotal - tot) > 1 ? ` <span class="bad">(file total ${fileTotal.toLocaleString('en-US')})</span>` : ''}</p>
        ${um.length ? `<p class="bad">${um.length} not in item master (imported, but no cost update): ${um.map(l => esc(l.item_no + ' ' + l.item_name)).join(' · ')}</p>` : '<p>All items matched to the item master.</p>'}
        ${wrongBr ? `<p class="bad">This report is for ${fileBr === 'MGT' ? 'Ajman' : 'Al Quoz'}, but the portal is on ${brName}. Switch company first.</p>` : ''}`;
      if (lines.length && !wrongBr) { P = { wh, asOn, lines, file: file.name }; $('#go').disabled = false; }
    } catch (err) { $('#out').innerHTML = `<p class="bad">${esc(err.message || err)}</p>`; }
  };
  $('#go').onclick = async () => { if (!P) return; $('#go').disabled = true;
    try { const r = await rpc('stock_report_save', { p_branch:S.br, p_warehouse:P.wh, p_as_on:P.asOn, p_file:P.file, p_lines:P.lines });
      S.items = await q(sb.from('items').select('*'));
      toast(`Imported ${r.lines} items · ${r.costs_updated} item cost(s) updated`); vStockReport();
    } catch (e) { toast(e.message || String(e), false); $('#go').disabled = false; } };
}

async function vSettings(){
  loading();
  const L = await q(sb.from('app_settings').select('*').order('key'));
  $('#v').innerHTML = `<div class="card"><h3>Rates & device lock</h3><p class="muted">Carton rate = AED charged per empty carton returned (small / big). A new rate is used for returns saved from now on; days already saved keep their amount.</p>
    <div class="tw" style="max-width:560px"><table><tr><th class="l">Setting</th><th>Value</th><th>Last changed</th></tr>${L.map(x => `<tr><td class="l">${esc(x.label || x.key)}</td><td><input type="number" step="0.01" min="0" data-k="${esc(x.key)}" value="${x.value}" style="width:100px"></td><td class="muted">${new Date(x.updated_at).toLocaleString('en-GB',{timeZone:'Asia/Dubai'})}</td></tr>`).join('')}</table></div>
    <div class="row" style="margin-top:8px"><button class="p" id="ssv">Save</button></div></div>
    ${S.me.role === 'ADMIN' ? `<div class="card"><h3>Database backup</h3><p class="muted">Downloads every table of the live database as a zip (one JSON file per table). A copy is also saved every night at 02:30 to the Google Drive folder "Mahrjan Backup".</p><div class="row"><button class="p" id="bkp">Download database backup</button><span id="bkps" class="muted"></span></div></div>` : ''}`;
  $('#bkp') && ($('#bkp').onclick = async () => { const b = $('#bkp'), s = $('#bkps'); b.disabled = true;
    try { const T = await rpc('backup_tables'), files = [], info = [];
      for (let i = 0; i < T.length; i++) { const rows = [];
        for (let off = 0; ; off += 5000) { s.textContent = ` ${Math.round(i * 100 / T.length)}% · ${T[i]} ${rows.length}`; const p = await rpc('backup_table', { p_table:T[i], p_offset:off, p_limit:5000 }); rows.push(...p); if (p.length < 5000) break; }
        files.push({ name:T[i] + '.json', text:JSON.stringify(rows) }); info.push(T[i] + '\t' + rows.length); }
      try { files.push({ name:'_schema.sql', text:await rpc('backup_schema') }); } catch (e) { info.push('(structure not saved: ' + (e.message || e) + ')'); }
      const stamp = new Date(Date.now() + 240*60000).toISOString().slice(0,16).replace('T',' ').replace(':','');
      files.unshift({ name:'_README.txt', text:`MAHRJAN SYSTEM - DATABASE BACKUP\r\nTaken ${stamp} (Dubai) by ${S.me.name}\r\nOne JSON file per table (array of rows). Restore order and steps: see HANDOVER document, section Backup and restore.\r\n\r\nTable\tRows\r\n${info.join('\r\n')}\r\n` });
      const a = document.createElement('a'); a.href = URL.createObjectURL(makeZip(files)); a.download = `MAHRJAN DB BACKUP ${stamp}.zip`; document.body.append(a); a.click(); a.remove();
      s.textContent = ` 100% · ${T.length} tables`; toast('Backup downloaded'); } catch (e) { s.textContent = ''; toast(e.message || String(e), false); } finally { b.disabled = false; } });
  $('#ssv').onclick = async () => { try { for (const i of $('#v').querySelectorAll('[data-k]')) { const v = Number(i.value); if (!(v >= 0)) return toast('Enter a valid rate', false); if (i.dataset.k === 'DEVICE_LOCK' && ![0,1,2].includes(v)) return toast('Device lock must be 0, 1 or 2', false);
      const x = L.find(y => y.key === i.dataset.k); if (Number(x.value) !== v) await q(sb.from('app_settings').update({ value:v, updated_at:new Date().toISOString() }).eq('key', i.dataset.k)); }
    toast('Saved'); vSettings(); } catch (e) { toast(e.message || String(e), false); } };
}

// ---------- REQUIREMENT ----------
async function vRequirement(){ const __t = S.nav;
  const isSm = S.me.role === 'SALESMAN';
  S.rsm = isSm ? S.me.id : S.rsm; S.rdate = S.rdate || today(1);
  if (__t !== S.nav) return; $('#v').innerHTML = `<div class="card"><h3>Requirement</h3><div class="row">
    ${isSm ? '' : `<label>Salesman<select id="sm"><option value="">Select</option>${smOptions(S.rsm)}</select></label>`}
    <label>For date<input type="date" id="rd" value="${S.rdate}"></label></div><div id="g"></div></div>`;
  $('#sm') && ($('#sm').onchange = e => { S.rsm = +e.target.value || null; fill(); });
  $('#rd').onchange = e => { S.rdate = e.target.value; fill(); };
  async function fill(){
    if (!S.rsm) { $('#g').innerHTML=''; return; }
    const req = await q(sb.from('requirement_lines').select('item_id,qty_cartons').eq('salesman_id', S.rsm).eq('required_date', S.rdate));
    $('#g').innerHTML = `<div class="tw"><table><tr><th class="l">Item</th><th>Qty</th></tr>${sellItems().map(it => `<tr data-id="${it.id}"><td class="l">${esc(it.short_name||it.name)}</td>
      <td><input type="number" min="0" step="0.5" value="${req.find(r=>r.item_id===it.id)?.qty_cartons ?? ''}"></td></tr>`).join('')}</table></div>
      <div class="row" style="margin-top:8px"><button class="p" id="sv">Save requirement</button></div>`;
    $('#sv').onclick = async () => {
      const ln = [...$('#g').querySelectorAll('tr[data-id]')].map(tr => ({ item_id:+tr.dataset.id, qty_cartons:num($('input',tr).value) })).filter(x=>x.qty_cartons>0);
      await rpc('save_requirement', { p_salesman:S.rsm, p_date:S.rdate, p_lines:ln }); toast('Requirement saved');
    };
  }
  await fill();
}
