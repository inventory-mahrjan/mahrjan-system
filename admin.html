<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahrjan Sales Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f6f4;--surface:#fff;--ink:#1b1f1e;--muted:#6b7370;--line:#e7e8e4;--line2:#d8dad5;--accent:#0f5f57;--accent-ink:#0c363b;--soft:#eef3f1;--neg:#b0432e;--amb:#a8650f;
    font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box} body{margin:0}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em} h1{font-size:26px} h3{font-size:15px;margin:0 0 12px}
  button,input,select{font:inherit;font-size:13.5px}
  button{cursor:pointer;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 13px;font-weight:500;line-height:1.2;white-space:nowrap}
  button:hover{background:#f2f3f0} button:disabled{opacity:.45;cursor:default}
  button.p{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff} button.p:hover{background:#15474d}
  button.d{color:var(--neg);border-color:var(--neg)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input,select{min-width:0;height:36px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--ink)}
  input[type=number]{width:84px;text-align:center;font-family:'IBM Plex Mono',monospace}
  input[type=file]{height:auto;padding:7px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
  .row label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
  /* shell */
  .sidebar{width:232px;position:fixed;inset:0 auto 0 0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 18px;overflow:auto}
  .brand{display:flex;flex-direction:column;gap:8px;padding:0 8px 10px;font-weight:600;font-size:15px}
  .brandlogo{height:46px;width:auto;max-width:100%;border-radius:7px;display:block;align-self:flex-start;object-fit:contain}
  .brand small{display:block;font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:.02em;margin-top:2px}
  nav{display:flex;flex-direction:column;gap:1px}
  .navlabel{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:16px 10px 6px}
  nav button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;color:#3c4442;font-weight:400;width:100%}
  nav button:hover{background:#f3f4f1} nav button.on{background:var(--soft);color:var(--accent-ink);font-weight:600}
  .sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:flex;flex-direction:column;gap:10px}
  .who{display:flex;flex-direction:column;gap:2px;font-size:13px} .who span{color:var(--muted);font-size:12px}
  main{margin-left:232px;padding:32px 40px 40px;max-width:1500px;display:flex;flex-direction:column;gap:20px}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .top label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
  #v{display:flex;flex-direction:column;gap:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
  /* tables: light green heading row, thin lines, numbers centred */
  .tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{position:sticky;top:0;background:#e8f3ee;font-weight:500;color:var(--accent-ink);font-size:12px;border-bottom:1px solid var(--line2);padding:9px 12px;white-space:nowrap;text-align:center}
  td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums}
  th+th,td+td{border-left:1px solid var(--line)}
  td.l,th.l{text-align:left}
  tbody tr:hover td,tr:hover td{background:#fafbf9}
  .st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:#eef0ec;color:#3c4442}
  .st.LOADED{background:#e6eef8;color:#1f4f86}.st.RETURNED{background:#fbf0de;color:var(--amb)}.st.SETTLED{background:#efe8f6;color:#5b3c86}.st.CLOSED{background:var(--soft);color:var(--accent-ink)}
  .bad{color:var(--neg);font-weight:600} tr.tot td{font-weight:700;background:#f4f7f2}.warn{color:var(--amb);font-size:12px}
  .muted{color:var(--muted);font-size:12.5px}
  .msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:8px;color:#fff;z-index:9;max-width:90%;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .msg.ok{background:var(--accent-ink)}.msg.er{background:var(--neg)}
  /* login */
  .login-wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
  .login-side{background:var(--accent-ink);color:#fff;padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
  .login-side .brandlogo{height:72px;border-radius:10px}
  .login-side .brand small{color:#9fbdb9}
  .login-side h2{font-size:30px;font-weight:500;line-height:1.25;max-width:440px}
  .login-side p{color:#c3d6d3;font-size:14px;max-width:400px;line-height:1.6;margin-top:14px}
  .login-side>small{color:#9fbdb9;font-size:12px}
  .login-main{display:grid;place-items:center;padding:40px}
  .login-card{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
  .login-card h1{font-size:24px} .login-card .lead{color:var(--muted);font-size:14px;margin:-8px 0 12px}
  .login-card label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
  .login-card input,.login-card button{height:40px;width:100%}
  @media (max-width:900px){
    .sidebar{position:static;width:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}
    nav{flex-direction:row;flex-wrap:wrap}.navlabel{display:none}nav button{width:auto}
    .sidebar-bottom{flex-direction:row;flex-wrap:wrap;align-items:center}
    main{margin:0;padding:16px}.login-wrap{grid-template-columns:1fr}.login-side{display:none}
  }
  main>header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .eyebrow{font-size:11.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  #subtitle{color:var(--muted);margin-top:6px;font-size:14px}
  .header-actions{display:flex;gap:8px;align-items:flex-end}
  .header-actions label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
  .card>h3,.card .row>h3{font-size:15px;margin:0 0 16px}
  .card>.muted:first-of-type{margin-top:-10px}
  footer{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);padding-top:8px}
  .notice{font-size:13px;color:#5f5233;background:#faf6ea;border:1px solid #efe5c8;border-radius:8px;padding:10px 14px;line-height:1.5}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
  .kpi span{font-size:11.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.kpi b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}.kpi small{color:var(--muted);font-size:12px}
  .sheet-head{display:flex;justify-content:space-between;border-bottom:2px solid var(--accent-ink);padding-bottom:6px;margin-bottom:8px;font-size:14px}
  .signs{display:flex;justify-content:space-between;gap:20px;margin-top:46px}.signs span{flex:1;border-top:1px solid var(--ink);padding-top:6px;text-align:center;font-size:12px;color:var(--muted)}
  @media print{ @page{size:A4;margin:10mm} body{background:#fff} .sidebar,.header-actions,.noprint,footer,.msg,#xl,#pr{display:none!important}
    main{margin:0;padding:0;max-width:none;gap:10px} .card{border:0;padding:0} .sheet{break-after:page} .tw{overflow:visible;border:0;max-height:none!important}
    table{font-size:10.5px} th,td{padding:4px 6px} th{position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact} input,select{border:0;padding:0} }
  .link-btn{border:0;background:none;color:var(--muted);padding:0;text-decoration:underline;text-underline-offset:2px;font-size:13px}
</style>
</head>

function toast(t, ok=true){ const m=document.createElement('div'); m.className='msg '+(ok?'ok':'er'); m.textContent=t; document.body.appendChild(m); setTimeout(()=>m.remove(), ok?2500:6000); }
async function q(p){ const { data, error } = await p; if (error) { toast(error.message, false); throw error; } return data; }
const rpc = (fn, args) => q(sb.rpc(fn, args));

async function loadAccess(){ const { data, error } = await sb.from('role_access').select('module,can_view,can_edit').eq('role', S.me.role);
  S.acc = error || !data?.length ? null : Object.fromEntries(data.map(a => [a.module, a])); }
const canE = m => S.me?.role === 'ADMIN' || (S.acc ? !!S.acc[m]?.can_edit : (ACC_DEF.E[S.me?.role] || '').split(' ').includes(m));

const item = id => S.items.find(i => i.id === id) || {};
const per = it => it.item_type === 'RAW_EGG' ? (it.pcs_per_carton || 1) : (it.packs_per_carton || 1);
const unit = it => it.item_type === 'FG' ? 'pk' : 'pcs';
function split(it, qty){ const p=per(it); qty=num(qty); return { c: Math.floor(qty/p), r: +(qty - Math.floor(qty/p)*p).toFixed(2) }; }
function showQty(it, qty){ qty=num(qty); if(!qty) return ''; if(per(it)<=1) return qty+' '+unit(it); const s=split(it,qty); return (s.c? s.c+' ctn ':'') + (s.r? s.r+' '+unit(it):''); }

function renderLogin(){
  $('#app').innerHTML = `<div class="login-wrap">
    <div class="login-side"><div class="brand"><img class="brandlogo" src="${LOGO}" alt="Mahrjan"><div>MAHRJAN<small style="font-weight:600;letter-spacing:.06em">SALES PORTAL</small></div></div>

      <small>For Mahrjan staff only.</small></div>
    <div class="login-main"><div class="login-card"><h1>Sign in to the Sales Portal</h1><div class="lead">Use the account your administrator created for you.</div>
      <label>Username<input id="u" name="mj-user" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
      <label>Password<input id="pw" name="mj-pass" type="password" autocomplete="new-password"></label>
      <button class="p" id="go">Sign in</button></div></div></div>`;
  const go = async () => {
    const u = $('#u').value.trim().toLowerCase(); if (!u) return;
    const { error } = await sb.auth.signInWithPassword({ email: u.includes('@') ? u : u + EMAIL_DOMAIN, password: $('#pw').value.trim() });
    if (error) return toast('Login failed: ' + error.message, false);
    boot();
  };
  $('#go').onclick = go; $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function boot(){
  S.me = await rpc('me');
  if (!S.me || !S.me.role) { toast('This login is not linked to an active staff member', false); await sb.auth.signOut(); return; }
  const [items, staff, vans, branches] = await Promise.all([
    q(sb.from('items').select('*')), q(sb.from('staff').select('id,name,role,branch_id,active').order('name')),
    q(sb.from('vans').select('*').eq('active', true).order('van_no')), q(sb.from('branches').select('*'))]);
  Object.assign(S, { items, staff, vans, branches });
  await loadAccess();
  S.br = S.me.branch_id || (+localStorage.getItem('mj_branch') || null) || branches.find(b => b.code === 'MGAZ')?.id;
  S.from = S.date.slice(0,8) + '01';
  const tabs = tabsFor(); S.tab = tabs[0][0];
  render();
}

function tabsFor(){
  const t = [], G = (g, ...x) => x.forEach(([k,l]) => { if (canV(k)) t.push([k,l,g]); });
  G('Summary', ['ov','Overview'], ['dd','Daily dashboard']);
  G('Daily flow', ['load','Loading'], ['ret','Return'], ['days','Van days'], ['wh','Warehouse'], ['ite','I Trade entry'], ['sc','Stock count'], ['imp','Sales import'], ['req','Requirement']);
  G('Reports', ['ds','Daily sheets'], ['pc','Petty cash'], ['se','Short & excess'], ['wo','FOC & write-offs'], ['qs','Qty by salesman']);
  G('Analysis', ['sa','Sales analysis'], ['lr','Loading & return'], ['vl','Van log'], ['co','Collections'], ['ex','Expenses']);
  if (has('ADMIN')) t.push(['stf','Staff & access','Admin'], ['acc','Role access','Admin']);
  G('Admin', ['dc','Data check']);
  if (!t.length) t.push(['none','No access','']);
  return t;
}

  $('#out').onclick = () => sb.auth.signOut();
  $('#brs') && ($('#brs').onchange = e => { S.br = +e.target.value; localStorage.setItem('mj_branch', S.br); S.dayId = null; S.lsm = null; S.rsm = null; render(); });
  $('#dt').onchange = e => { S.date = e.target.value; if (S.from > S.date) { S.from = S.date; if ($('#df')) $('#df').value = S.date; } S.dayId = null; view(); };
  $('#df') && ($('#df').onchange = e => { S.from = e.target.value; if (S.from > S.date) { S.date = S.from; $('#dt').value = S.from; } view(); });
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.dayId = null; render(); });
  view();
}
function view(){ clearCache(); ({ load:vLoading, ret:vReturn, days:vDays, imp:vImport, req:vRequirement, wh:vWarehouse, ite:vItrade, sc:vStock, ov:vOverview, dd:vDash, ds:vSheets, pc:vPetty, se:vShort, wo:vWriteoff, qs:vQty, sa:vAnalysis, lr:vLoadRet, vl:vVanLog, co:vCollections, ex:vExpenses, stf:vStaff, dc:vCheck, acc:vAccess, none:() => $('#v').innerHTML = '<div class="card"><p class="muted">Your role has no pages yet. Ask the admin to give access in Role access.</p></div>' })[S.tab](); }

const salesmen = () => S.staff.filter(s => s.role === 'SALESMAN' && s.active && s.branch_id === S.br);
const smOptions = sel => salesmen().map(s => `<option value="${s.id}" ${s.id==sel?'selected':''}>${esc(s.name)}</option>`).join('');

// ---------- quantity grid (cartons + loose) ----------
function qtyGrid(rows){   // rows: [{it, qty, hint}]
  return `<div class="tw"><table><tr><th class="l">Item</th><th>Ctn</th><th>Loose</th><th>Total</th><th class="muted">Ref</th></tr>
    ${rows.map(({it,qty,hint}) => { const s = split(it, qty); return `<tr data-id="${it.id}">
      <td class="l">${esc(it.short_name || it.name)}</td>
      <td><input type="number" min="0" step="1" class="c" value="${s.c||''}"></td>
      <td><input type="number" min="0" step="1" class="r" value="${s.r||''}"></td>
      <td class="tot">${showQty(it, qty)}</td><td class="muted">${esc(hint||'')}</td></tr>`; }).join('')}</table></div>`;
}
function bindGrid(root){
  root.querySelectorAll('tr[data-id]').forEach(tr => tr.oninput = () => {
    const it = item(+tr.dataset.id); tr.querySelector('.tot').textContent = showQty(it, num($('.c',tr).value)*per(it) + num($('.r',tr).value));
  });
}
const gridValue = tr => { const it=item(+tr.dataset.id); return num($('.c',tr).value)*per(it) + num($('.r',tr).value); };

// ---------- LOADING ----------
async function vLoading(){
  const v = $('#v');
  v.innerHTML = `<div class="card"><h3>Loading (board) — ${S.date}</h3>
    <div class="row"><label>Salesman<select id="sm"><option value="">Select</option>${smOptions(S.lsm)}</select></label>
      <label>Van (plate no.)<select id="van"><option value="">Select van</option>${S.vans.filter(x => x.branch_id === S.br).map(x=>`<option value="${x.id}">${esc(x.van_no)}</option>`).join('')}</select></label>
      <label>Start KM<input type="number" id="km" style="width:110px"></label>
      <label>Load temp<input type="number" id="tp" step="0.1"></label></div><div id="g"></div></div>`;
  $('#sm').onchange = async e => { S.lsm = +e.target.value || null; await fill(); };
  async function fill(){
    if (!S.lsm) { $('#g').innerHTML = ''; return; }
    const day = (await q(sb.from('van_day').select('*').eq('salesman_id', S.lsm).eq('business_date', S.date)))[0];
    const lines = day ? await q(sb.from('loading_lines').select('item_id,qty').eq('van_day_id', day.id)) : [];
    const req = await q(sb.from('requirement_lines').select('item_id,qty_cartons').eq('salesman_id', S.lsm).eq('required_date', S.date));
    if (day) { $('#van').value = day.van_id || ''; $('#km').value = day.start_km ?? ''; $('#tp').value = day.load_temp ?? ''; }
    else { const [prev] = await q(sb.from('van_day').select('van_id,end_km').eq('salesman_id', S.lsm).lt('business_date', S.date).not('van_id', 'is', null).order('business_date', { ascending:false }).limit(1));
      $('#van').value = prev?.van_id || ''; $('#km').value = prev?.end_km ?? ''; }   // his last van and its last KM
    const locked = day && !['OPEN','LOADED'].includes(day.status);
    const rows = sellItems().map(it => {
      const l = lines.find(x => x.item_id === it.id), r = req.find(x => x.item_id === it.id);
      return { it, qty: l ? l.qty : (r && !day ? r.qty_cartons * per(it) : 0), hint: r ? 'Req ' + r.qty_cartons + ' ctn' : '' };
    });
    $('#g').innerHTML = (day ? `<p class="muted">Status <span class="st ${day.status}">${day.status}</span>${locked ? ' — loading is locked after return' : ''}</p>` : '')
      + qtyGrid(rows) + `<div class="row" style="margin-top:8px"><button class="p" id="post" ${locked?'disabled':''}>Post loading</button></div>`;
    bindGrid($('#g'));
    $('#post') && ($('#post').onclick = async () => {
      const ln = [...$('#g').querySelectorAll('tr[data-id]')].map(tr => ({ item_id:+tr.dataset.id, qty:gridValue(tr) })).filter(x => x.qty > 0);
      if (!ln.length) return toast('Enter at least one item', false);
      $('#post').disabled = true;
      try { await rpc('post_loading', { p_salesman:S.lsm, p_date:S.date, p_van:+$('#van').value||null, p_start_km:+$('#km').value||null, p_load_temp:$('#tp').value===''?null:+$('#tp').value, p_lines:ln });
            toast('Loading posted'); await fill(); } finally { $('#post') && ($('#post').disabled = false); }
    });
  }
  if (S.lsm) await fill();
}

// ---------- RETURN ----------
async function vReturn(){
  const days = await q(sb.from('van_day').select('id,salesman_id,status').eq('business_date', S.date).eq('branch_id', S.br).in('status',['LOADED','RETURNED']));
  const v = $('#v');
  v.innerHTML = `<div class="card"><h3>Return — ${S.date}</h3>
    <div class="row"><label>Salesman<select id="d"><option value="">Select</option>${days.map(d=>`<option value="${d.id}">${esc(S.staff.find(s=>s.id===d.salesman_id)?.name)} (${d.status})</option>`).join('')}</select></label></div>
    <div id="g"></div></div>`;
  $('#d').onchange = e => fill(+e.target.value);
  async function fill(id){
    if (!id) { $('#g').innerHTML=''; return; }
    const day = (await q(sb.from('van_day').select('*').eq('id', id)))[0];
    const [rec, ret] = await Promise.all([q(sb.from('v_van_day_items').select('*').eq('van_day_id', id)), q(sb.from('return_lines').select('*').eq('van_day_id', id))]);
    const ids = [...new Set([...rec.map(r=>r.item_id), ...ret.map(r=>r.item_id)])];
    const its = sellItems().filter(i => ids.includes(i.id));
    const F = ['good','damage','expiry','waste','foc'];
    $('#g').innerHTML = `<div class="row"><label>End KM<input type="number" id="km" style="width:110px" value="${day.end_km??''}"></label>
      <label>Unload temp<input type="number" id="tp" step="0.1" value="${day.unload_temp??''}"></label>
      <label>Carton small<input type="number" id="cs" value="${day.carton_small||''}"></label>
      <label>Carton big<input type="number" id="cb" value="${day.carton_big||''}"></label></div>
      <p class="muted">Quantities in packs (raw egg in pieces). Expected = load − sale + GRV (sales imported so far).</p>
      <div class="tw"><table><tr><th class="l">Item</th><th>Load</th><th>Expected</th>${F.map(f=>`<th>${f}</th>`).join('')}<th>Total</th><th>Diff</th></tr>
      ${its.map(it => { const r = rec.find(x=>x.item_id===it.id)||{}, t = ret.find(x=>x.item_id===it.id)||{};
        return `<tr data-id="${it.id}" data-exp="${num(r.expected_return)}"><td class="l">${esc(it.short_name||it.name)}</td><td>${num(r.load)}</td><td>${num(r.expected_return)}</td>
        ${F.map(f=>`<td><input type="number" min="0" class="${f}" value="${num(t[f])||''}"></td>`).join('')}<td class="tot"></td><td class="df"></td></tr>`; }).join('')}
      </table></div><div class="row" style="margin-top:8px"><button class="p" id="post">Post return</button></div>`;
    const calc = tr => { const tot = F.reduce((a,f)=>a+num($('.'+f,tr).value),0), df = tot - num(tr.dataset.exp);
      tr.querySelector('.tot').textContent = tot; const c = tr.querySelector('.df'); c.textContent = df ? (df>0?'+':'')+df : ''; c.className = 'df ' + (df ? 'bad' : ''); };
    $('#g').querySelectorAll('tr[data-id]').forEach(tr => { calc(tr); tr.oninput = () => calc(tr); });
    $('#post').onclick = async () => {
      const ln = [...$('#g').querySelectorAll('tr[data-id]')].map(tr => Object.fromEntries([['item_id',+tr.dataset.id], ...F.map(f=>[f, num($('.'+f,tr).value)])]));
      $('#post').disabled = true;
      try { await rpc('post_return', { p_van_day:id, p_end_km:+$('#km').value||null, p_unload_temp:$('#tp').value===''?null:+$('#tp').value,
              p_carton_small:+$('#cs').value||0, p_carton_big:+$('#cb').value||0, p_lines:ln }); toast('Return posted'); await fill(id); }
      finally { $('#post') && ($('#post').disabled = false); }
    };
  }
}

    <tr><th class="l">Salesman</th><th>Van</th><th>Status</th><th>Cash sales</th><th>Credit sales</th><th>Cash to hand over</th><th>Counted</th><th></th></tr>
    ${days.map(d => { const c = cash.find(x=>x.van_day_id===d.id)||{}; const exp = d.cash_expected ?? c.cash_to_hand_over;
      return `<tr><td class="l">${esc(S.staff.find(s=>s.id===d.salesman_id)?.name)}</td><td>${esc(S.vans.find(v=>v.id===d.van_id)?.van_no||'')}</td>

async function vDay(id){
  const [day] = await q(sb.from('van_day').select('*').eq('id', id));
  const closed = day.status === 'CLOSED';
  const [rec, cash, exps, cols] = await Promise.all([
    closed ? q(sb.from('day_close_items').select('*').eq('van_day_id', id)) : q(sb.from('v_van_day_items').select('*').eq('van_day_id', id)),
    q(sb.from('v_van_day_cash').select('*').eq('van_day_id', id)).then(r=>r[0]||{}),
    q(sb.from('expenses').select('*').eq('van_day_id', id)), q(sb.from('collections').select('*').eq('van_day_id', id))]);
  if (!S.customers.length) S.customers = await q(sb.from('customers').select('id,itrade_code,name').eq('active', true).order('name'));
  const editMoney = ['OPEN','LOADED','RETURNED'].includes(day.status) && canE('days');
  const exp = day.cash_expected ?? cash.cash_to_hand_over;
  const sm = S.staff.find(s=>s.id===day.salesman_id)?.name;
  const ET = ['FUEL','PARKING','CARTON BIG','CARTON SMALL','SHELF RENT','CREDIT NOTE','OTHER'];
  const custOpts = `<datalist id="cl">${S.customers.map(c=>`<option value="${esc((c.itrade_code||'')+' | '+c.name)}">`).join('')}</datalist>`;
  const custVal = cid => { const c = S.customers.find(x=>x.id===cid); return c ? (c.itrade_code||'')+' | '+c.name : ''; };
  const custId = v => S.customers.find(c => (c.itrade_code||'')+' | '+c.name === v)?.id || null;

  $('#v').innerHTML = `<div class="card"><div class="row"><button id="bk">← Back</button><h3 style="margin:0">${esc(sm)} — ${day.business_date}
      <span class="st ${day.status}">${day.status}</span></h3></div>
    <p class="muted">KM ${day.start_km??'-'} → ${day.end_km??'-'} · Temp ${day.load_temp??'-'} / ${day.unload_temp??'-'} · Cartons small ${day.carton_small||0}, big ${day.carton_big||0}</p></div>

    <div class="card"><h3>Item reconciliation ${closed?'(frozen at close)':'(live)'}</h3><div class="tw"><table>
      <tr><th class="l">Item</th><th>Load</th><th>Sale</th><th>GRV</th><th>Good</th><th>Dmg</th><th>Exp</th><th>Wst</th><th>FOC</th><th>Return</th><th>Expected</th><th>Excess</th><th>Short</th><th class="l">Reason</th></tr>
      ${rec.sort((a,b)=>(item(a.item_id).display_order||0)-(item(b.item_id).display_order||0)).map(r => { const need = num(r.excess)||num(r.short)||r.flag;
        return `<tr data-i="${r.item_id}"><td class="l">${esc(item(r.item_id).short_name||item(r.item_id).name)}${r.flag?` <span class="warn">${r.flag.replace(/_/g,' ').toLowerCase()}</span>`:''}</td>
        <td>${num(r.load)}</td><td>${num(r.sale)}</td><td>${num(r.grv)}</td><td>${num(r.good)}</td><td>${num(r.damage)}</td><td>${num(r.expiry)}</td><td>${num(r.waste)}</td><td>${num(r.foc)}</td>
        <td>${num(r.total_return)}</td><td>${num(r.expected_return)}</td><td class="${num(r.excess)?'bad':''}">${num(r.excess)||''}</td><td class="${num(r.short)?'bad':''}">${num(r.short)||''}</td>
        <td class="l">${closed ? esc(r.reason||'') : (need && day.status==='SETTLED' ? '<input class="rs" placeholder="Reason required" style="width:100%">' : '')}</td></tr>`; }).join('')}
    </table></div></div>

    <div class="card"><h3>Cash</h3><div class="tw"><table><tr><th>Cash sales</th><th>Cash returns</th><th>Collections</th><th>Expenses</th><th>Cash to hand over</th><th>Counted</th><th>Difference</th></tr>
      <tr><td>${money(cash.cash_sales)}</td><td>${money(cash.cash_returns)}</td><td>${money(cash.collections)}</td><td>${money(cash.expenses)}</td><td><b>${money(exp)}</b></td>
      <td>${day.cash_counted!=null?money(day.cash_counted):''}</td><td class="bad">${day.cash_counted!=null&&Math.abs(day.cash_counted-exp)>0.009?money(day.cash_counted-exp):''}</td></tr></table></div></div>

    <div class="card"><h3>Expenses</h3>${custOpts}<div id="ex"></div>${editMoney?'<div class="row" style="margin-top:6px"><button id="exa">+ Add</button><button class="p" id="exs">Save expenses</button></div>':''}</div>
    <div class="card"><h3>Collections</h3><div id="co"></div>${editMoney?'<div class="row" style="margin-top:6px"><button id="coa">+ Add</button><button class="p" id="cos">Save collections</button></div>':''}</div>

    <div class="card"><div class="row">
      ${day.status==='RETURNED' && canE('settle') ? `<label>Cash counted<input type="number" step="0.01" id="cc" style="width:120px"></label><button class="p" id="settle">Settle cash</button>` : ''}
      ${day.status==='SETTLED' && canE('close') ? `<button class="p" id="close">Close day</button>` : ''}
      ${['SETTLED','CLOSED'].includes(day.status) && canE('reopen') ? `<input id="rr" placeholder="Reason to reopen" style="min-width:220px"><button class="d" id="reopen">Reopen</button>` : ''}
    </div></div>`;

  const exRow = e => `<div class="row er"><select class="t" ${editMoney?'':'disabled'}>${ET.map(t=>`<option ${t===e.expense_type?'selected':''}>${t}</option>`).join('')}</select>
      <input type="number" step="0.01" class="a" value="${e.amount??''}" ${editMoney?'':'disabled'} style="width:100px">
      <input class="c" list="cl" placeholder="Customer (shelf rent / credit note)" value="${esc(custVal(e.customer_id))}" ${editMoney?'':'disabled'} style="min-width:240px">
      <input class="n" placeholder="Note" value="${esc(e.note||'')}" ${editMoney?'':'disabled'}></div>`;
  const coRow = c => `<div class="row cr"><input class="r" placeholder="Receipt no" value="${esc(c.receipt_no||'')}" ${editMoney?'':'disabled'} style="width:110px">
      <input class="i" placeholder="Invoice no" value="${esc(c.invoice_no||'')}" ${editMoney?'':'disabled'} style="width:150px">
      <input class="c" list="cl" placeholder="Customer" value="${esc(custVal(c.customer_id))}" ${editMoney?'':'disabled'} style="min-width:240px">
      <select class="m" ${editMoney?'':'disabled'}>${['CASH','CHEQUE','TRANSFER'].map(m=>`<option ${m===c.mode?'selected':''}>${m}</option>`).join('')}</select>
      <input type="number" step="0.01" class="a" value="${c.amount??''}" ${editMoney?'':'disabled'} style="width:100px"></div>`;
  $('#ex').innerHTML = exps.map(exRow).join('') || (editMoney ? '' : '<p class="muted">None</p>');
  $('#co').innerHTML = cols.map(coRow).join('') || (editMoney ? '' : '<p class="muted">None</p>');
  $('#bk').onclick = () => { S.dayId = null; vDays(); };
  if (editMoney) {
    $('#exa').onclick = () => $('#ex').insertAdjacentHTML('beforeend', exRow({expense_type:'FUEL'}));
    $('#coa').onclick = () => $('#co').insertAdjacentHTML('beforeend', coRow({mode:'CASH'}));
    $('#exs').onclick = async () => {
      const ln = [...$('#ex').querySelectorAll('.er')].map(r => ({ expense_type:$('.t',r).value, amount:num($('.a',r).value), customer_id:custId($('.c',r).value), note:$('.n',r).value }));
      await rpc('save_expenses', { p_van_day:id, p_lines:ln }); toast('Expenses saved'); vDay(id);
    };
    $('#cos').onclick = async () => {
      const ln = [...$('#co').querySelectorAll('.cr')].map(r => ({ receipt_no:$('.r',r).value, invoice_no:$('.i',r).value, customer_id:custId($('.c',r).value), mode:$('.m',r).value, amount:num($('.a',r).value) }));
      if (ln.some(l => l.amount && (!l.receipt_no || !l.customer_id))) return toast('Each collection needs receipt no and a customer from the list', false);
      await rpc('save_collections', { p_van_day:id, p_lines:ln }); toast('Collections saved'); vDay(id);
    };
  }
  $('#settle') && ($('#settle').onclick = async () => {
    if ($('#cc').value === '') return toast('Enter cash counted', false);
    const r = await rpc('settle_day', { p_van_day:id, p_cash_counted:num($('#cc').value) });
    toast('Settled. Difference ' + money(r.difference), Math.abs(r.difference) < 0.01); vDay(id);
  });
  $('#close') && ($('#close').onclick = async () => {
    const reasons = Object.fromEntries([...$('#v').querySelectorAll('tr[data-i]')].filter(tr=>$('.rs',tr)).map(tr => [tr.dataset.i, $('.rs',tr).value.trim()]));
    await rpc('close_day', { p_van_day:id, p_reasons:reasons }); toast('Day closed'); vDay(id);
  });
  $('#reopen') && ($('#reopen').onclick = async () => {
    if (!$('#rr').value.trim()) return toast('Enter the reason to reopen', false);
    await rpc('reopen_day', { p_van_day:id, p_reason:$('#rr').value.trim() }); toast('Reopened'); vDay(id);
  });
}

// ---------- SALES IMPORT ----------
async function vImport(){
  $('#v').innerHTML = `<div class="card"><h3>Sales import (iTrade Periodical Sales Detailed Report)</h3>
    <p class="muted">Export the report from iTrade for the dates you want (Excel or CSV) and choose the file. Each branch (MGAZ / MGT) is imported separately.
    Invoices already imported are skipped. Invoices missing from the file for its dates are marked cancelled.</p>
    <div class="row"><input type="file" id="f" accept=".xlsx,.xls,.csv"><button class="p" id="go" disabled>Import</button></div><div id="out"></div></div>`;
  let rows = [];
  $('#f').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    const XLSX = await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates:true });
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'', raw:true });
    const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    const iso = v => { if (v instanceof Date) return new Date(v.getTime() - v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
      const s = String(v).trim(); let m;
      if ((m = s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[-\/ ](\d{4})/))) return `${m[3]}-${String(MON[m[2].toLowerCase()]).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
      if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
      if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0]; return null; };
    rows = raw.map(r => Object.fromEntries(Object.entries(r).map(([k,v]) => [k.trim(), v])))
      .filter(r => r['Invoice No'] && r['Item Code'])
      .map(r => ({ ...r, 'Tran Date': iso(r['Tran Date']), 'Item Code': String(r['Item Code']).trim(), 'Head No': String(r['Head No']||'').trim(),
                   ...Object.fromEntries(['Qty','Rate','Gross','Disc','Net','VAT','Net Incl VAT','Profit','CF'].map(k => [k, num(r[k])])) }));
    const bad = rows.filter(r => !r['Tran Date']).length;
    const by = branchSplit(rows);
    $('#out').innerHTML = `<p>${rows.length} lines read${bad?` — <span class="bad">${bad} with unreadable date</span>`:''}. ${Object.entries(by).map(([b,r])=>`${b}: ${r.length}`).join(' · ')}</p>`;
    $('#go').disabled = !rows.length || bad > 0;
  };
  const branchSplit = rs => rs.reduce((a,r) => { const b = String(r['Invoice No']).split('-')[0].toUpperCase(); (a[b] ||= []).push(r); return a; }, {});
  $('#go').onclick = async () => {

// ---------- I TRADE ENTRY (what to post in iTrade for the day: production, unwrap, broken, wastage) ----------
// ---------- iTrade Store Issue files (same as the old portal): one .txt per salesman, all in one zip ----------
// Line: SITE,BARCODE,,QTY (CRLF).  LOADING = issue to van: boarded qty less what the store billed for him that day;
// raw egg = only what he billed himself.  RETURN = issue from van: good + damage + expiry + waste + FOC; raw egg = his own sales return.
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(files){   // [{name, text}] -> Blob (stored, no compression)
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const le = (n, b) => { const a = new Uint8Array(b); for (let i = 0; i < b; i++) a[i] = (n >>> (8*i)) & 255; return a; };
  files.forEach(f => { const nm = enc.encode(f.name), data = enc.encode(f.text), c = crc32(data);
    const head = [le(0x04034b50,4), le(20,2), le(0,2), le(0,2), le(0,2), le(0x21,2), le(c,4), le(data.length,4), le(data.length,4), le(nm.length,2), le(0,2), nm];
    const len = head.reduce((a,x) => a + x.length, 0) + data.length; parts.push(...head, data);
    cen.push(le(0x02014b50,4), le(20,2), le(20,2), le(0,2), le(0,2), le(0,2), le(0x21,2), le(c,4), le(data.length,4), le(data.length,4), le(nm.length,2), le(0,2), le(0,2), le(0,2), le(0,2), le(0,4), le(off,4), nm);
    off += len; });
  const cl = cen.reduce((a,x) => a + x.length, 0);
  return new Blob([...parts, ...cen, le(0x06054b50,4), le(0,2), le(0,2), le(files.length,2), le(files.length,2), le(cl,4), le(off,4), le(0,2)], { type:'application/zip' });
}
async function itradeZip(kind){
  const br = S.branches.find(b => b.id === S.br) || {}, site = br.code || 'MGAZ', tag = site === 'MGT' ? 'AJMAN' : 'ALQUOZ';
  const M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'], p = S.date.split('-'), day = p[2] + ' ' + M[+p[1]-1] + ' ' + p[0];
  const [days, st, sl] = await Promise.all([q(sb.from('van_day').select('id,salesman_id').eq('branch_id', S.br).eq('business_date', S.date)),
    q(sb.from('staff').select('id,name,itrade_name').eq('branch_id', S.br)),
    fetchAll(() => sb.from('sales_lines').select('salesman_id,itrade_user,item_id,tran_type,qty').eq('branch_id', S.br).eq('tran_date', S.date).eq('cancelled', false))]);
  const lines = days.length ? await byIds(kind === 'LOADING' ? 'loading_lines' : 'return_lines', '*', 'van_day_id', days.map(d => d.id)) : [];
  const own = (r, s) => !r.itrade_user || !s.itrade_name || r.itrade_user.trim().toUpperCase() === s.itrade_name.trim().toUpperCase();
  const code = it => it.barcode || it.itrade_code, files = [];
  st.forEach(s => {
    const dm = days.filter(d => d.salesman_id === s.id).map(d => d.id), q1 = {};
    lines.filter(l => dm.includes(l.van_day_id)).forEach(l => { const it = item(l.item_id); if (it.item_type === 'RAW_EGG') return;
      q1[l.item_id] = (q1[l.item_id] || 0) + (kind === 'LOADING' ? num(l.qty) : num(l.good) + num(l.damage) + num(l.expiry) + num(l.waste) + num(l.foc)); });
    sl.filter(r => r.salesman_id === s.id && r.item_id).forEach(r => { const it = item(r.item_id), mine = own(r, s);
      if (it.item_type === 'RAW_EGG') { if (mine && (kind === 'LOADING' ? r.tran_type === 'CR' : r.tran_type !== 'CR')) q1[r.item_id] = (q1[r.item_id] || 0) + Math.abs(num(r.qty)); }
      else if (kind === 'LOADING' && !mine && r.tran_type === 'CR') q1[r.item_id] = (q1[r.item_id] || 0) - num(r.qty); });   // billed by the store: already moved
    const L = Object.entries(q1).map(([id, v]) => [item(+id), Math.round(v * 1000) / 1000]).filter(([it, v]) => v > 0 && code(it))
      .sort((a,b) => (a[0].display_order||0) - (b[0].display_order||0)).map(([it, v]) => `${site},${code(it)},,${v}`);
    if (L.length) files.push({ name:`${s.name.replace(/[\\\/:*?"<>|]+/g,' ').trim().toUpperCase()}_${kind}_${day}.txt`, text:L.join('\r\n') + '\r\n' });
  });
  if (!files.length) return toast(`No ${kind.toLowerCase()} found for ${day}.`, false);
  const a = document.createElement('a'); a.href = URL.createObjectURL(makeZip(files)); a.download = `${tag} ${kind} ${day}.zip`; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast(`Downloaded ${a.download} · ${files.length} salesman file${files.length === 1 ? '' : 's'}`);
}

async function fetchAll(mk){ const out = []; for (let i = 0; ; i += 1000) { const d = await q(mk().range(i, i + 999)); out.push(...d); if (d.length < 1000) break; } return out; }
async function byIds(table, cols, key, ids){ const out = []; for (let i = 0; i < ids.length; i += 150) { const part = ids.slice(i, i + 150); out.push(...await fetchAll(() => sb.from(table).select(cols).in(key, part))); } return out; }
const RC = {};   // small cache for one page visit
async function cached(k, f){ if (!RC[k]) RC[k] = f().catch(e => { delete RC[k]; throw e; }); return RC[k]; }
const clearCache = () => Object.keys(RC).forEach(k => delete RC[k]);
const rk = () => S.br + '|' + S.from + '|' + S.date;

// generic table: cols = [{k, l, left, f(row)->value, sum:true, money:true, cls(row)}]
function table(cols, rows, opt = {}){
  const val = (c, r) => c.f ? c.f(r) : r[c.k];
  const show = (c, v) => v === '' || v == null ? '' : c.money ? money(v) : typeof v === 'number' ? r2(v) : esc(v);
  const tot = cols.some(c => c.sum) && rows.length ? `<tr class="tot">${cols.map((c,i) => `<td class="${c.left?'l':''}">${i === 0 ? 'Total' : c.sum ? show(c, rows.reduce((a,r) => a + num(val(c,r)), 0)) : ''}</td>`).join('')}</tr>` : '';
  return rows.length ? `<div class="tw"${opt.max ? ` style="max-height:${opt.max}px"` : ''}><table><tr>${cols.map(c => `<th class="${c.left?'l':''}">${esc(c.l)}</th>`).join('')}</tr>
    ${rows.map((r,ri) => `<tr${opt.click ? ` data-row="${ri}" style="cursor:pointer"` : ''}>${cols.map(c => { const v = val(c, r); return `<td class="${c.left?'l':''} ${c.cls ? c.cls(r) : ''}">${c.html ? c.html(r) : show(c, v)}</td>`; }).join('')}</tr>`).join('')}${tot}</table></div>`
    : `<p class="muted">${opt.empty || 'No data for this period.'}</p>`;
}
const bindRows = (root, rows, fn) => root.querySelectorAll('[data-row]').forEach(tr => tr.onclick = () => fn(rows[+tr.dataset.row]));
async function toExcel(name, sheets){   // sheets: [[sheetName, cols, rows]]
  const XLSX = await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm'), wb = XLSX.utils.book_new(), brn = S.branches.find(b => b.id === S.br)?.name || '';
  sheets.forEach(([sn, cols, rows]) => {
    const val = (c, r) => { const v = c.f ? c.f(r) : r[c.k]; return typeof v === 'number' ? r2(v) : v ?? ''; };
    const aoa = [[`MAHRJAN — ${brn} — ${sn} — ${S.from && RANGE.has(S.tab) ? S.from + ' to ' : ''}${S.date}`], cols.map(c => c.l), ...rows.map(r => cols.map(c => val(c, r)))];
    if (cols.some(c => c.sum)) aoa.push(cols.map((c,i) => i === 0 ? 'Total' : c.sum ? r2(rows.reduce((a,r) => a + num(c.f ? c.f(r) : r[c.k]), 0)) : ''));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), sn.replace(/[\/\\?*\[\]:]/g,'-').slice(0,31));
  });
  XLSX.writeFile(wb, `${name} - ${brn} - ${RANGE.has(S.tab) && S.from !== S.date ? S.from + ' to ' : ''}${S.date}.xlsx`);
}

function aggregate(rows, keyF, init, add){ const m = new Map(); rows.forEach(r => { const k = keyF(r); if (k == null) return; if (!m.has(k)) m.set(k, init(r)); add(m.get(k), r); }); return [...m.values()]; }

        <tr class="tot"><td></td><td class="l" colspan="5">Total</td><td>${money(tin)}</td><td>${money(tout)}</td>${E ? '<td class="noprint"></td>' : ''}</tr></table></div>

    $('#add').onclick = () => { lines.push({ line_type:'PAYMENT', ref:'', party:'', note:'', for_date:'', amount:0 }); draw(); };
    $('#sv').onclick = async () => { const bad = lines.findIndex(l => !l.party.trim() || num(l.amount) <= 0); if (bad > -1) return toast(`Line ${bad+1}: particulars and amount are needed`, false);
      await rpc('save_petty_cash', { p_branch:S.br, p_date:S.date, p_lines:lines.map(l => ({ ...l, for_date:l.line_type === 'DEPOSIT' ? l.for_date : '' })) }); toast('Petty cash saved'); vPetty(); };
    bindTools('Petty cash', [['Petty cash', [{k:'line_type',l:'Type'},{k:'ref',l:'Ref'},{k:'party',l:'Particulars'},{k:'note',l:'Narration'},{k:'for_date',l:'For date'},{l:'In',f:l=>pdir(l.line_type)>0?num(l.amount):'',sum:1},{l:'Out',f:l=>pdir(l.line_type)<0?num(l.amount):'',sum:1}], lines]]);
  };
  draw();
}

// ---------- STAFF (admin) ----------
async function vStaff(){
  loading(); const st = await q(sb.from('staff').select('*').order('name'));
  const roles = ['ADMIN','ACCOUNTANT','RECEIVER','SALESMAN','PACKER','VIEWER'];
  $('#v').innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Staff and access</h3>${tools()}</div>
    <div class="notice" style="margin-bottom:12px">To give someone a login: Supabase → Authentication → Add user, email <b>name${EMAIL_DOMAIN}</b> (as written here, lowercase, spaces removed). It links to the staff record automatically when "Can log in" is ticked.</div>
    <div class="tw"><table><tr><th class="l">Name</th><th>Role</th><th>Branch</th><th>Can log in</th><th>Active</th><th></th></tr>
    ${st.map(s => `<tr data-s="${s.id}"><td class="l">${esc(s.name)}</td><td><select data-k="role">${roles.map(r => `<option ${r===s.role?'selected':''}>${r}</option>`).join('')}</select></td>
      <td><select data-k="branch_id"><option value="">Both</option>${S.branches.map(b => `<option value="${b.id}" ${b.id===s.branch_id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></td>
      <td><input type="checkbox" data-k="can_login" ${s.can_login?'checked':''}></td><td><input type="checkbox" data-k="active" ${s.active?'checked':''}></td><td><button data-sv="${s.id}">Save</button></td></tr>`).join('')}</table></div></div>`;
  $('#v').querySelectorAll('[data-sv]').forEach(b => b.onclick = async () => { const tr = b.closest('tr'), v = k => tr.querySelector(`[data-k="${k}"]`);
    await q(sb.from('staff').update({ role:v('role').value, branch_id:v('branch_id').value ? +v('branch_id').value : null, can_login:v('can_login').checked, active:v('active').checked }).eq('id', +tr.dataset.s));
    toast('Saved ' + tr.cells[0].textContent); });
  bindTools('Staff', [['Staff', [{k:'name',l:'Name'},{k:'role',l:'Role'},{l:'Branch',f:s=>S.branches.find(b=>b.id===s.branch_id)?.name||'Both'},{l:'Can log in',f:s=>s.can_login?'Yes':'No'},{l:'Active',f:s=>s.active?'Yes':'No'}], st]]);
}


// ---------- ROLE ACCESS (ADMIN) ----------
async function vAccess(){
  loading();
  const [M, A] = await Promise.all([sb.from('role_modules').select('*').order('sort'), sb.from('role_access').select('*')]);
  if (M.error || A.error) { $('#v').innerHTML = `<div class="card"><div class="notice">Role access is not installed in the database yet. Run <b>docs/sql/ROLE ACCESS - CREATE.sql</b> in the Supabase SQL editor once (after PETTY CASH - CREATE.sql), then reload this page.</div></div>`; return; }
  const roles = ['ACCOUNTANT','RECEIVER','SALESMAN','VIEWER','PACKER'];
  const get = (r, m) => A.data.find(a => a.role === r && a.module === m) || { can_view:false, can_edit:false };
  $('#v').innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Role access</h3><div class="row" style="margin:0"><button id="rs">Undo changes</button><button class="p" id="sv">Save access</button></div></div>
    <p class="muted" style="margin-bottom:12px">View = the page shows. Edit = can post or change (Edit includes View). ADMIN always has full access. Branch rules and "salesman sees only his own day" always apply. Every change is kept in the audit log.</p>
    <div class="tw"><table><tr><th class="l" rowspan="2">Page / action</th><th rowspan="2">ADMIN</th>${roles.map(r => `<th colspan="2">${r}</th>`).join('')}</tr>
      <tr>${roles.map(() => '<th>View</th><th>Edit</th>').join('')}</tr>
      ${M.data.map((m,i) => (i === 0 || M.data[i-1].grp !== m.grp ? `<tr class="tot"><td class="l" colspan="${2 + roles.length*2}">${esc(m.grp)}</td></tr>` : '') + `<tr><td class="l">${esc(m.label)}</td><td>Full</td>
        ${roles.map(r => { const a = get(r, m.module); return `<td><input type="checkbox" data-r="${r}" data-m="${m.module}" data-k="can_view" ${a.can_view?'checked':''}></td>
          <td>${m.has_edit ? `<input type="checkbox" data-r="${r}" data-m="${m.module}" data-k="can_edit" ${a.can_edit?'checked':''}>` : '—'}</td>`; }).join('')}</tr>`).join('')}
    </table></div></div>`;
  $('#v').querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => {
    const sib = k => $(`input[data-r="${cb.dataset.r}"][data-m="${cb.dataset.m}"][data-k="${k}"]`, $('#v'));
    if (cb.dataset.k === 'can_edit' && cb.checked) sib('can_view').checked = true;
    if (cb.dataset.k === 'can_view' && !cb.checked && sib('can_edit')) sib('can_edit').checked = false; });
  $('#rs').onclick = vAccess;
  $('#sv').onclick = async () => {
    const rows = []; roles.forEach(r => M.data.forEach(m => { const v = k => !!$(`input[data-r="${r}"][data-m="${m.module}"][data-k="${k}"]`, $('#v'))?.checked;
      rows.push({ role:r, module:m.module, can_view:v('can_view'), can_edit:v('can_edit') }); }));
    const n = await rpc('save_role_access', { p_rows:rows }); toast(n ? `Saved · ${n} change(s). Users see them after signing in again.` : 'No changes'); vAccess(); };
}

// ---------- DATA CHECK ----------
async function vCheck(){
  loading(); const [sales, days] = await Promise.all([getSales(), getDays()]);
  const noItem = aggregate(sales.filter(r => !r.item_id), r => r.item_code, r => ({ code:r.item_code, name:r.item_name, n:0 }), (o) => o.n++);
  const noSm = aggregate(sales.filter(r => !r.salesman_id), r => r.sales_executive || r.itrade_user || '(blank)', r => ({ who:r.sales_executive || r.itrade_user || '(blank)', n:0, net:0 }), (o,r) => { o.n++; o.net += num(r.net_incl_vat); });
  const noDay = aggregate(sales.filter(r => r.salesman_id && !r.van_day_id), r => r.tran_date + '|' + r.salesman_id, r => ({ date:r.tran_date, sm:smNm(r.salesman_id), inv:new Set() }), (o,r) => o.inv.add(r.invoice_no)).map(o => ({ ...o, n:o.inv.size }));
  const open = days.filter(d => d.status !== 'CLOSED' && d.business_date < today()).map(d => ({ date:d.business_date, sm:smNm(d.salesman_id), status:d.status }));
  $('#v').innerHTML = `<div class="kpis">${kpi('Items not in master', noItem.length)}${kpi('Sales with no salesman', noSm.reduce((a,o)=>a+o.n,0) + ' lines')}${kpi('Sales with no van day', noDay.length)}${kpi('Van days not closed', open.length)}</div>
    <div class="card"><h3>Item codes not in the item master</h3>${table([{k:'code',l:'iTrade code'},{k:'name',l:'Item name',left:1},{k:'n',l:'Lines',sum:1}], noItem, { empty:'All item codes are mapped.' })}</div>
    <div class="card"><h3>Sales not linked to a salesman (store sales and unknown names)</h3>${table([{k:'who',l:'iTrade user / sales executive',left:1},{k:'n',l:'Lines',sum:1},{k:'net',l:'AED',money:1,sum:1}], noSm, { empty:'None.' })}</div>
    <div class="card"><h3>Salesman sales with no van day (not loaded)</h3>${table([{k:'date',l:'Date'},{k:'sm',l:'Salesman',left:1},{k:'n',l:'Invoices',sum:1}], noDay, { empty:'None.' })}</div>
    <div class="card"><h3>Van days not closed (before today)</h3>${table([{k:'date',l:'Date'},{k:'sm',l:'Salesman',left:1},{k:'status',l:'Status'}], open, { empty:'All closed.' })}</div>`;
}

// ---------- REQUIREMENT ----------
async function vRequirement(){
  const isSm = S.me.role === 'SALESMAN';
  S.rsm = isSm ? S.me.id : S.rsm; S.rdate = S.rdate || today(1);
  $('#v').innerHTML = `<div class="card"><h3>Requirement (cartons)</h3><div class="row">
    ${isSm ? '' : `<label>Salesman<select id="sm"><option value="">Select</option>${smOptions(S.rsm)}</select></label>`}
    <label>For date<input type="date" id="rd" value="${S.rdate}"></label></div><div id="g"></div></div>`;
  $('#sm') && ($('#sm').onchange = e => { S.rsm = +e.target.value || null; fill(); });
  $('#rd').onchange = e => { S.rdate = e.target.value; fill(); };
  async function fill(){
    if (!S.rsm) { $('#g').innerHTML=''; return; }
    const req = await q(sb.from('requirement_lines').select('item_id,qty_cartons').eq('salesman_id', S.rsm).eq('required_date', S.rdate));
    $('#g').innerHTML = `<div class="tw"><table><tr><th class="l">Item</th><th>Cartons</th></tr>${sellItems().map(it => `<tr data-id="${it.id}"><td class="l">${esc(it.short_name||it.name)}</td>
      <td><input type="number" min="0" step="0.5" value="${req.find(r=>r.item_id===it.id)?.qty_cartons ?? ''}"></td></tr>`).join('')}</table></div>
      <div class="row" style="margin-top:8px"><button class="p" id="sv">Save requirement</button></div>`;
    $('#sv').onclick = async () => {
      const ln = [...$('#g').querySelectorAll('tr[data-id]')].map(tr => ({ item_id:+tr.dataset.id, qty_cartons:num($('input',tr).value) })).filter(x=>x.qty_cartons>0);
      await rpc('save_requirement', { p_salesman:S.rsm, p_date:S.rdate, p_lines:ln }); toast('Requirement saved');
    };
  }
  await fill();
}
</script>
